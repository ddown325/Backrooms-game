<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",

<script type="module">
/* ================================================================
   LEVEL 0 - THE BACKROOMS  (v18)
   single file / infinite generation (RANDOM seed every run) /
   world-space UV textures / fully baked vertex lighting /
   ALWAYS-ON HDR tape post fx.
   v18: THE GRID MAZE - "too curvy, not enough maze".
   - WORLD: the v17 smooth contour field is gone. walls are
     axis-aligned RUNS of edge cells on a 3.2m lattice - straight
     flanks, hard 90 corners, structured wall lines (6.4/9.6m
     bands), FORCED junction gates, hashed fin stubs, dense
     pockets, pillar halls with 1.04m square columns, a macro
     open/dense/hall zone field. pure edge grammar = identical in
     every window = zero seams, by construction.
   - THE AI LAYER v2: design-bible bands measured per chunk by the
     RUNTIME CRITIC (wall-edge density; interior fin re-roll in the
     private 9.6m-inset region); sealed cells rescued by a pure
     per-cell rule; constants tuned offline over 8 seeds.
   - DOORS: rare cased doors on long interior runs (~1 per 145m of
     wall), outlets/peels/plenums only. nothing else.
   - TEXTURES: v17 line-free periodic wallpaper + world UVs kept
     verbatim - "textures that connect and stop leaving lines".
   - MOVEMENT: v16 stuck-key fix + fixed-timestep + interpolation
     kept verbatim; collision = circle vs axis-aligned run
     centerlines + column AABBs.
   - VHS always on, seed random every run (carried since v16).
   ================================================================ */

import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
/* ---------------- utils ---------------- */
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const damp  = (c,t,r,dt)=> c + (t-c)*(1-Math.exp(-r*dt));
function h2i(x, y, s){
 let h = (Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263) + Math.imul(s|0, 144066263))|0;
 h = Math.imul(h ^ (h>>>13), 1274126177);
 h ^= h>>>16;
 return (h>>>0)/4294967296;
}
function vnoise(x, y, s, wl){
 const gx=Math.floor(x/wl), gy=Math.floor(y/wl);
 const fx=x/wl-gx, fy=y/wl-gy;
 const u=fx*fx*(3-2*fx), v=fy*fy*(3-2*fy);
 const a=h2i(gx,gy,s), b=h2i(gx+1,gy,s), c=h2i(gx,gy+1,s), d=h2i(gx+1,gy+1,s);
 return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
}

/* ---------------- renderer / scene / camera ---------------- */
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
const BASE_PR = Math.min(devicePixelRatio||1, 1.25);
renderer.setPixelRatio(BASE_PR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.55;
/* v12: NO shadow maps, NO dynamic lights - the fixture light is
   fully baked per-vertex (see buildBake) with real 2D wall
   occlusion, so light can never bleed under or through a wall,
   and every fixture on the lattice contributes, not just the
   nearest 8. the only dynamic light left is the soft warm
   hemisphere that keeps shadowed zones readable. */
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x272319);   // v16: desaturated murk
scene.fog = new THREE.FogExp2(0x272319, 0.027);

const camera = new THREE.PerspectiveCamera(74, innerWidth/innerHeight, 0.06, 120);
camera.rotation.order = 'YXZ';
function canvasTex(w, h, draw){
 const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
 draw(cv.getContext('2d'), w, h);
 const t = new THREE.CanvasTexture(cv);
 t.wrapS = t.wrapT = THREE.RepeatWrapping;
 t.colorSpace = THREE.SRGBColorSpace;
 t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
 return t;
}
/* ---- v17 WALLPAPER: "textures that connect and stop leaving lines".
   The v16 wall had deliberate vertical structures (16cm grasscloth
   bands, 32cm luminance banding, 64cm panel seams, sun-faded roll
   tints) - THAT was the line soup. v17 is a LINE-FREE continuous
   grasscloth: fine reed grain + cloth mottle + damp stains, every
   stochastic element drawn with 9x WRAP so the 5.12m u-repeat is
   perfectly seamless, v = full 3.02m wall height (never stacks).
   World-space UVs + zero directional structures = textures connect
   across every wall, corner and chunk border with nothing to see. */
const texWall = canvasTex(4096, 2048, (g,w,h)=>{
 g.fillStyle='#b4a87c'; g.fillRect(0,0,w,h);
 const wrap9=(fn)=>{ for(const ox of [-w,0,w]) for(const oy of [-h,0,h]) fn(ox,oy); };
 /* cloth mottle: large soft tone patches, wrap-drawn (periodic) */
 for(let i=0;i<220;i++){
  const r=120+Math.random()*300, x=Math.random()*w, y=Math.random()*h;
  const dk=Math.random()<0.5;
  wrap9((ox,oy)=>{
   const gr=g.createRadialGradient(x+ox,y+oy,r*0.2,x+ox,y+oy,r);
   gr.addColorStop(0, dk?'rgba(64,55,30,0.030)':'rgba(232,228,206,0.030)');
   gr.addColorStop(1,'rgba(0,0,0,0)');
   g.fillStyle=gr; g.beginPath(); g.arc(x+ox,y+oy,r,0,7); g.fill();
  });
 }
 /* fine grasscloth reeds: soft vertical fiber strokes, wrap-drawn */
 for(let i=0;i<9000;i++){
  const x=Math.random()*w, y=Math.random()*h, l=20+Math.random()*110;
  const dk=Math.random()<0.5;
  wrap9((ox,oy)=>{
   g.fillStyle=dk?'rgba(58,48,24,'+(0.012+Math.random()*0.014).toFixed(3)+')'
                 :'rgba(236,232,210,'+(0.010+Math.random()*0.012).toFixed(3)+')';
   g.fillRect(x+ox, y+oy, 2, l);
  });
 }
 /* paper grain speckle */
 for(let i=0;i<14000;i++){
  const x=Math.random()*w, y=Math.random()*h;
  const dk=Math.random()<0.5;
  wrap9((ox,oy)=>{
   g.fillStyle=dk?'rgba(58,48,24,0.028)':'rgba(238,234,214,0.022)';
   g.fillRect(x+ox, y+oy, 1, 1);
  });
 }
 /* paper punctures / old pinholes */
 for(let i=0;i<110;i++){
  const x=Math.random()*w, y=Math.random()*h*0.9;
  wrap9((ox,oy)=>{
   g.fillStyle='rgba(26,18,6,'+(0.10+Math.random()*0.12).toFixed(3)+')';
   g.fillRect(x+ox, y+oy, 1+Math.random()*2, 1+Math.random()*2);
  });
 }
 /* damp stains (MULTIPLY - wet patches, organic blobs not lines) */
 g.globalCompositeOperation='multiply';
 for(let i=0;i<26;i++){
  const r=70+Math.random()*200, x=Math.random()*w;
  const y=h*(Math.random()<0.3?0.18:0.45)+Math.random()*h*0.5;
  wrap9((ox,oy)=>{
   const gr=g.createRadialGradient(x+ox,y+oy,4,x+ox,y+oy,r);
   gr.addColorStop(0,'rgba(70,52,16,0.14)'); gr.addColorStop(1,'rgba(70,52,16,0)');
   g.fillStyle=gr; g.beginPath(); g.arc(x+ox,y+oy,r,0,7); g.fill();
   if(Math.random()<0.45){
    g.strokeStyle='rgba(58,42,13,0.10)'; g.lineWidth=2+Math.random()*3;
    g.beginPath(); g.arc(x+ox,y+oy,r*(0.55+Math.random()*0.2),0,7); g.stroke();
   }
  });
 }
 /* huge wall-wide damp zones (wet look) */
 for(let i=0;i<7;i++){
  const r=300+Math.random()*280, x=Math.random()*w, y=h*0.3+Math.random()*h*0.5;
  wrap9((ox,oy)=>{
   const gr=g.createRadialGradient(x+ox,y+oy,40,x+ox,y+oy,r);
   gr.addColorStop(0,'rgba(64,47,15,0.10)'); gr.addColorStop(1,'rgba(64,47,15,0)');
   g.fillStyle=gr; g.beginPath(); g.arc(x+ox,y+oy,r,0,7); g.fill();
  });
 }
 g.globalCompositeOperation='source-over';
 /* a few faint drips (streaks, not stripes) */
 for(let i=0;i<12;i++){
  const x=Math.random()*w, y=Math.random()*h*0.55, l=60+Math.random()*200;
  wrap9((ox,oy)=>{
   g.fillStyle='rgba(58,44,15,0.05)';
   g.fillRect(x+ox, y+oy, 1+Math.random()*2, l);
  });
 }
 /* two-tier floor grime band (y-based, v maps 1:1 to wall height) */
 let lg=g.createLinearGradient(0,h-260,0,h);
 lg.addColorStop(0,'rgba(36,27,10,0.34)');
 lg.addColorStop(0.10,'rgba(36,27,10,0.30)');
 lg.addColorStop(0.55,'rgba(36,27,10,0.10)');
 lg.addColorStop(1,'rgba(36,27,10,0)');
 g.fillStyle=lg; g.fillRect(0,h-260,w,260);
 for(let i=0;i<40;i++){
  const x=Math.random()*w, y=h-40-Math.random()*180;
  wrap9((ox,oy)=>{
   g.fillStyle='rgba(30,22,8,'+(0.05+Math.random()*0.08).toFixed(3)+')';
   g.fillRect(x+ox, y+oy, 3+Math.random()*8, 2+Math.random()*5);
  });
 }
 /* ceiling-line AO */
 lg=g.createLinearGradient(0,0,0,80);
 lg.addColorStop(0,'rgba(28,22,9,0.15)'); lg.addColorStop(1,'rgba(28,22,9,0)');
 g.fillStyle=lg; g.fillRect(0,0,w,80);
 /* floor-line scuffs */
 for(let i=0;i<70;i++){
  const x=Math.random()*w, y=h-24-Math.random()*130;
  wrap9((ox,oy)=>{
   g.strokeStyle='rgba(26,18,6,'+(0.06+Math.random()*0.11).toFixed(3)+')';
   g.lineWidth=1+Math.random()*2.5;
   g.beginPath(); g.moveTo(x+ox,y+oy);
   g.lineTo(x+ox+(Math.random()-0.5)*46, y+oy+(Math.random()-0.5)*10); g.stroke();
  });
 }
 /* chalky impact marks at body height */
 for(let i=0;i<22;i++){
  const x=Math.random()*w, y=h*0.42+Math.random()*h*0.22, r=8+Math.random()*26;
  wrap9((ox,oy)=>{
   const gr=g.createRadialGradient(x+ox,y+oy,1,x+ox,y+oy,r);
   gr.addColorStop(0,'rgba(255,250,226,0.10)'); gr.addColorStop(1,'rgba(255,250,226,0)');
   g.fillStyle=gr; g.beginPath(); g.arc(x+ox,y+oy,r,0,7); g.fill();
  });
 }
});


/* damp short-pile carpet (canon: brownish-beige - it only LOOKS
   yellow under the harsh fluorescents). v15: deeper base, higher
   micro-contrast loops, two-directional nap shear (rows + cross
   columns), multiplied damp blotches with tide rings, dark spill
   cores, worn-to-backing pale patches, traffic sheen. 2048px = 4m. */
const texCarpet = canvasTex(2048, 2048, (g,w,h)=>{
 g.fillStyle='#6f6854'; g.fillRect(0,0,w,h);   /* v16: grey-olive, refs read brown-grey not mustard */
 /* per-meter tile tint jitter (4x4 tiles of 512px = 1m each) */
 for(let ty=0;ty<4;ty++)for(let tx=0;tx<4;tx++){
  const tv=(Math.random()-0.5)*0.095;
  g.fillStyle = tv<0 ? 'rgba(0,0,0,'+(-tv).toFixed(3)+')'
                     : 'rgba(212,206,172,'+tv.toFixed(3)+')';
  g.fillRect(tx*512, ty*512, 512, 512);
 }
 for(let y=0;y<h;y+=3){                                 // directional nap rows
  g.fillStyle='rgba(0,0,0,'+(0.013+0.015*Math.random()).toFixed(3)+')';
  g.fillRect(0,y,w,1);
 }
 for(let x=0;x<w;x+=7){                                 // v15: cross-shear columns
  g.fillStyle='rgba(0,0,0,'+(0.008+0.010*Math.random()).toFixed(3)+')';
  g.fillRect(x,0,1,h);
 }
 for(let i=0;i<260000;i++){                     // v15: higher-contrast loop speckle
  const b = Math.random();
  g.fillStyle = b<0.5 ? 'rgba(22,17,7,'+(0.075+Math.random()*0.10).toFixed(3)+')'
                      : 'rgba(188,180,150,'+(0.055+Math.random()*0.07).toFixed(3)+')';
  g.fillRect(Math.random()*w, Math.random()*h, 2, 2);
 }
 for(let y=2;y<h;y+=4)for(let x=2;x<w;x+=4){    // pinholes at loop corners
  if(Math.random()<0.55){ g.fillStyle='rgba(16,12,4,0.16)'; g.fillRect(x,y,1,1); }
 }
 g.globalCompositeOperation='multiply';         // v15: damp reads WET now
 for(let i=0;i<70;i++){                         // organic damp blotches + tide rings
  const r=50+Math.random()*180, x=Math.min(Math.max(r,Math.random()*w),w-r), y=Math.random()*h;
  const gr=g.createRadialGradient(x,y,5,x,y,r);
  gr.addColorStop(0,'rgba(22,17,6,'+(0.085+Math.random()*0.09).toFixed(3)+')');
  gr.addColorStop(1,'rgba(22,17,6,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  if(r>140 && Math.random()<0.5){
   g.strokeStyle='rgba(20,15,5,0.06)'; g.lineWidth=3;
   g.beginPath(); g.arc(x,y,r*0.6,0,7); g.stroke();
  }
 }
 for(let i=0;i<9;i++){                          // dark spill cores
  const r=30+Math.random()*70, x=Math.min(Math.max(r,Math.random()*w),w-r), y=Math.random()*h;
  const gr=g.createRadialGradient(x,y,2,x,y,r);
  gr.addColorStop(0,'rgba(14,10,4,0.19)'); gr.addColorStop(1,'rgba(14,10,4,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
 }
 for(let i=0;i<6;i++){                          // room-scale damp zones
  const r=280+Math.random()*300, x=Math.min(Math.max(r,Math.random()*w),w-r), y=Math.random()*h;
  const gr=g.createRadialGradient(x,y,40,x,y,r);
  gr.addColorStop(0,'rgba(20,15,5,'+(0.09+Math.random()*0.06).toFixed(3)+')');
  gr.addColorStop(1,'rgba(20,15,5,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
 }
 g.globalCompositeOperation='source-over';
 for(let i=0;i<3;i++){                          // v15: worn-to-backing pale patches
  const r=90+Math.random()*160, x=Math.min(Math.max(r,Math.random()*w),w-r), y=Math.random()*h;
  const gr=g.createRadialGradient(x,y,10,x,y,r);
  gr.addColorStop(0,'rgba(206,200,168,0.10)'); gr.addColorStop(1,'rgba(206,200,168,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
 }
 for(let i=0;i<5;i++){                          // flattened-nap traffic sheen
  const y=Math.random()*h, a=0.03+Math.random()*0.025;
  const lg=g.createLinearGradient(0,y,0,y+260);
  lg.addColorStop(0,'rgba(0,0,0,0)');
  lg.addColorStop(0.5,'rgba(202,198,172,'+a.toFixed(3)+')');
  lg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=lg; g.fillRect(0,y,w,260);
 }
});
/* 2ft drop-ceiling grid (0.615m tiles), aged mineral fiber. v15:
   deeper fissures, per-tile UNEVEN-LAID tilt shading, 5 multiply
   water stains with double rings, T-bars with grime patches.
   2048px = 2.46m = 4x4 tiles - a real dropped ceiling never reads
   as one photocopied tile. */
const texCeil = canvasTex(2048, 2048, (g,w,h)=>{
 g.fillStyle='#d8d5c9'; g.fillRect(0,0,w,h);   /* v16: near-neutral */
 for(let tx=0;tx<4;tx++)for(let ty=0;ty<4;ty++){      // per-tile aging (strong)
  const tv=(Math.random()-0.5);
  g.fillStyle = tv<0 ? 'rgba(70,62,45,'+(-tv*0.15).toFixed(3)+')'
                     : 'rgba(255,252,240,'+(tv*0.07).toFixed(3)+')';
  g.fillRect(tx*512, ty*512, 512, 512);
  /* v15: uneven-laid tile tilt - one faint directional shade per tile */
  const ax=(Math.random()-0.5)*0.045, ay=(Math.random()-0.5)*0.045;
  const lgx = ax>0 ? g.createLinearGradient(tx*512,0,tx*512+512,0) : g.createLinearGradient(tx*512+512,0,tx*512,0);
  lgx.addColorStop(0,'rgba(255,252,240,'+Math.abs(ax).toFixed(3)+')');
  lgx.addColorStop(1,'rgba(40,35,26,'+(Math.abs(ax)*0.8).toFixed(3)+')');
  g.fillStyle=lgx; g.fillRect(tx*512,ty*512,512,512);
  const lgy = ay>0 ? g.createLinearGradient(0,ty*512,0,ty*512+512) : g.createLinearGradient(0,ty*512+512,0,ty*512);
  lgy.addColorStop(0,'rgba(255,252,240,'+Math.abs(ay).toFixed(3)+')');
  lgy.addColorStop(1,'rgba(40,35,26,'+(Math.abs(ay)*0.8).toFixed(3)+')');
  g.fillStyle=lgy; g.fillRect(tx*512,ty*512,512,512);
 }
 for(let i=0;i<38000;i++){                      // mineral fiber speckle
  const x=Math.random()*w, y=Math.random()*h;
  if(x%512<14||x%512>498||y%512<14||y%512>498) continue;
  g.fillStyle='rgba(70,62,48,'+(0.05+Math.random()*0.10).toFixed(3)+')';
  g.fillRect(x,y,1+Math.random()*1.6, 1+Math.random()*1.6);
 }
 for(let i=0;i<14000;i++){                       // porous dark pinholes
  const x=Math.random()*w, y=Math.random()*h;
  if(x%512<14||x%512>498||y%512<14||y%512>498) continue;
  g.fillStyle='rgba(38,33,24,'+(0.09+Math.random()*0.11).toFixed(3)+')';
  g.fillRect(x,y,1,1);
 }
 for(let i=0;i<5200;i++){                        // v15: doubled fissure strokes
  const x=Math.random()*w, y=Math.random()*h;
  if(x%512<16||x%512>496||y%512<16||y%512>496) continue;
  const a=Math.random()*Math.PI, l=3+Math.random()*6;
  g.strokeStyle='rgba(60,53,40,'+(0.05+Math.random()*0.07).toFixed(3)+')';
  g.lineWidth=1;
  g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*l, y+Math.sin(a)*l); g.stroke();
 }
 const stain=(x0,y0,rr,al)=>{                   // v15: multiply water stain w/ double rings
  g.globalCompositeOperation='multiply';
  let gr=g.createRadialGradient(x0,y0,10,x0,y0,rr);

/* v15: heightfield -> normal map generator (wraps seamlessly, so
   the relief tiles with ZERO seams on the same UV as the albedo).
   the wallpaper gets real paper relief (stripe steps, pinstripe
   grooves, reed stalks, panel seams), the drop ceiling gets
   raised T-bars + fissured tile faces + uneven tile tilt - the
   micro-relief finally SHADES under the overhead hemisphere. */
function normalTex(size, draw, strength){
 const cv=document.createElement('canvas'); cv.width=cv.height=size;
 draw(cv.getContext('2d'), size);
 const g2=cv.getContext('2d');
 const img=g2.getImageData(0,0,size,size), d=img.data;
 const out=document.createElement('canvas'); out.width=out.height=size;
 const og=out.getContext('2d');
 const oimg=og.createImageData(size,size), od=oimg.data;
 const H2=(x,y)=>{ x=(x%size+size)%size; y=(y%size+size)%size; return d[(y*size+x)*4]; };
 for(let y=0;y<size;y++)for(let x=0;x<size;x++){
  const hx=(H2(x+1,y)-H2(x-1,y))*(strength/255);   // canvas y is down; GL v is up
  const hy=(H2(x,y+1)-H2(x,y-1))*(strength/255);   // -> n = (-hx, +hy, 1)
  const il=1/Math.sqrt(hx*hx+hy*hy+1);
  const k=(y*size+x)*4;
  od[k]  =(-hx*il*0.5+0.5)*255;
  od[k+1]=( hy*il*0.5+0.5)*255;
  od[k+2]= il*255;
  od[k+3]=255;
 }
 og.putImageData(oimg,0,0);
 const t=new THREE.CanvasTexture(out);
 t.wrapS=t.wrapT=THREE.RepeatWrapping;
 t.anisotropy=Math.min(8, renderer.capabilities.getMaxAnisotropy());
 return t;
}

     90-degree corners (perpendicular boxes, no z-fight).
   - THE MAZE: structured wall LINES (every 2-3 cells) carry long
     straight flanks with FORCED junction gates every ~5 cells, so
     corridors branch at real decision points; off the lines,
     hashed FIN stubs subdivide the wide bands; cells that would
     seal completely are rescued by a pure per-cell rule; the
     RUNTIME CRITIC re-rolls interior fins until the chunk's wall
     density lands in the bible band.
   - ZONES (2-octave-free single field, wl 72m): dense pockets
     (long runs + heavy fins = tight maze), normal bands (the
     classic 6.2m segmented corridors), pillar halls (lines pass
     but build nothing; 1.04m square columns on a 6.4m grid).
   - SPAWN: a carved 3.0m corridor through the origin cell column
     (z -38..+42, walls both sides, troffer line) - the player
     spawns INSIDE the iconic vanishing-point shot.
   - SEAMS: the grammar is a pure function of (SEED, edge index).
     Windows sample identical edges; the raster/bake/tints use
     only pure edges near borders; critic fins are >=9.6m inset
     (outside every neighbor's 8m window). Nothing to mismatch.
   ================================================================ */
const CS=32, H=3.02, GRID=0.615;
const PAD=8, FRES=0.5, WN=Math.round((CS+2*PAD)/FRES)+1;   // 97 samples/side
const WT=0.10, WT2=WT+0.032;          // wall half-thickness / baseboard
const LOAD_R=2, UNLOAD_R=3;           // 5x5 chunks (160m) + fog 0.027
let SEED=0;
const chunks=new Map();

/* ---- v18 grammar constants (design-bible bands: wall edge frac
   0.30-0.42, reach >=0.93, junctions >=0.08, dead ends 0.02-0.12,
   sight med 4-9m / p90 12-25m - all measured offline per seed) ---- */
const CELL=3.2, EPC=Math.round(CS/CELL);   // 10 cells per chunk side
const WP={
 zoneWL:72, denseLo:0.335, hallHi:0.70,
 LANE:8, laneGap:0.36,               // guaranteed corridor lattice: 25.6m pitch, flank feeder-gap fraction
 sb:6, gapW:0.30,                    // mass wall-line spacing: 2 cells (6.4m) / 30% 3 cells (9.6m)
 runWL:8.5, thrHi:0.88,             // long organic noise-cut openings on top of the gaps
 gapP:0.26, gapD:0.20,              // INDEPENDENT per-edge doorway gaps (normal/dense)
 gateEvery:7, gateP:0.30,            // forced junction openings along each line (maze rhythm)
 finN:0.12, finD:0.26,               // off-line wall stubs (fins)
 colHalf:0.52,                       // hall column half-size (1.04m squares)
 pDoor:0.055, wallLo:0.30, wallHi:0.44   // rare cased doors / critic band
};
const WS = ()=>{ return {
 s1:(SEED^0x51AB)|0, s2:(SEED^0x9E21)|0, s3:(SEED^0x33CC)|0,
 s4:(SEED^0xC011)|0, s5:(SEED^0xC013)|0, s6:(SEED^0x40A1)|0,
 s7:(SEED^0xF1A)|0, s8:(SEED^0x5A99)|0 }; };
let _SC=null;
function WSX(){ if(!_SC || _SC.s!==SEED){ _SC={s:SEED, w:WS()}; } return _SC.w; }

const wsmooth=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };

function wZone(x,z,s1){ return vnoise(x,z,s1,WP.zoneWL); }

/* ---- V18 PURE GRAMMAR START (harness extraction point) ---- */

/* wall-LINE presence: structured spacing in super-strips of 6 cells
   (19.2m). g=2 -> lines every 6.4m; 30% of strips run g=3 (9.6m).
   Deterministic and purely local: (k, SEED). */
function lineHas(k, axis){
 const w=WSX();
 const sb=Math.floor(k/WP.sb);
 const g=2+(h2i(sb*17+axis*3, 6161, w.s4)<WP.gapW?1:0);
 const anchor=Math.floor(sb*WP.sb/g)*g;
 return (k-anchor)%g===0;
}

/* THE LANE LATTICE: a guaranteed 3.2m corridor grid every 8 cells
   (25.6m), both axes - the connectivity carrier (percolation-safe
   by construction) AND the iconic endless-straight-corridor shot.
   Lane passages are always open; lane flanks are long clean runs
   with hashed feeder gaps into the maze mass; crossings are open
   4-way junction rooms. The player spawns on the (0,0) crossing. */
function laneMod(n){ return ((n%WP.LANE)+WP.LANE)%WP.LANE; }
function isLaneCol(i){ return laneMod(i)===0; }
function isLaneRow(j){ return laneMod(j)===0; }

/* THE EDGE GRAMMAR.  V-edge(i,j) = wall on x=i*CELL spanning
   z=[j,j+1]*CELL (between cells (i-1,j) and (i,j)).
   H-edge(i,j) = wall on z=j*CELL spanning x=[i,i+1]*CELL.
   Order: LATTICE (always wins) -> hall clear -> line/fins.
   Pure function of (SEED, i, j, axis) - identical in every window. */
function edgeWall(i, j, axis){
 const w=WSX();
 /* LANE LATTICE */
 if(axis===1){
  if(isLaneRow(j)) return false;                          // X-lane passage (all i)
  if(laneMod(i)===0 || laneMod(i)===1)                   // Z-lane flanks
   return h2i(i*13+j*7+17, 557, w.s5) >= WP.laneGap;
 }else{
  if(isLaneCol(i)) return false;                          // Z-lane passage (all j)
  if(laneMod(j)===0 || laneMod(j)===1)                   // X-lane flanks
   return h2i(i*13+j*7+34, 557, w.s5) >= WP.laneGap;
 }
 const cx = axis===1 ? i*CELL : (i+0.5)*CELL;
 const cz = axis===1 ? (j+0.5)*CELL : j*CELL;
 const zn = vnoise(cx, cz, w.s1, WP.zoneWL);
 const k = axis===1 ? i : j;          // the wall-line index
 const t = axis===1 ? j : i;          // position along the line
 if(zn>WP.hallHi) return false;       // pillar halls: only lanes + columns
 if(!lineHas(k, axis)){
  const p = zn<WP.denseLo ? WP.finD : WP.finN;
  return h2i(i*13+j*7+axis*29, 551, w.s5) < p;
 }
 /* forced junction gates - real branch points on every corridor */
 const ph = Math.floor(h2i(k*7+axis, 91, w.s6)*WP.gateEvery);
 if(((t-ph)%WP.gateEvery+WP.gateEvery)%WP.gateEvery===0
    && h2i(k*31+t*3+axis, 77, w.s6)<WP.gateP) return false;
 /* long organic openings where the run noise dips high */
 const v = vnoise((axis===1?cz:cx)/WP.runWL, k*7.31+axis*3.7, w.s8, 1);
 if(v>=WP.thrHi) return false;
 /* INDEPENDENT per-edge doorway gaps */
 const gp = zn<WP.denseLo ? WP.gapD : WP.gapP;
 return h2i(i*13+j*7+axis, 553, w.s5) >= gp;
}
/* fin probe with a critic attempt salt (attempt 0 = the base grammar) */
function finAt(i, j, axis, att){
 const w=WSX();
 const cx = axis===1 ? i*CELL : (i+0.5)*CELL;
 const cz = axis===1 ? (j+0.5)*CELL : j*CELL;
 const zn = vnoise(cx, cz, w.s1, WP.zoneWL);
 if(zn>WP.hallHi) return false;
 const p = zn<WP.denseLo ? WP.finD : WP.finN;
 return h2i(i*13+j*7+axis*29, 551+att*7919, w.s5) < p;
}

/* ---- RUNTIME CRITIC (v18): every chunk measures its own wall-edge
   fraction over its owned edges; if outside [wallLo, wallHi] it
   re-rolls FIN edges that are >= 3 cells (9.6m) inset on BOTH axes -
   deep inside the private region no neighbor window can see (their
   raster reaches 8m) - until the chunk lands closest to the band. */
const CRITIC = {chunks:0, rerolled:0, log:[]};

function sampleWorld(ci, cj){
 const w=WSX();
 const I0=ci*EPC, J0=cj*EPC;
 const HALO=6;                                     // window halo (cells) - covers the 8m raster + rescue reach + miter
 const iA=I0-HALO, iB=I0+EPC+HALO, jA=J0-HALO, jB=J0+EPC+HALO;
 const NI=iB-iA+1, NJ=jB-jA+1;
 const EV=new Uint8Array(NI*NJ), EH=new Uint8Array(NI*NJ);
 for(let a=0;a<NI;a++)for(let b=0;b<NJ;b++){
  EV[a*NJ+b]=edgeWall(iA+a, jA+b, 1)?1:0;
  EH[a*NJ+b]=edgeWall(iA+a, jA+b, 0)?1:0;
 }
 const idxV=(a,b)=>a*NJ+b;
 /* PURE per-cell seal rescue, TWO-PHASE: the seal test reads the
    FROZEN base arrays (order-free, window-free); openings apply
    afterwards.  Any window that rasterizes an edge also tests the
    adjacent cells (halo 6 > 8m raster + 3.2m cell), so every
    window agrees on every edge it can see. */
 const EVb=EV.slice(), EHb=EH.slice();
 const rescuedV=new Uint8Array(NI*NJ), rescuedH=new Uint8Array(NI*NJ);
 for(let a=0;a<NI-1;a++)for(let b=0;b<NJ-1;b++){
  if(EVb[idxV(a,b)] && EVb[idxV(a+1,b)] && EHb[idxV(a,b)] && EHb[idxV(a,b+1)]){
   const r=(h2i((iA+a)*29+(jA+b)*37, 171, w.s7)*4)|0;
   if(r===0)      { EV[idxV(a,b)]=0;   rescuedV[idxV(a,b)]=1; }
   else if(r===1) { EV[idxV(a+1,b)]=0; rescuedV[idxV(a+1,b)]=1; }
   else if(r===2) { EH[idxV(a,b)]=0;   rescuedH[idxV(a,b)]=1; }
   else           { EH[idxV(a,b+1)]=0; rescuedH[idxV(a,b+1)]=1; }
  }
 }
 /* ---- critic: fin re-roll in the truly private region.  A
    candidate must be (a) built by THIS chunk (run band i in
    [I0-4, I0+5] for V / j in [J0-4, J0+5] for H) and (b) raster-
    private: footprint >= 8.26m inset on every side (neighbor
    rasters reach 8m). V: i in [I0+3, I0+5], j in [J0+3, J0+6];
    H: i in [I0+3, I0+6], j in [J0+3, J0+5]. ---- */
 const cands=[];
 for(let a=HALO+3;a<=HALO+5;a++)for(let b=HALO+3;b<=HALO+6;b++){
  const i=iA+a, j=jA+b;
  if(!lineHas(i,1) && !rescuedV[idxV(a,b)] && laneMod(i)>1)
   cands.push({arr:EV, a, b, i, j, axis:1, base:EV[idxV(a,b)]});
 }
 for(let a=HALO+3;a<=HALO+6;a++)for(let b=HALO+3;b<=HALO+5;b++){
  const i=iA+a, j=jA+b;
  if(!lineHas(j,0) && !rescuedH[idxV(a,b)] && laneMod(j)>1)
   cands.push({arr:EH, a, b, i, j, axis:0, base:EH[idxV(a,b)]});
 }
 const wallFrac=()=>{
  let s=0, n=0;
  for(let a=HALO;a<=HALO+EPC;a++)for(let b=HALO;b<HALO+EPC;b++){ s+=EV[idxV(a,b)]; n++; }
  for(let a=HALO;a<HALO+EPC;a++)for(let b=HALO;b<=HALO+EPC;b++){ s+=EH[idxV(a,b)]; n++; }
  return s/n;
 };
 const f0=wallFrac();
 let att=0;
 if(f0<WP.wallLo || f0>WP.wallHi){
  const apply=(at)=>{
   for(const c of cands) c.arr[idxV(c.a,c.b)] = finAt(c.i, c.j, c.axis, at)?1:0;
  };
  const restore=()=>{
   for(const c of cands) c.arr[idxV(c.a,c.b)] = c.base;
  };
  let best=Math.max(WP.wallLo-f0, f0-WP.wallHi);
  for(let tq=1;tq<=4;tq++){
   apply(tq);
   const f=wallFrac();
   const sc=Math.max(WP.wallLo-f, f-WP.wallHi);
   if(sc<best-1e-9){ best=sc; att=tq; }
   restore();
  }
  if(att>0) apply(att);
  if(att>0){
   CRITIC.chunks++; CRITIC.rerolled++;
   CRITIC.log.push({ci, cj, wall0:+f0.toFixed(3), att, wall:+wallFrac().toFixed(3)});
   if(CRITIC.log.length>50) CRITIC.log.shift();
  } else CRITIC.chunks++;
 } else CRITIC.chunks++;

 /* ---- runs: contiguous walled edges merged into one box each.
    EXCLUSIVE OWNERSHIP so neighbors never double-build:
    V-runs: i in [I0-4, I0+5] (x-band), j in [J0, J0+9] (z-slab);
    H-runs: j in [J0-4, J0+5], i in [I0, I0+9].  The bands tile the
    line indices across neighboring chunks exactly. ---- */
 const runs=[];
 for(let i=I0-4;i<=I0+5;i++){
  const a=i-iA;
  let b=HALO;
  while(b<HALO+EPC){
   if(!EV[idxV(a,b)]){ b++; continue; }
   let b2=b;
   while(b2+1<HALO+EPC && EV[idxV(a,b2+1)]) b2++;
   runs.push({axis:1, i, j0:jA+b, j1:jA+b2});
   b=b2+1;
  }
 }
 for(let j=J0-4;j<=J0+5;j++){
  const b=j-jA;
  let a=HALO;
  while(a<HALO+EPC){
   if(!EH[idxV(a,b)]){ a++; continue; }
   let a2=a;
   while(a2+1<HALO+EPC && EH[idxV(a2+1,b)]) a2++;
   runs.push({axis:0, j, i0:iA+a, i1:iA+a2});
   a=a2+1;
  }
 }
 /* miter flags from the FULL window grammar: a run end extends
    0.16 ONLY where the run stops at a real 90-degree corner (a
    perpendicular edge exists there) and does NOT continue past
    the plane (pure decision - both sides agree).  Border butts
    (run continues into the neighbor) extend 0 exactly. */
 const evW=(i,j)=> (i>=iA&&i<=iB&&j>=jA&&j<=jB) ? EV[idxV(i-iA,j-jA)] : (edgeWall(i,j,1)?1:0);
 const ehW=(i,j)=> (i>=iA&&i<=iB&&j>=jA&&j<=jB) ? EH[idxV(i-iA,j-jA)] : (edgeWall(i,j,0)?1:0);
 for(const r of runs){
  if(r.axis===1){
   r.m0 = evW(r.i, r.j0-1) ? 0 : ((ehW(r.i-1, r.j0)||ehW(r.i, r.j0)) ? 1 : 0);
   r.m1 = evW(r.i, r.j1+1) ? 0 : ((ehW(r.i-1, r.j1+1)||ehW(r.i, r.j1+1)) ? 1 : 0);
  }else{
   r.m0 = ehW(r.i0-1, r.j) ? 0 : ((evW(r.i0, r.j-1)||evW(r.i0, r.j)) ? 1 : 0);
   r.m1 = ehW(r.i1+1, r.j) ? 0 : ((evW(r.i1+1, r.j-1)||evW(r.i1+1, r.j)) ? 1 : 0);
  }
 }
 /* ---- hall columns: 1.04m squares on the 2-cell grid where the
    zone field is open, never adjacent to a wall edge or a lane.
    ALL window columns are rasterized (neighbor light/bake sees
    them identically); only rect-strict ones become geometry. ---- */
 const columns=[];
 const colWin=[];
 for(let a=0;a<NI;a++)for(let b=0;b<NJ;b++){
  const i=iA+a, j=jA+b;
  if(((i%2)+2)%2!==0 || ((j%2)+2)%2!==0) continue;
  if(isLaneCol(i) || isLaneRow(j)) continue;         // never block a lane/crossing
  const x=i*CELL, z=j*CELL;
  if(Math.abs(x)<7 && Math.abs(z)<7) continue;       // spawn crossing stays clear
  if(vnoise(x, z, w.s1, WP.zoneWL)<=WP.hallHi) continue;
  if(evW(i,j-1)||evW(i,j)||ehW(i-1,j)||ehW(i,j)) continue;
  colWin.push({x, z, r:WP.colHalf});
  if(x>=ci*CS && x<(ci+1)*CS && z>=cj*CS && z<(cj+1)*CS) columns.push({x, z, r:WP.colHalf});
 }
 /* ---- the raster: wall + column footprints, fattened by 0.26m
    (>= half the sample pitch) so the bake LOS can never miss a
    0.2m wall.  Pure grammar near borders -> identical in every
    window that sees it -> zero border light seams. ---- */
 const F=new Float32Array(WN*WN);
 const ox=ci*CS-PAD, oz=cj*CS-PAD;
 const FAT=0.26;
 const mark=(x0,z0,x1,z1)=>{
  const a0=Math.max(0,Math.floor((x0-ox)/FRES)), a1=Math.min(WN-1,Math.floor((x1-ox)/FRES));
  const b0=Math.max(0,Math.floor((z0-oz)/FRES)), b1=Math.min(WN-1,Math.floor((z1-oz)/FRES));
  for(let a=a0;a<=a1;a++)for(let b=b0;b<=b1;b++) F[b*WN+a]=1;
 };
 for(let a=0;a<NI;a++)for(let b=0;b<NJ;b++){
  if(EV[idxV(a,b)]) mark((iA+a)*CELL-FAT, (jA+b)*CELL, (iA+a)*CELL+FAT, (jA+b+1)*CELL);
  if(EH[idxV(a,b)]) mark((iA+a)*CELL, (jA+b)*CELL-FAT, (iA+a+1)*CELL, (jA+b)*CELL+FAT);
 }
 for(const c of colWin) mark(c.x-c.r-FAT, c.z-c.r-FAT, c.x+c.r+FAT, c.z+c.r+FAT);
 return {F, ox, oz, nx:WN, nz:WN, res:FRES, runs, columns, ci, cj};
}

/* bilinear field lookup within a sampled window (AO / probes) */
function fieldAt(g, x, z){
 let u=(x-g.ox)/g.res, v=(z-g.oz)/g.res;
 u=clamp(u, 0, g.nx-1.001); v=clamp(v, 0, g.nz-1.001);
 const u0=Math.floor(u), v0=Math.floor(v);
 const tu=u-u0, tv=v-v0;
 const k00=v0*g.nx+u0, k10=k00+1, k01=k00+g.nx, k11=k01+1;
 return g.F[k00]*(1-tu)*(1-tv) + g.F[k10]*tu*(1-tv)
      + g.F[k01]*(1-tu)*tv + g.F[k11]*tu*tv;
}

/* ---- fixtures: troffer enumeration on the cell lattice.  Corridor
   cells (flanked by wall lines) carry troffer LINES down the
   middle; halls get a 2-phase brick; everything is snapped to the
   ceiling tile grid, world-deterministic. ---- */
function fixturesIn(x0, z0, x1, z1){
 const w=WSX();
 const out=[];
 const seen=new Set();
 const push=(x,z,rot)=>{
  const sx=Math.round((x-0.3075)/GRID)*GRID+0.3075;
  const sz=Math.round((z-0.3075)/GRID)*GRID+0.3075;
  const key=Math.round(sx*2)+','+Math.round(sz*2);
  if(seen.has(key)) return; seen.add(key);
  const modeR=h2i(Math.round(sx*4), Math.round(sz*4), (SEED^0xBEF)|0);
  out.push({x:sx, z:sz, rot,
   warm:(h2i(Math.round(sx*8), Math.round(sz*8), (SEED^0xA11CE)|0)-0.5)*2*0.10,
   mode: modeR<0.96?'steady':modeR<0.99?'flicker':'dying',
   phase: modeR*37});
 };
 const i0=Math.floor((x0-0.6)/CELL), i1=Math.floor((x1+0.6)/CELL);
 const j0=Math.floor((z0-0.6)/CELL), j1=Math.floor((z1+0.6)/CELL);
 for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){
  const cx=(i+0.5)*CELL, cz=(j+0.5)*CELL;
  const zn=vnoise(cx, cz, w.s1, WP.zoneWL);
  const laneC=isLaneCol(i), laneR=isLaneRow(j);
  let p, rot;
  if(zn>WP.hallHi){
   p=(((i+j)%2+2)%2===0)?0.85:0.10;
   rot=h2i(i*7+j*3, 88, w.s6)<0.5?0:Math.PI/2;
  }else if(laneC&&laneR){
   p=0.95; rot=Math.PI/2;                    // crossing: bright junction
  }else if(laneC){
   p=0.75; rot=Math.PI/2;                    // Z-lane troffer line
  }else if(laneR){
   p=0.75; rot=0;                            // X-lane troffer line
  }else{
   const corridorV=lineHas(i,1)||lineHas(i+1,1);
   const corridorH=lineHas(j,0)||lineHas(j+1,0);
   p=(corridorV&&corridorH)?0.55:(corridorV||corridorH)?0.50:0.30;
   rot = corridorV&&!corridorH ? Math.PI/2
       : (corridorH&&!corridorV ? 0
       : (h2i(i*7+j*3, 88, w.s6)<0.5?0:Math.PI/2));
  }
  if(h2i(i*13+j*17, 424, w.s2)>=p) continue;
  /* no troffer inside a sealed cell */
  if(edgeWall(i,j,1)&&edgeWall(i+1,j,1)&&edgeWall(i,j,0)&&edgeWall(i,j+1,0)) continue;
  push(cx, cz, rot);
 }
 return out;
}
/* ---- V18 PURE GRAMMAR END ---- */

function makeInstancer(geo, mat, cap){
 const m = new THREE.InstancedMesh(geo, mat, cap);
 m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
 m.frustumCulled = false;
 m.count = 0;
 scene.add(m);
 return m;
}
const iOutletPlate = makeInstancer(geOutletPlate, matOutletPlate, 400);
const iOutletDev   = makeInstancer(geOutletDev,   matOutletDev,   400);
const iPeel   = makeInstancer(gePeel,   matPeel,   110);
const iPlenum = makeInstancer(gePlenum, matPlenum, 220);
const _IM = new THREE.Matrix4(), _IQ = new THREE.Quaternion(),
      _IV = new THREE.Vector3(), _IS = new THREE.Vector3(1,1,1);
function refreshInstancers(){
 let n=0;
 for(const ch of chunks.values()) for(const o of ch.outlets){
  if(n>=400) break;
  EU.set(0, o.rot, 0, 'YXZ'); _IQ.setFromEuler(EU);
  _IM.compose(_IV.set(o.x, o.y, o.z), _IQ, _IS);
  iOutletPlate.setMatrixAt(n, _IM);
  iOutletDev.setMatrixAt(n, _IM);
  n++;
 }
 iOutletPlate.count = n; iOutletPlate.instanceMatrix.needsUpdate = true;
 iOutletDev.count = n;   iOutletDev.instanceMatrix.needsUpdate = true;
 n=0;
 for(const ch of chunks.values()) for(const o of ch.peels){
  if(n>=110) break;
  EU.set(0, o.rot, 0, 'YXZ'); _IQ.setFromEuler(EU);
  _IM.compose(_IV.set(o.x, o.y, o.z), _IQ, _IS);
  iPeel.setMatrixAt(n++, _IM);
 }
 iPeel.count = n; iPeel.instanceMatrix.needsUpdate = true;
 n=0;
 for(const ch of chunks.values()) for(const o of ch.plenums){
  if(n>=220) break;
  _IQ.identity();
  _IM.compose(_IV.set(o.x, H-0.016, o.z), _IQ, _IS);
  iPlenum.setMatrixAt(n++, _IM);
 }
 iPlenum.count = n; iPlenum.instanceMatrix.needsUpdate = true;
}
function bakeUV(g, mode){
 const p=g.attributes.position, n=g.attributes.normal, uv=g.attributes.uv;
 for(let k=0;k<p.count;k++){
  const nx=n.getX(k), ny=n.getY(k);
  const x=p.getX(k), y=p.getY(k), z=p.getZ(k);
  let u,v;
  if(mode==='wall'){
   if(Math.abs(ny)>0.5){ u=x/5.12; v=z/5.12; }
   else if(Math.abs(nx)>0.5){ u=z/5.12; v=y/H; }
   else { u=x/5.12; v=y/H; }
  } else if(mode==='trim'){
   if(Math.abs(ny)>0.5){ u=x/0.75; v=z/0.14; }
   else if(Math.abs(nx)>0.5){ u=z/0.75; v=y/0.14; }
   else { u=x/0.75; v=y/0.14; }
  } else if(mode==='ceil'){
   if(Math.abs(ny)>0.5){ u=x/2.46; v=z/2.46; }
   else if(Math.abs(nx)>0.5){ u=z/2.46; v=0.5+y*0.2; }
   else { u=x/2.46; v=0.5+y*0.2; }
  } else { u=x/4; v=z/4; }
  uv.setXY(k,u,v);
 }
}
function vertColors(g, mode, jitter, bake){
 const p=g.attributes.position, n=g.attributes.normal;
 const col=new Float32Array(p.count*3);
 const SEED2 = (SEED^0x5159)|0;
 let zone=1;
 if(mode==='wall'){
  const di = wZone(p.getX(0), p.getZ(0), (SEED^0x51AB)|0);
  zone = 1.04 - 0.08*clamp((di-0.26)/0.36, 0, 1);
 }
 for(let k=0;k<p.count;k++){
  const x=p.getX(k), y=p.getY(k), z=p.getZ(k);
  let c=1;
  if(mode==='wall'){
   c = (0.875 + 0.125*Math.min(y/0.65, 1)) * jitter * zone;
   if(y > H-0.5) c *= 0.89 + 0.11*(H-y)/0.5;
   c *= 0.90 + 0.10*vnoise(x*0.14, (z+y*0.4)*0.14, SEED2, 6);
  } else {
   c = (0.93 + 0.07*Math.min(y/0.08, 1)) * jitter;
  }
  if(bake){
   const ny=n.getY(k);
   let L;
   if(ny > 0.5)         L = bake.ceil(x, z);
   else if(ny < -0.5){  const f = bake.floor(x, z); L=[f[0]*0.55, f[1]*0.55, f[2]*0.55]; }
   else                 L = bake.wall(x, y, z, n.getX(k), n.getZ(k));
   const A = mode==='ceil' ? 0.56 : 0.47;
   col[k*3]  = c*(A + L[0]);
   col[k*3+1]= c*(A + L[1]);
   col[k*3+2]= c*(A + L[2]);
  } else {
   col[k*3]=c; col[k*3+1]=c; col[k*3+2]=c;
  }
 }
 g.setAttribute('color', new THREE.BufferAttribute(col,3));
}
function mergedMesh(geos, mat){
 if(!geos.length) return null;
 const g = mergeGeometries(geos, false); if(!g) return null;
 for(const x of geos) x.dispose();
 return new THREE.Mesh(g, mat);
}
/* ================================================================
   v18 BUILDERS - axis-aligned wall RUN boxes (one merged box per
   contiguous run, segmented 2.2m for the baked light gradient),
   baseboards, RARE cased doors on long straight runs, hall columns.
   ================================================================ */
const UP = new THREE.Vector3(0,1,0);
const EU = new THREE.Euler();
let BUILD_MS=0, BUILD_N=0, DOOR_N=0, OUTLET_N=0, PEEL_N=0;
let ci0x=0, ci1x=0, ci0z=0, ci1z=0;   // current chunk rect (door runs)

function pushSegBox(list, p0, p1, y0, y1, halfT, mode, bake, miterA, miterB){
 const dx=p1[0]-p0[0], dz=p1[1]-p0[1];
 const len=Math.hypot(dx,dz);
 if(len<0.02) return;
 const grow=(miterA?0.16:0)+(miterB?0.16:0);
 const mx=(p0[0]+p1[0])*0.5, mz=(p0[1]+p1[1])*0.5;
 const maxSeg = mode==='wall' ? 2.2 : 4.0;
 const nSeg = Math.max(1, Math.ceil(len/maxSeg));
 const g=new THREE.BoxGeometry(2*halfT, y1-y0, len+grow, 1, 1, nSeg);
 g.rotateY(Math.atan2(dx, dz));
 g.translate(mx, (y0+y1)*0.5, mz);
 bakeUV(g, mode);
 const jit=mode==='wall'
  ? 0.965+0.035*h2i(Math.round(mx*50), Math.round(mz*50), (SEED^0x717)|0)
  : 1;
 vertColors(g, mode, jit, bake);
 list.push(g);
}

/* build walls + trims from the run list; colliders follow the run
   centerlines (a closed door still blocks); rare door specials on
   long interior runs */
function buildWallsGrid(grid, wallGeos, trimGeos, doorGeos, colliders, specials, bake){
 for(const r of grid.runs){
  const line = r.axis===1 ? r.i*CELL : r.j*CELL;
  const s0 = r.axis===1 ? r.j0*CELL : r.i0*CELL;
  const s1 = r.axis===1 ? (r.j1+1)*CELL : (r.i1+1)*CELL;
  const lo = r.axis===0 ? ci0x : ci0z;
  const hi = r.axis===0 ? ci1x : ci1z;
  /* door candidates: 8m world-grid slots on interior runs >= 7m */
  const interior = s0>lo+1.5 && s1<hi-1.5 && (s1-s0)>=7;
  if(interior){
   for(let m=Math.ceil((s0+0.9)/8); m<=Math.floor((s1-0.9)/8); m++){
    const c=m*8;
    if(h2i(m*13+r.axis, Math.round(line*4), (SEED^0x0D00)|0)>=WP.pDoor) continue;
    specials.push({axis:r.axis, c, line, outSide:h2i(m*3+r.axis, Math.round(line*8), (SEED^0x0D05)|0)<0.5?1:-1});
   }
  }
  /* collider: full run centerline (+ miter ends, matching geometry) */
  const ext=0.16;
  const A0=r.m0?s0-ext:s0, B1=r.m1?s1+ext:s1;
  if(r.axis===0) colliders.segs.push({x0:A0, z0:line, x1:B1, z1:line});
  else           colliders.segs.push({x0:line, z0:A0, x1:line, z1:B1});
  /* emit boxes, cutting the wall (not the collider) at door spans */
  const P=(u)=> r.axis===0 ? [u, line] : [line, u];
  let door=null;
  for(const sp of specials){
   if(sp.axis===r.axis && Math.abs(sp.line-line)<0.6
      && Math.max(s0,s1)>sp.c-0.72 && Math.min(s0,s1)<sp.c+0.72){ door=sp; break; }
  }
  const emit=(u0,u1,mA,mB)=>{
   if(u1-u0<0.05) return;
   const A=P(u0), B=P(u1);
   pushSegBox(wallGeos, A, B, -0.02, H+0.02, WT, 'wall', bake, mA, mB);
   pushSegBox(trimGeos, A, B, 0, 0.088, WT2, 'trim', bake, mA, mB);
   pushSegBox(trimGeos, A, B, 0.088, 0.116, WT2-0.004, 'trim', bake, mA, mB);
  };
  if(!door) emit(s0, s1, !!r.m0, !!r.m1);
  else{
   emit(s0, Math.min(s1, door.c-0.685), !!r.m0, false);
   emit(Math.max(s0, door.c+0.685), s1, false, !!r.m1);
  }
 }
 DOOR_N += specials.length;
 for(const sp of specials) buildDoor(sp, wallGeos, trimGeos, doorGeos, bake);
}

/* RARE cased door: wallpapered header, jamb + head casing (trim),
   dark painted slab with a knob - the only "door" vocabulary. */
function buildDoor(sp, wallGeos, trimGeos, doorGeos, bake){
 const hw=0.575, j=0.055, A0=sp.c-hw-j, A1=sp.c+hw+j;
 const off=sp.outSide*0.045;
 const addBox=(list, y0, y1, u0, u1, t0, t1, mode)=>{
  if(u1-u0<=0.002 || t1-t0<=0.002) return;
  let g;
  if(sp.axis===0) g=new THREE.BoxGeometry(u1-u0, y1-y0, t1-t0);
  else g=new THREE.BoxGeometry(t1-t0, y1-y0, u1-u0);
  const uc=(u0+u1)/2, tc=(t0+t1)/2;
  if(sp.axis===0) g.translate(uc,(y0+y1)/2,tc);
  else g.translate(tc,(y0+y1)/2,uc);
  bakeUV(g, mode);
  vertColors(g, mode, 0.97, bake);
  list.push(g);
 };
 const lo=sp.line-(WT+0.032), hi=sp.line+(WT+0.032);
 addBox(wallGeos, 2.06, H+0.02, A0-0.002, A1+0.002, sp.line-(WT-0.001), sp.line+(WT-0.001), 'wall');
 addBox(trimGeos, 0, 2.055, A0, sp.c-hw, lo, hi, 'trim');
 addBox(trimGeos, 0, 2.055, sp.c+hw, A1, lo, hi, 'trim');
 addBox(trimGeos, 2.052, 2.26, A0, A1, lo, hi, 'trim');
 addBox(doorGeos, 0.02, 2.03, sp.c-hw+0.012, sp.c+hw-0.012, sp.line+off-0.024, sp.line+off+0.024, 'trim');
 {
  const kx=sp.c + sp.outSide*(hw-0.13)*(sp.axis===0?0:1) + (sp.axis===0?hw-0.13:0);
  const kx2=sp.axis===0 ? sp.c+hw-0.15 : sp.line+off+sp.outSide*0.045;
  const kz2=sp.axis===0 ? sp.line+off+sp.outSide*0.045 : sp.c+hw-0.15;
  const kb=new THREE.BoxGeometry(0.05,0.05,0.05);
  kb.translate(kx2, 1.02, kz2);
  bakeUV(kb,'trim'); vertColors(kb,'trim',1,bake);
  doorGeos.push(kb);
 }
}

/* massive hall column: plinth + trim bands + capital (v14 lineage) */
function buildColumnBox(c, wallGeos, trimGeos, colliders, bake){
 const s=c.r;
 const g=new THREE.BoxGeometry(2*s, H+0.04, 2*s);
 g.translate(c.x, H/2, c.z);
 bakeUV(g, 'wall');
 const jit=0.975+0.025*h2i(Math.round(c.x*20), Math.round(c.z*20), (SEED^0x719)|0);
 vertColors(g, 'wall', jit, bake);
 wallGeos.push(g);
 const tb=(x0,z0,x1,z1,y0,y1)=>{
  const t=new THREE.BoxGeometry(x1-x0, y1-y0, z1-z0);
  t.translate((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
  bakeUV(t,'trim'); vertColors(t,'trim',1,bake); trimGeos.push(t);
 };
 tb(c.x-s-0.055, c.z-s-0.055, c.x+s+0.055, c.z+s+0.055, 0, 0.10);
 tb(c.x-s-0.030, c.z-s-0.030, c.x+s+0.030, c.z+s+0.030, 0.10, 0.142);
 tb(c.x-s-0.058, c.z-s-0.058, c.x+s+0.058, c.z+s+0.058, H-0.148, H-0.108);
 tb(c.x-s-0.032, c.z-s-0.032, c.x+s+0.032, c.z+s+0.032, H-0.108, H-0.068);
 colliders.boxes.push({x0:c.x-s, z0:c.z-s, x1:c.x+s, z1:c.z+s, y0:0});
}

/* ================================================================
   v18 BAKED LIGHT - v16/v17 lineage: fixtures over the window, 2D
   LOS through the blocker raster (the fattened wall + column
   footprints - pure grammar near borders, identical in every
   window that sees it -> zero border light seams), floor pools +
   ceiling halos + wall wash.
   ================================================================ */
const FN=45;
function buildBake(ci, cj, grid, fix, columns){
 const N=grid.nx;
 const ox=grid.ox, oz=grid.oz;
 const solid=new Uint8Array(N*N);
 for(let i=0;i<grid.F.length;i++) if(grid.F[i]>0.5) solid[i]=1;
 for(const c of columns){
  const gx0=Math.max(0,Math.floor((c.x-c.r-ox)/FRES)), gx1=Math.min(N-1,Math.floor((c.x+c.r-ox)/FRES));
  const gz0=Math.max(0,Math.floor((c.z-c.r-oz)/FRES)), gz1=Math.min(N-1,Math.floor((c.z+c.r-oz)/FRES));
  for(let a=gx0;a<=gx1;a++)for(let b=gz0;b<=gz1;b++) solid[b*N+a]=1;
 }
 const los=(x0,z0,x1,z1)=>{
  const dx=x1-x0, dz=z1-z0;
  const dist=Math.sqrt(dx*dx+dz*dz);
  if(dist<0.4) return true;
  const n=Math.ceil(dist/0.26);
  let x=x0, z=z0;
  for(let k=1;k<n;k++){
   x+=dx/n; z+=dz/n;
   const a=Math.floor((x-ox)/FRES), b=Math.floor((z-oz)/FRES);
   if(a<0||b<0||a>=N||b>=N) return false;
   if(solid[b*N+a]) return false;
  }
  return true;
 };
 const ff=new Float32Array(FN*FN*3), cf=new Float32Array(FN*FN*3);
 const fx0=ci*CS, fz0=cj*CS;
 for(let a=0;a<FN;a++)for(let b=0;b<FN;b++){
  const x=fx0+(a/(FN-1))*CS, z=fz0+(b/(FN-1))*CS;
  let fr=0,fg=0,fb=0,cr=0,cg=0,cb=0;
  for(const f of fix){
   const dx=x-f.x, dz=z-f.z, r2=dx*dx+dz*dz;
   if(r2>52) continue;
   if(!los(x,z,f.x,f.z)) continue;
   const w1=1+f.warm*0.14, w2=0.992+f.warm*0.009, w3=0.968-f.warm*0.10;
   const e=0.88/Math.pow(1+r2/10.9, 1.6);
   fr+=e*w1; fg+=e*w2; fb+=e*w3;
   if(r2<7){
    const ec=0.30/Math.pow(1+r2/1.59, 1.5);
    cr+=ec*w1; cg+=ec*w2; cb+=ec*w3;
   }
  }
  const k3=(a*FN+b)*3;
  ff[k3]=fr; ff[k3+1]=fg; ff[k3+2]=fb;
  cf[k3]=cr; cf[k3+1]=cg; cf[k3+2]=cb;
 }
 const _bo=[0,0,0];
 const bil=(arr,x,z)=>{
  let u=(x-fx0)/CS*(FN-1), v=(z-fz0)/CS*(FN-1);
  u=clamp(u,0,FN-1.001); v=clamp(v,0,FN-1.001);
  const a0=Math.floor(u), b0=Math.floor(v);
  const tu=u-a0, tv=v-b0;
  const a1=Math.min(a0+1,FN-1), b1=Math.min(b0+1,FN-1);
  const k00=(a0*FN+b0)*3, k10=(a0*FN+b1)*3, k01=(a1*FN+b0)*3, k11=(a1*FN+b1)*3;
  const w00=(1-tu)*(1-tv), w10=(1-tu)*tv, w01=tu*(1-tv), w11=tu*tv;
  _bo[0]=arr[k00]*w00+arr[k10]*w10+arr[k01]*w01+arr[k11]*w11;
  _bo[1]=arr[k00+1]*w00+arr[k10+1]*w10+arr[k01+1]*w01+arr[k11+1]*w11;
  _bo[2]=arr[k00+2]*w00+arr[k10+2]*w10+arr[k01+2]*w01+arr[k11+2]*w11;
  return _bo;
 };
 return {
  floor:(x,z)=> bil(ff,x,z),
  ceil :(x,z)=> bil(cf,x,z),
  wall :(x,y,z,nx,nz)=>{
   bil(ff, x+nx*0.13, z+nz*0.13);
   const t=clamp(y,0,2.95)/2.95;
   const e=(0.20+0.80*t)*1.15;
   _bo[0]*=e; _bo[1]*=e; _bo[2]*=e;
   return _bo;
  }
 };
}

/* ================================================================
   v18 CHUNK ASSEMBLY
   ================================================================ */
function buildChunk(ci, cj, key){
 const _bcT0=performance.now();
 ci0x=ci*CS; ci1x=(ci+1)*CS; ci0z=cj*CS; ci1z=(cj+1)*CS;
 const group=new THREE.Group();
 const wallGeos=[], trimGeos=[], doorGeos=[], specials=[];
 const colliders={segs:[], boxes:[]};
 const fixtures=[], outlets=[], peels=[], plenums=[];

 /* 1. grammar + critic + runs + raster */
 const grid=sampleWorld(ci, cj);
 /* 2. fixtures over the window */
 const fix=fixturesIn(ci*CS-PAD, cj*CS-PAD, (ci+1)*CS+PAD, (cj+1)*CS+PAD);
 /* 3. baked light (walls + columns already in the raster) */
 const bake=buildBake(ci, cj, grid, fix, []);
 /* 4. walls + trims + doors */
 buildWallsGrid(grid, wallGeos, trimGeos, doorGeos, colliders, specials, bake);
 /* 5. hall columns */
 for(const c of grid.columns) buildColumnBox(c, wallGeos, trimGeos, colliders, bake);

  if(f.x>=ci*CS-0.31 && f.x<(ci+1)*CS+0.31 && f.z>=cj*CS-0.31 && f.z<(cj+1)*CS+0.31)

 }
 if(ci===0 && cj===0 && !fixtures.some(f=>(f.x-2)*(f.x-2)+(f.z-2)*(f.z-2)<36)){
  fixtures.unshift({x:2, z:2, rot:Math.PI/2, warm:0, mode:'steady', phase:0});   // aligned with the Z-lane
 }

 /* 7. scattered canon details (RARE): outlets + peels on straight
    runs, plenums on open floor */
 for(const r of grid.runs){
  const line = r.axis===1 ? r.i*CELL : r.j*CELL;
  const s0 = r.axis===1 ? r.j0*CELL : r.i0*CELL;
  const s1 = r.axis===1 ? (r.j1+1)*CELL : (r.i1+1)*CELL;
  if(s1-s0<1.2) continue;
  for(let m=Math.ceil((s0+0.6)/4); m<=Math.floor((s1-0.6)/4); m++){
   const u=m*4+h2i(m*7+r.axis, 31, (SEED^0x0D01)|0)*2.2;

   const wx=r.axis===0?u:line, wz=r.axis===0?line:u;
   if(wx<ci0x+1||wx>ci1x-1||wz<ci0z+1||wz>ci1z-1) continue;
   const fA=fieldAt(grid, wx+(r.axis===0?0:0.55), wz+(r.axis===0?0.55:0));
   const fB=fieldAt(grid, wx-(r.axis===0?0:0.55), wz-(r.axis===0?0.55:0));
   const side=fA<fB?-1:1;
   if(r2<0.055){
    const oh=h2i(m*11+r.axis, 7, (SEED^0x0D03)|0);
    const y=0.26+oh*0.12;
    const px=r.axis===0?wx:wx+side*(WT2+0.004);
    const pz=r.axis===0?wz+side*(WT2+0.004):wz;
    outlets.push({x:px, z:pz, y, rot:r.axis===0?(side>0?Math.PI:0):(side>0?Math.PI/2:-Math.PI/2)});
   } else if(r2>0.992){
    const y=0.95+h2i(m*13+r.axis, 3, (SEED^0x0D04)|0)*0.5;
    const px=r.axis===0?wx:wx+side*(WT2+0.006);
    const pz=r.axis===0?wz+side*(WT2+0.006):wz;
    peels.push({x:px, z:pz, y, rot:r.axis===0?(side>0?Math.PI:0):(side>0?Math.PI/2:-Math.PI/2)});
   }
  }
 }
 for(let gy=0; gy<Math.floor(CS/GRID); gy++){
  for(let gx=0; gx<Math.floor(CS/GRID); gx++){
   const tx=ci*CS+0.3075+gx*GRID, tz=cj*CS+0.3075+gy*GRID;
   if(h2i(Math.round(tx*2), Math.round(tz*2), (SEED^0x6155)|0)<0.020){
    if(!fixtures.some(f=>Math.abs(f.x-tx)<0.8 && Math.abs(f.z-tz)<0.8) && fieldAt(grid,tx,tz)<0.5)

   }
  }
 }

 const cx=(ci+0.5)*CS, cz=(cj+0.5)*CS;
 const wm=mergedMesh(wallGeos, matWall);
 if(wm) group.add(wm);
 const tm=mergedMesh(trimGeos, matTrim);
 if(tm) group.add(tm);
 const dm=mergedMesh(doorGeos, matDoor);
 if(dm) group.add(dm);

 /* floor + ceiling planes (v16 lineage: 44 segments = bake lattice) */
 const fg=new THREE.PlaneGeometry(CS, CS, 44, 44);
 fg.rotateX(-Math.PI/2); fg.translate(cx, 0, cz); bakeUV(fg,'flat');
 {
  const fp=fg.attributes.position, fc=new Float32Array(fp.count*3);
  const S=WS();
  for(let k=0;k<fp.count;k++){
   const x=fp.getX(k), z=fp.getZ(k);
   const s=fieldAt(grid,x,z);
   let t=wsmooth(0.62, 0.40, s);
   const s2=Math.max(fieldAt(grid,x+0.35,z), fieldAt(grid,x-0.35,z),
                     fieldAt(grid,x,z+0.35), fieldAt(grid,x,z-0.35));
   if(s2>0.5) t=Math.min(t, 0.15);
   const mot=0.88+0.12*vnoise(x*0.25, z*0.25, (SEED^0x33A1)|0, 9);
   const di=wZone(x,z,S.s1);
   const zone=1.035-0.07*clamp((di-0.26)/0.36,0,1);
   const c=(0.70+0.30*t)*mot*zone;
   const L=bake.floor(x,z);
   fc[k*3]  =c*(0.50+L[0])*(0.99+0.02*vnoise(x*0.09, z*0.11, (SEED^0x33C1)|0, 7));
   fc[k*3+1]=c*(0.50+L[1])*(0.995+0.015*vnoise(x*0.08, z*0.10, (SEED^0x33C2)|0, 7));
   fc[k*3+2]=c*(0.50+L[2])*(0.975+0.045*vnoise(x*0.10, z*0.12, (SEED^0x33C3)|0, 7));
  }
  fg.setAttribute('color', new THREE.BufferAttribute(fc,3));
 }
 group.add(new THREE.Mesh(fg, matCarpet));

 const cg=new THREE.PlaneGeometry(CS, CS, 44, 44);
 cg.rotateX(Math.PI/2); cg.translate(cx, H, cz);
 {
  const uv=cg.attributes.uv, cp=cg.attributes.position;
  for(let k=0;k<cp.count;k++) uv.setXY(k, cp.getX(k)/2.46, cp.getZ(k)/2.46);
  const cc=new Float32Array(cp.count*3);
  const S=WS();
  for(let k=0;k<cp.count;k++){
   const x=cp.getX(k), z=cp.getZ(k);
   const s=fieldAt(grid,x,z);

   on the centerline) plus the r=0.33 player circle leaves ~0.23m
   clearance from every wall face; segments butt exactly at chunk
   borders (same vertices both sides) so there is no gap to leak. */
function collide(pos, r, vel){
 const top=headTop();
 const pci=Math.floor(pos.x/CS), pcj=Math.floor(pos.z/CS);
 for(let it=0; it<3; it++){
  for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
   const ch=chunks.get((pci+a)+','+(pcj+b));
   if(!ch) continue;
   for(const s of ch.colliders.segs){
    const dx=s.x1-s.x0, dz=s.z1-s.z0;
    const L2=dx*dx+dz*dz;
    let t=L2>1e-9 ? ((pos.x-s.x0)*dx+(pos.z-s.z0)*dz)/L2 : 0;
    t=t<0?0:t>1?1:t;
    const nx=pos.x-(s.x0+dx*t), nz=pos.z-(s.z0+dz*t);
    const d2=nx*nx+nz*nz;
    if(d2>=r*r) continue;
    const d=Math.sqrt(d2>1e-12?d2:1e-12), ux=nx/d, uz=nz/d, push=r-d;
    pos.x+=ux*push; pos.z+=uz*push;
    const vd=vel.x*ux+vel.z*uz;
    if(vd<0){ vel.x-=ux*vd; vel.z-=uz*vd; }
   }
   for(const bx of ch.colliders.boxes){
    if(bx.y0>top) continue;
    const nx=clamp(pos.x,bx.x0,bx.x1), nz=clamp(pos.z,bx.z0,bx.z1);
    const dx=pos.x-nx, dz=pos.z-nz;
    const d2=dx*dx+dz*dz;
    if(d2>=r*r) continue;
    if(d2>1e-8){
     const d=Math.sqrt(d2), ux=dx/d, uz=dz/d, push=r-d;
     pos.x+=ux*push; pos.z+=uz*push;
     const vd=vel.x*ux+vel.z*uz;
     if(vd<0){ vel.x-=ux*vd; vel.z-=uz*vd; }
    } else {
     const L=pos.x-bx.x0, R=bx.x1-pos.x, Tt=pos.z-bx.z0, B=bx.z1-pos.z;
     const m=Math.min(L,R,Tt,B);
     if(m===L){ pos.x=bx.x0-r; vel.x=Math.min(vel.x,0); }
     else if(m===R){ pos.x=bx.x1+r; vel.x=Math.max(vel.x,0); }
     else if(m===Tt){ pos.z=bx.z0-r; vel.z=Math.min(vel.z,0); }
     else { pos.z=bx.z1+r; vel.z=Math.max(vel.z,0); }
    }
   }
  }
 }
}

function updatePlayer(dt){

    bulkhead) you physically cannot stand back up */

  const sy=Math.sin(player.yaw), cy=Math.cos(player.yaw);
  wx = -sy*F + cy*S;
  wz = -cy*F - sy*S;
  const l = Math.hypot(wx,wz)||1;

  if(player.grounded && !crouch){ player.vy=2.75; player.grounded=false; player.wantJump=0; }
  else player.wantJump=Math.max(0, player.wantJump-dt);
 }
 if(!player.grounded){
  player.vy -= 15.5*dt;
  player.pos.y += player.vy*dt;
  if(player.vy>0){                            // head vs dropped soffits
   const pci=Math.floor(player.pos.x/CS), pcj=Math.floor(player.pos.z/CS);
   outer: for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
    const ch=chunks.get((pci+a)+','+(pcj+b)); if(!ch) continue;
    for(const bx of ch.colliders.boxes){
     if(bx.y0<=0.05 || bx.y0>=STAND_TOP+0.6) continue;
     const nx=clamp(player.pos.x,bx.x0,bx.x1), nz=clamp(player.pos.z,bx.z0,bx.z1);
     const dx=player.pos.x-nx, dz=player.pos.z-nz;
     if(dx*dx+dz*dz < 0.36*0.36 && headTop()>bx.y0-0.02){
      player.pos.y -= (headTop()-(bx.y0-0.02));
      player.vy=0; break outer;
     }
    }
   }
  }
  if(player.pos.y<=0){
   player.pos.y=0;
   if(player.vy<-1.6){ player.landY=-Math.min(0.085, -player.vy*0.030); sfxStep(1.2,false); }
   player.vy=0; player.grounded=true;
  }
 } else player.landY = damp(player.landY, 0, 9, dt);
 player.pos.x += player.vel.x*dt;
 player.pos.z += player.vel.z*dt;
 collide(player.pos, 0.33, player.vel);
 const spd = Math.hypot(player.vel.x, player.vel.z);

 const yawRate = (player.yaw - player.prevYaw)/Math.max(dt,1e-4);
 player.prevYaw = player.yaw;
 player.yawRateS = damp(player.yawRateS, clamp(yawRate,-4,4), 10, dt);

 /* lean driven by SMOOTHED local-frame velocity + acceleration,
    now as an ACCENT (~3deg), not a sway */
 const sy0=Math.sin(player.yaw), cy0=Math.cos(player.yaw);
 const vF = -sy0*player.vel.x - cy0*player.vel.z;   // local forward speed
 const vS =  cy0*player.vel.x - sy0*player.vel.z;   // local strafe speed
 player.vFs = damp(player.vFs, vF, 4, dt);   // v16: lean GLIDES - velocity filter
 player.vSs = damp(player.vSs, vS, 4, dt);   // slowed so direction changes pour into each other
 const aF = dt>0 ? (vF - player.pVF)/dt : 0;
 player.pVF = vF;

 const pitchT = clamp(-(player.vFs*0.013 + player.aFs*0.0042), -0.050, 0.050);

    filters mean a left lean pours through zero into a right lean
    with no step - "the leans lean into each other" */
 player.roll      = damp(player.roll,      rollT,  4.5, dt);
 player.leanPitch = damp(player.leanPitch, pitchT, 4.5, dt);

    slightly forward like a person folding down */
 player.crouchA = damp(player.crouchA, crouch?1:0, 5.5, dt);
 player.eye = 1.62 - 0.58*player.crouchA;
 player.sprintA = damp(player.sprintA, (sprint&&F>0&&spd>2.6)?1:0, 4.5, dt);

function composeCamera(alpha){

function updateTape(dt){

 if(trackT>=0){
  trackT += dt;

/* ================================================================
   AUDIO v13 - rebuilt after "web audio sounds like shit". the old
   mix was a 54Hz woofer drone whose partials never read as
   electricity, a square-wave buzz, a volume that pumped 0.5-1.6x
   every few seconds and roared every couple of minutes. this one
   is built like a real room:
   - ballast hum: 120Hz mains + partials at 240/360/480 with a
     slow aging wobble riding the 2nd partial, always present,
     gently louder near fixtures. it only BREATHES (+-5%), never
     surges.
   - fixture buzz: noise bands around 3.3k and 1k, amplitude-
     modulated at 119.7Hz so they FLICKER at mains rate (a buzz,
     not a hiss), fading in within ~9m of a troffer, plus a faint
     239Hz magnetostriction zing up close.
   - room tone: one steady lowpassed noise bed - the air of an
     empty building.
   - space: a generated 0.55s convolution tail, so footsteps and
     distant thuds sit IN the room instead of dry on your ears.
   - footsteps: alternating stereo pan, heel thud + short body +
     toe-off swish 55-85ms later.
   - distant structural thuds and rare wall scratches stay, far
     quieter than before.
   ================================================================ */
let AC=null, aMaster=null, aHumG=null, aBuzzG=null, aNoiseBuf=null, aSend=null, thudNext=45;
let humDrift=1, humDriftTarget=1, humDriftNext=10, scratchNext=60, stepSide=1;
function makeIR(sec, decay){
 const n=(AC.sampleRate*sec)|0, ir=AC.createBuffer(2, n, AC.sampleRate);
 for(let c=0;c<2;c++){ const d=ir.getChannelData(c);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n, decay);
 }

}
function initAudio(){
 if(AC) return;
 try{
  AC = new (window.AudioContext||window.webkitAudioContext)();
  aMaster = AC.createGain(); aMaster.gain.value=0.72; aMaster.connect(AC.destination);
  aNoiseBuf = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
  const nd = aNoiseBuf.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  /* the room: 0.55s decaying stereo noise impulse; voices send into it */
  aSend = AC.createGain();
  const verb = AC.createConvolver(); verb.buffer = makeIR(0.55, 3.2);
  const wet  = AC.createGain(); wet.gain.value=0.55;
  aSend.connect(verb); verb.connect(wet); wet.connect(aMaster);
  /* room tone: the empty-building air, steady, no pumping */
  const rt=AC.createBufferSource(); rt.buffer=aNoiseBuf; rt.loop=true; rt.playbackRate.value=0.7;
  const rtf=AC.createBiquadFilter(); rtf.type='lowpass'; rtf.frequency.value=420; rtf.Q.value=0.4;
  const rtg=AC.createGain(); rtg.gain.value=0.015;
  rt.connect(rtf); rtf.connect(rtg); rtg.connect(aMaster); rt.start();
  /* ballast hum: 120Hz + partials; the 240Hz partial wobbles like
     an aging ballast; a whisper of it feeds the room tail too */
  aHumG = AC.createGain(); aHumG.gain.value=0.55; aHumG.connect(aMaster);
  const hs=AC.createGain(); hs.gain.value=0.22; aHumG.connect(hs); hs.connect(aSend);
  const parts=[[120,0.021],[240,0.012],[360,0.0042],[479.7,0.0013]];
  for(let k=0;k<parts.length;k++){
   const o=AC.createOscillator(); o.type='sine'; o.frequency.value=parts[k][0];
   const g=AC.createGain(); g.gain.value=parts[k][1];
   o.connect(g); g.connect(aHumG); o.start();
   if(k===1){
    const lf=AC.createOscillator(); lf.type='sine'; lf.frequency.value=0.13;
    const lg=AC.createGain(); lg.gain.value=parts[k][1]*0.35;
    lf.connect(lg); lg.connect(g.gain); lf.start();
   }
  }

     not a continuous hiss; a faint 239Hz zing up close */
  aBuzzG = AC.createGain(); aBuzzG.gain.value=0; aBuzzG.connect(aMaster);
  const am=AC.createOscillator(); am.type='sine'; am.frequency.value=119.7; am.start();
  const amG=AC.createGain(); amG.gain.value=0.50;
  const amG2=AC.createGain(); amG2.gain.value=0.32;
  const bn=AC.createBufferSource(); bn.buffer=aNoiseBuf; bn.loop=true; bn.playbackRate.value=1.35;
  const bnf=AC.createBiquadFilter(); bnf.type='bandpass'; bnf.frequency.value=3300; bnf.Q.value=2.4;
  const bam=AC.createGain(); bam.gain.value=0.30;
  amG.connect(bam.gain);
  bn.connect(bnf); bnf.connect(bam); bam.connect(aBuzzG); bn.start();
  const bn2=AC.createBufferSource(); bn2.buffer=aNoiseBuf; bn2.loop=true; bn2.playbackRate.value=0.9;
  const bnf2=AC.createBiquadFilter(); bnf2.type='bandpass'; bnf2.frequency.value=1050; bnf2.Q.value=3.0;
  const bam2=AC.createGain(); bam2.gain.value=0.22;
  amG2.connect(bam2.gain);
  bn2.connect(bnf2); bnf2.connect(bam2); bam2.connect(aBuzzG); bn2.start();
  const zo=AC.createOscillator(); zo.type='triangle'; zo.frequency.value=239.4;
  const zg=AC.createGain(); zg.gain.value=0.0038; zo.connect(zg); zg.connect(aBuzzG); zo.start();

function sfxStep(v, quiet){
 if(!AC || AC.state!=='running') return;
 try{
  const t=AC.currentTime;
  const q = quiet ? 0.30 : 1;
  stepSide = -stepSide;                                  // L,R,L,R - sells the gait
  const out = AC.createStereoPanner ? AC.createStereoPanner() : AC.createGain();
  if(out.pan) out.pan.value = 0.12*stepSide;
  out.connect(aMaster);
  /* heel: soft carpet thud */
  const s1=AC.createBufferSource(); s1.buffer=aNoiseBuf;
  s1.playbackRate.value=0.9+Math.random()*0.15;
  const f1=AC.createBiquadFilter(); f1.type='lowpass'; f1.frequency.value=190+Math.random()*90;
  const e1=AC.createGain();
  e1.gain.setValueAtTime(0.0001, t);
  e1.gain.exponentialRampToValueAtTime(0.16*v*q, t+0.008);
  e1.gain.exponentialRampToValueAtTime(0.0001, t+0.11);
  s1.connect(f1); f1.connect(e1); e1.connect(out);
  const w1=AC.createGain(); w1.gain.value=0.5; e1.connect(w1); w1.connect(aSend);
  s1.start(t, Math.random()*1.5, 0.14);
  /* a little body under the thud */
  const o=AC.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(92+Math.random()*14, t);
  o.frequency.exponentialRampToValueAtTime(58, t+0.05);
  const eo=AC.createGain();
  eo.gain.setValueAtTime(0.0001, t);
  eo.gain.exponentialRampToValueAtTime(0.05*v*q, t+0.006);
  eo.gain.exponentialRampToValueAtTime(0.0001, t+0.07);
  o.connect(eo); eo.connect(out);
  o.start(t); o.stop(t+0.09);
  /* toe-off: the carpet pile springing back, just after the heel */
  const t2=t+0.055+Math.random()*0.03;
  const s2=AC.createBufferSource(); s2.buffer=aNoiseBuf;
  s2.playbackRate.value=1.3+Math.random()*0.3;
  const f2=AC.createBiquadFilter(); f2.type='bandpass'; f2.frequency.value=1300+Math.random()*500; f2.Q.value=0.9;
  const e2=AC.createGain();
  e2.gain.setValueAtTime(0.0001, t2);
  e2.gain.exponentialRampToValueAtTime(0.05*v*q, t2+0.010);
  e2.gain.exponentialRampToValueAtTime(0.0001, t2+0.10);
  s2.connect(f2); f2.connect(e2); e2.connect(out);
  const w2=AC.createGain(); w2.gain.value=0.22; e2.connect(w2); w2.connect(aSend);
  s2.start(t2, Math.random()*1.5, 0.12);

}
function sfxThud(){

   src.playbackRate.value=0.5+Math.random()*0.5;
   const f=AC.createBiquadFilter(); f.type='bandpass';
   f.frequency.value=700+Math.random()*700; f.Q.value=6+Math.random()*5;
   const f2=AC.createBiquadFilter(); f2.type='lowpass'; f2.frequency.value=1400;
   const g=AC.createGain();
   g.gain.setValueAtTime(0.0001, t0);
   g.gain.exponentialRampToValueAtTime(0.02+Math.random()*0.010, t0+0.02);
   g.gain.exponentialRampToValueAtTime(0.0001, t0+0.11+Math.random()*0.07);
   src.connect(f); f.connect(f2); f2.connect(g); g.connect(aMaster);
   src.start(t0, Math.random()*1.5, 0.2);
  }
 }catch(e){}
}
function updateAudio(dt){
 if(!AC) return;
 /* the hum only breathes: +-5% over 10-24s. no surges, no pumping */
 if(T > humDriftNext){ humDriftNext = T + 10 + Math.random()*14; humDriftTarget = 0.95 + Math.random()*0.10; }
 humDrift = damp(humDrift, humDriftTarget, 0.5, dt);
 aHumG.gain.value = damp(aHumG.gain.value, audioHumTarget*humDrift, 3, dt);
 aBuzzG.gain.value = damp(aBuzzG.gain.value, audioBuzzTarget, 6, dt);
 if(T > scratchNext){ scratchNext = T + 70 + Math.random()*130; sfxScratch(); }
 if(T > thudNext){ thudNext = T + 50 + Math.random()*90; sfxThud(); }
}
/* ================================================================
   DUST v10 - floating motes drifting in a 20m box around the player,
   settling slowly, wrapping when they fall out of range. each mote's
   brightness = proximity to the nearest working fixtures, so dust
   READS in the light pools and vanishes in the dark zones. one
   additive Points draw call, updated on the CPU (~620 motes).
   ================================================================ */
const DUST_N = 620;
const dustPos = new Float32Array(DUST_N*3);
const dustCol = new Float32Array(DUST_N*3);
const dustVel = new Float32Array(DUST_N*3);
const dustPh  = new Float32Array(DUST_N);
function dustReset(k){
 dustPos[k*3]   = player.pos.x + (Math.random()*20-10);
 dustPos[k*3+1] = 0.15 + Math.random()*(H-0.55);
 dustPos[k*3+2] = player.pos.z + (Math.random()*20-10);
 dustVel[k*3]   = (Math.random()-0.5)*0.035;
 dustVel[k*3+1] = -0.006 - Math.random()*0.018;
 dustVel[k*3+2] = (Math.random()-0.5)*0.035;
 dustPh[k]      = Math.random()*20;
}
for(let k=0;k<DUST_N;k++) dustReset(k);
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('color',    new THREE.BufferAttribute(dustCol, 3));
const dustTex = (()=>{
 const cv=document.createElement('canvas'); cv.width=cv.height=32;
 const g=cv.getContext('2d');
 const gr=g.createRadialGradient(16,16,1,16,16,15);
 gr.addColorStop(0,'rgba(255,250,235,1)');
 gr.addColorStop(0.45,'rgba(255,250,235,0.40)');
 gr.addColorStop(1,'rgba(255,250,235,0)');
 g.fillStyle=gr; g.fillRect(0,0,32,32);
 return new THREE.CanvasTexture(cv);
})();
const dustMat = new THREE.PointsMaterial({size:0.026, map:dustTex, vertexColors:true,
 transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true});
const dustPts = new THREE.Points(dustGeo, dustMat);
dustPts.frustumCulled = false;
scene.add(dustPts);
function updateDust(dt){
 const px=player.pos.x, pz=player.pos.z;
 const NL = Math.min(3, lightCands.length);
 for(let k=0;k<DUST_N;k++){
  let x=dustPos[k*3], y=dustPos[k*3+1], z=dustPos[k*3+2];
  x += (dustVel[k*3]   + 0.016*Math.sin(T*0.4+dustPh[k]))*dt*3.0;
  z += (dustVel[k*3+2] + 0.016*Math.cos(T*0.33+dustPh[k]*1.3))*dt*3.0;
  y += dustVel[k*3+1]*dt*3.0;
  if(y<0.06 || y>H-0.10 || Math.abs(x-px)>10.5 || Math.abs(z-pz)>10.5){
   dustReset(k); x=dustPos[k*3]; y=dustPos[k*3+1]; z=dustPos[k*3+2];
  }
  dustPos[k*3]=x; dustPos[k*3+1]=y; dustPos[k*3+2]=z;
  let b=0.045;
  for(let q=0;q<NL;q++){
   const f=lightCands[q].f;
   const d=Math.hypot(f.x-x, f.z-z);
   b += Math.max(0, 1-d/6.5)*0.60;
  }
  b *= 0.72+0.28*Math.sin(T*2.1+dustPh[k]*3.7);   // twinkle
  dustCol[k*3]=b; dustCol[k*3+1]=b*0.97; dustCol[k*3+2]=b*0.86;
 }
 dustGeo.attributes.position.needsUpdate = true;
 dustGeo.attributes.color.needsUpdate = true;
}
/* ================================================================
   HUD / MAIN LOOP / SEEDS
   ================================================================ */
const elClock=document.getElementById('hudclock'),
      elDate=document.getElementById('huddate'), elTape=document.getElementById('hudtape'),
      elSeed=document.getElementById('hudseed'), elFps=document.getElementById('hudfps'),
      elMode=document.getElementById('hudmode'), elStart=document.getElementById('start'),
      elGo=document.getElementById('golabel'), elHud=document.getElementById('hud');
const MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
let fpsVal=0;

function updateHUD(){
 const d=new Date();
 let hh=d.getHours(); const am=hh<12?'AM':'PM'; hh=hh%12||12;
 elClock.textContent = String(hh).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')+' '+am;
 elDate.textContent = MONTHS[d.getMonth()]+'.'+String(d.getDate()).padStart(2,'0')+' '+(1983+((SEED>>>3)%14));
 const mm=Math.floor(elapsed/60), ss=Math.floor(elapsed%60);
 elTape.textContent = 'TAPE '+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
 elSeed.textContent = 'TAPE #'+((SEED>>>0).toString(16).toUpperCase()).padStart(8,'0').slice(0,6);
 elMode.textContent = 'AUX';   // v16: one tape mode - always
 elFps.textContent  = fpsVal ? fpsVal+' FPS' : '';
}


function setSeed(s, silent){
 SEED = s|0;
 /* v18: the edge grammar is pure - no caches to clear */
 for(const k of Array.from(chunks.keys())) disposeChunk(k);
 curCi=1e9; curCj=1e9; pending.length=0;
 player.pos.set(2,0,2); player.vel.set(0,0,0); player.vy=0; player.grounded=true; player.wantJump=0; player.landY=0;
 player.yaw=0; player.pitch=0; player.roll=0; player.prevYaw=0; player.yawRateS=0;
player.leanPitch=0; player.vFs=0; player.vSs=0; player.aFs=0; player.pVF=0; player.spdS=0;
 player.bobPhase=0; player.bobEnv=0; player.bobY=0; player.bobLat=0; player.bobRoll=0;
 player.bobYaw=0; player.crouchA=0; player.sprintA=0; player.eye=1.62;
 player.lastStep=-1;
 elapsed=0;
 ensureChunks(true);
 snapCam();
 if(!silent){ sfxThud(); }
 // v16: no ?seed= URL write - the seed is not a user pick
 updateHUD();
}

function onResize(){
 applyRenderSize();
}
addEventListener('resize', onResize);

/* ================================================================
   DYNAMIC RESOLUTION - if the machine can't hold ~45fps the render
   scale steps down (floor 0.55x) and claws back up when there is
   headroom. the VHS look survives a lower internal res gracefully
   (tape was never sharp), so this is the main defense against
   "very performance heavy" on weak GPUs.
   ================================================================ */
let perfScale = 1, perfCooldown = 2.5;
function applyRenderSize(){
 renderer.setPixelRatio(BASE_PR*perfScale);
 renderer.setSize(innerWidth, innerHeight);
 renderer.getDrawingBufferSize(dbSize);
 rt.setSize(dbSize.x, dbSize.y);
 bw=Math.max(2,Math.floor(dbSize.x/2)); bh=Math.max(2,Math.floor(dbSize.y/2));
 qw=Math.max(2,Math.floor(dbSize.x/4)); qh=Math.max(2,Math.floor(dbSize.y/4));
 rtB1.setSize(bw,bh); rtB2.setSize(bw,bh); rtB3.setSize(qw,qh); rtB4.setSize(qw,qh);
 rtFin[0].setSize(dbSize.x,dbSize.y); rtFin[1].setSize(dbSize.x,dbSize.y);
 postMat.uniforms.uRes.value.copy(dbSize);
 postMat.uniforms.uTexel.value.set(1/dbSize.x, 1/dbSize.y);
 matBright.uniforms.uTexel.value.set(1/dbSize.x, 1/dbSize.y);
 ghostWarm = 0;                              // no stale ghost across a resize
 camera.aspect = innerWidth/innerHeight;
 camera.updateProjectionMatrix();
}
let perfHold=false;                              // test hook: freeze dynamic resolution
function updatePerf(dt){
 if(perfHold) return;
 perfCooldown -= dt;
 if(perfCooldown>0 || !fpsVal) return;
 if(fpsVal < 42 && perfScale > 0.55){
  perfScale = Math.max(0.55, perfScale-0.15);
  applyRenderSize();
  perfCooldown = 2.5;
 } else if(fpsVal > 57 && perfScale < 1){
  perfScale = Math.min(1, perfScale+0.1);
  applyRenderSize();
  perfCooldown = 4;
 }
}

elStart.addEventListener('click', ()=>{
 initAudio();
 try{ renderer.domElement.requestPointerLock(); }catch(e){}
});
document.addEventListener('pointerlockchange', ()=>{
 locked = !!document.pointerLockElement;
 if(locked){
  elStart.style.display='none';
  elHud.classList.add('on');
  if(AC && AC.state==='suspended') AC.resume();
  player.prevYaw = player.yaw;
 } else {
  elStart.style.display='flex';
  elGo.innerHTML='&#9616;&#9616; PAUSED &mdash; CLICK TO RESUME';
  elHud.classList.remove('on');
  for(const k in keys) keys[k]=false;
  player.wantJump=0;
  if(AC && AC.state==='running') AC.suspend();
 }
});

 let last = performance.now()/1000, fpsFrames=0, fpsT=0, hudT=0;
function frame(){
 requestAnimationFrame(frame);
 const now = performance.now()/1000;
 let rdt = now - last; last = now;
 if(rdt > 1){ rdt = 0; physAcc = 0; }        // tab-back stall: discard
 T += rdt;
 if(locked){
  elapsed += rdt;
  /* fixed-timestep physics + render interpolation: hitches skip
     renders but never stutter, speed-up or teleport the camera */
  physAcc += rdt;
  let steps = 0;
  while(physAcc >= PHYS_DT && steps < MAX_STEPS){
   snapCam();
   updatePlayer(PHYS_DT);
   physAcc -= PHYS_DT;
   steps++;
  }
  if(steps === MAX_STEPS) physAcc = 0;
 } else physAcc = 0;
 composeCamera(locked ? clamp(physAcc/PHYS_DT, 0, 1) : 1);
 ensureChunks(false);
 updateFixturesNear();
 updateLights(rdt);
 updateAudio(rdt);
 updateDust(rdt);
 updateTape(rdt);
 postMat.uniforms.uTime.value = T;
 renderFrame();
 fpsFrames++; fpsT += Math.max(rdt, 1e-4);   // v15: HONEST fps (real frame time)
 if(fpsT >= 0.5){ fpsVal = Math.round(fpsFrames/fpsT); fpsFrames=0; fpsT=0; }
 updatePerf(rdt);
 hudT += rdt;
 if(hudT >= 0.25){ hudT=0; updateHUD(); }
}

/* ---------------- boot ---------------- */
/* v16: EVERY RUN IS A NEW TAPE - the seed is rolled fresh on
   every load and is never picked: no URL param, no picker keys.
   (the __br debug hook still allows deterministic QA.) */
setSeed((Math.random()*0x7fffffff)|0, true);
updateHUD();
requestAnimationFrame(frame);
/* test/debug hook (harmless in production) */
 try{ window.__br = {
 setSeed, player, chunks, H, CS, WP, CRITIC,
 world:()=>({chunks:chunks.size, doors:DOOR_N, outlets:OUTLET_N, peels:PEEL_N, critic:{n:CRITIC.chunks, rerolled:CRITIC.rerolled, last:CRITIC.log.slice(-8)}}),
 buildStats:()=>({ms:BUILD_MS, n:BUILD_N, avg:+(BUILD_MS/Math.max(1,BUILD_N)).toFixed(1)}),
 audio:()=>({on:!!AC, state:AC?AC.state:'none', master:aMaster?aMaster.gain.value:0,
             hum:aHumG?aHumG.gain.value:-1, buzz:aBuzzG?aBuzzG.gain.value:-1,
             sampleRate:AC?AC.sampleRate:0, verb:!!aSend}),
 sfxStep, sfxThud, sfxScratch, initAudio, updateAudio,
 keys, updatePlayer, PHYS_DT, snapCam,
 perfHold:(v)=>{ perfHold=!!v; if(perfHold){ perfScale=1; applyRenderSize(); } },
 phys:(n,dt)=>{ n=n||60; dt=dt||PHYS_DT; for(let k=0;k<n;k++) updatePlayer(dt); },
 tp:(x,z)=>{ player.pos.set(x,0,z); player.vel.set(0,0,0); player.vy=0; player.grounded=true; ensureChunks(true); snapCam(); },
 fx:(v)=>{ postMat.uniforms.uVHS.value=v?1:0; postMat.uniforms.uCurve.value=v?1:0;
   postMat.uniforms.uShrp.value=v?0.45:0.2; ghostWarm=v?ghostWarm:0; },
 field:(x,z)=>{ const ci=Math.floor(x/CS), cj=Math.floor(z/CS);
   const ch=chunks.get(ci+','+cj); return ch?fieldAt(ch.grid,x,z):-1; }
}; }catch(e){}

</script>
