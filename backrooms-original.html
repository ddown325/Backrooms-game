 facilities. They said they'd 'been told'."},{theme:"yellow",title:"Memo, Facilities",text:"The hum is not a fault. Please stop filing tickets about the hum. Please stop describing the hum to new starters."},{theme:"yellow",title:"Handwritten",text:"If the hallway is shorter coming back, don't count the lights. Keep walking. Keep your eyes on the far end."},{theme:"any",title:"Torn page",text:"It only moves when you can't see it. I tried to blink slowly. I tried to keep it in the light. The light does not stay."},{theme:"yellow",title:"Lost property",text:"One almond water, unopened. Owner unknown. Please return it to the room you found it in. We will know."},{theme:"yellow",title:"HR notice",text:"Congratulations on your third anniversary with the company. Your desk has been moved down to Level 0. You have always worked here."},{theme:"any",title:"Calendar page",text:"Every date is circled and every date is the same date. Underneath, in pen: I AM STILL ON SHIFT."},{theme:"any",title:"Incident report",text:"Subject stopped responding at 03:07. Tubes failed across the sector. Last seen walking towards the dark, calmly, like he was late."},{theme:"any",title:"Margin note",text:"The torch makes it flinch but only for a moment, and it learns. Do not lean on it. Stand under a real light and wait."},{theme:"any",title:"Taped to door",text:"It listens. Don't run. Don't slam anything. If you hear it ticking behind you, stand still and let it decide you were nothing."},{theme:"concrete",title:"Forklift log",text:"Pallet 114 moved to bay 9. Pallet 114 is back in bay 3. Nobody drove it. The lights above bay 3 have been off since March."},{theme:"concrete",title:"Safety poster",text:"THE WARDEN IS NOT A MEMBER OF STAFF. If you see a lantern, do not approach it. If it sees you, do not run in the open."},{theme:"concrete",title:"Shift swap",text:"Can someone take my night on dock 2? I keep hearing someone breathing down the far aisle and when I go to look the aisle is longer."},{
