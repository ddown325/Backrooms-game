<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Battle Ball Sim — autonomous 1v1 fights</title><meta name="description" content="An autonomous 1v1 battle-ball simulation in a dark void arena. 53 unique duelists — Papyrus, Sans, Jevil, Kirby, Asgore, Last Breath Sans, Spamton NEO plus a full UNDERTALE AU wing (Blueberry, Stretch, Red, Edge, Killer, Horror, Error, Ink, Dream, Nightmare, Cross, Geno, Outer, Fresh) — with named attacks, SUPER ultimates, gaster blasters, talking fighters, cinematic mode cutscenes with 2nd-phase transformations, boss battles, the rare DUST accident and THE SACRIFICE between brothers of different worlds. Winner stays on. No player control." />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0A0C12;
    color: #E7E5E4;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    user-select: none;
  }
  main { width: 100%; max-width: 760px; padding: 24px 16px; display: flex; flex-direction: column; gap: 12px; }
  @media (min-width: 640px) { main { padding: 24px; gap: 12px; } }

  /* VS header */
  .vshead { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .vshead .vn { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vshead .bosschip {
    border: 1px solid rgba(245,158,11,.5); background: rgba(245,158,11,.1); color: #FBBF24;
    border-radius: 999px; padding: 0 8px; font-size: 9px; font-weight: 700; letter-spacing: .12em; line-height: 15px; white-space: nowrap;
  }
  .vshead .vs { font-size: 11px; font-weight: 600; letter-spacing: .14em; color: #6B7280; }

  /* fighter cards */
  .cards { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  @media (min-width: 640px) { .cards { gap: 24px; } }
  .card { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .card.right .top { flex-direction: row-reverse; }
  .dot { width: 10px; height: 10px; border-radius: 999px; flex-shrink: 0; }
  .name { font-size: 14px; font-weight: 600; color: #F5F5F4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { flex-shrink: 0; border-radius: 999px; padding: 0 6px; font-size: 8.5px; font-weight: 700; letter-spacing: .1em; line-height: 14px; white-space: nowrap; }
  .badge.boss { border: 1px solid rgba(245,158,11,.5); background: rgba(245,158,11,.1); color: #FBBF24; }
  .badge.serious { border: 1px solid rgba(239,68,68,.5); background: rgba(239,68,68,.1); color: #F87171; }
  .badge.badtime { border: 1px solid rgba(34,211,238,.5); background: rgba(34,211,238,.1); color: #67E8F9; }
  .badge.dust { border: 1px solid rgba(220,38,38,.6); background: rgba(220,38,38,.14); color: #FCA5A5; }
.badge.phase2 { border: 1px solid rgba(139,92,246,.6); background: rgba(139,92,246,.15); color: #C4B5FD; }  .badge.grief { border: 1px solid rgba(120,113,108,.6); background: rgba(120,113,108,.15); color: #D6D3D1; }  .hpnum { font-size: 12px; font-weight: 700; color: #E7E5E4; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hpnum b { color: #52525B; font-weight: 400; }
  .wins { font-size: 11px; color: #52525B; font-variant-numeric: tabular-nums; }
  .atk { font-size: 9.5px; font-weight: 600; letter-spacing: .06em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card.right .atk { text-align: right; }
  .bar { position: relative; height: 8px; border-radius: 999px; background: rgba(255,255,255,.1); }
  .bar .bghost, .bar .bfill { position: absolute; top: 0; bottom: 0; border-radius: 999px; }
  .bar .bghost { left: 0; background: rgba(245,158,11,.62); transition: width .45s ease-out; }
  .bar .bfill { left: 0; transition: width .15s ease-out; }
  .card.right .bar .bghost, .card.right .bar .bfill { left: auto; right: 0; }
  .mbar { position: relative; height: 3px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; }
  .mbar div { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 999px; background: rgba(217,119,6,.7); transition: width .25s ease-out; }
  .card.right .mbar div { left: auto; right: 0; }
  .mbar.ready div { background: #FBBF24; animation: mPulse 1s ease-in-out infinite; }
  @keyframes mPulse { 50% { opacity: .55; } }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; height: 16px; overflow: hidden; }
  .card.right .chips { justify-content: flex-end; }
  .chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); border-radius: 999px; padding: 0 6px; font-size: 10px; line-height: 14px; color: #A1A1AA; }
  .chip .d { width: 6px; height: 6px; border-radius: 999px; }

  .mid { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 6px; }
  .mid .lbl { font-size: 10px; letter-spacing: .04em; color: #52525B; }
  .mid .score { font-size: 15px; font-weight: 700; color: #F5F5F4; font-variant-numeric: tabular-nums; }
  .mid .time { font-size: 12.5px; color: #A1A1AA; font-variant-numeric: tabular-nums; }
  .streak {
    display: inline-flex; align-items: center; gap: 4px; margin-top: 2px;
    border: 1px solid; border-radius: 999px; padding: 0 6px;
    font-size: 9.5px; font-weight: 500; line-height: 15px; white-space: nowrap;
  }
  .streak .d { width: 6px; height: 6px; border-radius: 999px; }

  /* arena — the void battle box */
  .arena {
    position: relative; width: 100%; aspect-ratio: 1 / 1;
    border: 1px solid rgba(255,255,255,.16); border-radius: 12px; background: #0A0C12;
    overflow: hidden; box-shadow: 0 0 60px rgba(56,189,248,.06);
  }
  .arena canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(0,0,0,.7); backdrop-filter: blur(2px);
    animation: duel-appear .25s ease-out both;
  }
  .overlay .inner { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .overlay .wline { display: flex; align-items: center; gap: 8px; }
  .overlay .wd { width: 12px; height: 12px; border-radius: 999px; }
  .overlay .wt { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; color: #F5F5F4; }
  .overlay .sub { font-size: 11px; color: #A1A1AA; }
  .overlay .sub.gold { color: #FBBF24; font-weight: 500; }
  .veil { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.6); backdrop-filter: blur(2px); }
  .veil span { font-size: 13px; color: #71717A; }
  .res-actions { display: flex; gap: 16px; margin-top: 6px; }
  .res-actions button {
    background: none; border: none; padding: 0; cursor: pointer;
    font-size: 11px; color: #71717A; text-decoration: underline; text-underline-offset: 4px;
    transition: color .12s;
  }
  .res-actions button:hover { color: #F5F5F4; }
  .hidden { display: none !important; }

  /* matchup picker */
  .picker {
    position: absolute; inset: 0; z-index: 5;
    background: rgba(10,12,18,.96); backdrop-filter: blur(3px);
    display: flex; flex-direction: column; gap: 10px; padding: 14px;
    animation: duel-appear .2s ease-out both;
  }
  .pk-head { display: flex; align-items: center; justify-content: space-between; }
  .pk-title { font-size: 12px; font-weight: 600; letter-spacing: -0.01em; color: #F5F5F4; }
  .pk-close {
    width: 24px; height: 24px; display: grid; place-items: center;
    background: none; border: none; border-radius: 6px; color: #71717A; cursor: pointer;
    transition: background .12s, color .12s;
  }
  .pk-close:hover { background: rgba(255,255,255,.08); color: #E7E5E4; }
  .pk-close svg { width: 13px; height: 13px; }
  .pk-slots { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .slot {
    display: inline-flex; align-items: center; gap: 6px; max-width: 44%;
    border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.03); border-radius: 999px;
    padding: 5px 12px; font-size: 11px; color: #A1A1AA; cursor: pointer;
    transition: border-color .12s, color .12s;
  }
  .slot:hover { border-color: rgba(255,255,255,.4); }
  .slot.active { border-color: #F5F5F4; color: #F5F5F4; }
  .slot .d { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
  .slot .nm { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .tag { font-size: 9px; color: #52525B; flex-shrink: 0; }
  .vs { font-size: 10px; color: #52525B; }
  .pk-grid {
    flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 6px; padding: 2px; align-content: start;
  }
  .fhead {
    grid-column: 1 / -1;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .22em;
    color: #71717A;
    padding: 6px 2px 2px;
  }
  .fhead.au { color: rgba(167,139,250,.85); }
  @media (min-width: 560px) { .pk-grid { grid-template-columns: repeat(4, 1fr); } }
  .fbtn {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.02); border-radius: 10px;
    padding: 8px 10px; cursor: pointer; text-align: left;
    transition: border-color .12s, background .12s;
    font-family: inherit;
  }
  .fbtn:hover { border-color: rgba(255,255,255,.32); background: rgba(255,255,255,.05); }
  .fbtn.picked { border-color: #F5F5F4; background: rgba(255,255,255,.08); }
  .fbtn.bossbtn { border-color: rgba(245,158,11,.25); background: rgba(245,158,11,.05); }
  .fbtn.bossbtn:hover { border-color: rgba(245,158,11,.55); }
  .fbtn.bossbtn.picked { border-color: #FBBF24; background: rgba(245,158,11,.12); }
  .fbtn.dustbtn { border-color: rgba(220,38,38,.3); background: rgba(220,38,38,.05); }
  .fbtn.dustbtn:hover { border-color: rgba(220,38,38,.6); }
  .fbtn.dustbtn.picked { border-color: #EF4444; background: rgba(220,38,38,.12); }
  .fbtn.dim { opacity: .3; pointer-events: none; }
  .fbtn .nm { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #F5F5F4; max-width: 100%; }
  .fbtn .nm canvas.cv { width: 30px; height: 30px; flex-shrink: 0; display: block; }
  .fbtn .nm span.n { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fbtn .nm .bt { flex-shrink: 0; font-size: 8px; font-weight: 700; letter-spacing: .1em; color: #FBBF24; }
  .fbtn .nm .bt.dt { color: #FCA5A5; }
  .fbtn .st { font-size: 10px; color: #A1A1AA; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fbtn .ds { font-size: 9.5px; line-height: 1.3; color: #71717A; max-width: 100%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fbtn .su { font-size: 9px; font-weight: 600; letter-spacing: .02em; color: rgba(251,191,36,.9); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pk-actions { display: flex; align-items: center; justify-content: space-between; }
  .pk-shuffle {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.04); color: #A1A1AA;
    border-radius: 999px; padding: 6px 12px; font-size: 11px; cursor: pointer; font-family: inherit;
    transition: border-color .12s, color .12s;
  }
  .pk-shuffle:hover { border-color: rgba(255,255,255,.4); color: #F5F5F4; }
  .pk-shuffle svg { width: 12px; height: 12px; }
  .pk-start {
    background: #F5F5F4; color: #0A0C12; border: none; border-radius: 999px;
    padding: 7px 16px; font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit;
    transition: background .12s;
  }
  .pk-start:hover { background: #FFFFFF; }

  /* footer */
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .foot .note { font-size: 11px; color: #52525B; }
  .btns { display: flex; gap: 8px; }
  .ibtn {
    width: 32px; height: 32px; display: grid; place-items: center;
    border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); border-radius: 8px; color: #71717A;
    cursor: pointer; transition: background .12s, color .12s, transform .05s;
  }
  .ibtn:hover { background: rgba(255,255,255,.08); color: #E7E5E4; }
  .ibtn:active { transform: scale(.94); }
  .ibtn svg { width: 15px; height: 15px; }

  @keyframes duel-appear { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: scale(1); } }

  /* cutscene cinema mode — the page chrome fades out while the scene plays */
  .vshead, .cards, .foot { transition: opacity .3s ease; }
  body.cine .vshead, body.cine .cards, body.cine .foot { opacity: 0; pointer-events: none; }
  /* the WIN cutscene owns the podium moment too — the result overlay waits */
  body.cine .overlay { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<main>
  <div class="vshead">
    <span class="vn" id="vsA" style="color:#16A34A">—</span>
    <span class="bosschip hidden" id="bossChip">BOSS BATTLE</span>
    <span class="vs">VS</span>
    <span class="vn" id="vsB" style="color:#D97706">—</span>
  </div>

  <div class="cards">
    <div class="card left" id="cardA">
      <div class="top">
        <span class="dot" id="dotA"></span>
        <span class="name" id="nameA">—</span>
        <span class="hpnum"><span id="hpA">0</span> / <b id="maxA">100</b></span>
        <span class="wins" id="wA"></span>
      </div>
      <span class="atk" id="atkA"></span>
      <div class="top2" id="badgesA" style="display:none; gap:4px; overflow:hidden; height:14px;"></div>
      <div class="bar"><div class="bghost" id="gbarA"></div><div class="bfill" id="barA"></div></div>
      <div class="mbar" id="mA"><div id="mbarA"></div></div>
      <div class="chips" id="chipsA"></div>
    </div>
    <div class="mid">
      <span class="lbl" id="lbl">match</span>
      <span class="score" id="score">0 – 0</span>
      <span class="time" id="time">1:15</span>
      <span class="streak hidden" id="streak"><span class="d"></span><span id="streakTx"></span></span>
    </div>
    <div class="card right" id="cardB">
      <div class="top">
        <span class="dot" id="dotB"></span>
        <span class="name" id="nameB">—</span>
        <span class="hpnum"><span id="hpB">0</span> / <b id="maxB">100</b></span>
        <span class="wins" id="wB"></span>
      </div>
      <span class="atk" id="atkB"></span>
      <div class="top2" id="badgesB" style="display:none; gap:4px; overflow:hidden; height:14px;"></div>
      <div class="bar"><div class="bghost" id="gbarB"></div><div class="bfill" id="barB"></div></div>
      <div class="mbar" id="mB"><div id="mbarB"></div></div>
      <div class="chips" id="chipsB"></div>
    </div>
  </div>

  <div class="arena" id="arena">
    <canvas id="cv"></canvas>
    <div class="overlay hidden" id="overlay">
      <div class="inner">
        <div class="wline"><span class="wd" id="wd"></span><span class="wt" id="wt">—</span></div>
        <span class="sub" id="wsub"></span>
        <div class="res-actions">
          <button id="btnAgain" type="button">again</button>
          <button id="btnNew" type="button">new pair</button>
        </div>
      </div>
    </div>
    <div class="veil hidden" id="veil"><span>paused</span></div>
    <div class="picker hidden" id="picker">
      <div class="pk-head">
        <span class="pk-title">select matchup</span>
        <button class="pk-close" id="btnClosePk" aria-label="Close" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="pk-slots">
        <button class="slot active" id="slotA" type="button">
          <span class="d" id="slotDotA"></span><span class="nm" id="slotNameA">—</span><span class="tag">left</span>
        </button>
        <span class="vs">vs</span>
        <button class="slot" id="slotB" type="button">
          <span class="d" id="slotDotB"></span><span class="nm" id="slotNameB">—</span><span class="tag">right</span>
        </button>
      </div>
      <div class="pk-grid" id="fgrid"></div>
      <div class="pk-actions">
        <button class="pk-shuffle" id="btnShuffle" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
          random
        </button>
        <button class="pk-start" id="btnStart" type="button">start match</button>
      </div>
    </div>
  </div>

  <div class="foot">
    <span class="note">autonomous 1v1 battle sim · 53 duelists · every ball talks · winner stays on · space pause · n next · l lineup · m mute</span>
    <div class="btns">
      <button class="ibtn" id="btnPause" aria-label="Pause" title="Pause"></button>
      <button class="ibtn" id="btnNext" aria-label="Next match" title="Next match"></button>
      <button class="ibtn" id="btnLineup" aria-label="Select matchup" title="Select matchup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" x2="19" y1="19" y2="13"/><line x1="16" x2="20" y1="16" y2="20"/><line x1="19" x2="21" y1="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 10"/><line x1="5" x2="9" y1="14" y2="18"/><line x1="7" x2="4" y1="17" y2="20"/><line x1="3" x2="5" y1="19" y2="21"/></svg>
      </button>
      <button class="ibtn" id="btnMute" aria-label="Mute" title="Mute"></button>
    </div>
  </div>
</main>
