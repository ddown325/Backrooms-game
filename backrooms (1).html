/* ================================================================
   WORLD GENERATION v12 - THE LIMINAL PASS. no districts, no
   halls/suites split ("too open and closed"): one porous wall
   vocabulary EVERYWHERE. walls live on periodic RUNS (4-5 cells
   of every 5-7) on ~78% of grid lines; each run carries 1-2
   deliberate openings (cased doors / arches / wide passages)
   and 12% of runs become long half-wall partitions. rooms are
   rarer + smaller (2-3 cells, 26% of the 24m lattice) and every
   room gets a SECOND broad opening so it reads as a pocket of
   the maze, never a sealed box. a SEAL GUARD wraps edge():
   whenever the four raw edges of a cell are all blocking walls,
   one hashed edge of that cell becomes a cased door - nothing
   is ever fully boxed in. crawl rooms keep their 1.30m dropped
   ceiling wall-to-wall; octagon rooms keep their chamfers.
   macro corridors every 32m still carry the long sightlines.
   all fixtures ON (see cellFixture) + baked light (buildBake).
   ================================================================ */
const CELL=4, CH=8, CS=CELL*CH;      // 32m chunks, 4m cells
const WALL_T=0.17, H=3.02;
const GRID=0.615;                     // 2ft ceiling grid
const WT  = WALL_T/2;                 // wall half-thickness (both axes)
const WT2 = WT + 0.032;                // baseboard half-thickness
const POST_W = 2*WT - 0.003;          // corner post (1.5mm recessed)
const POST_T = 2*(WT2 - 0.0025);      // corner post trim
const LOAD_R=2, UNLOAD_R=3;           // 5x5 chunks (64m guaranteed) + fog 0.027
let SEED = 0;
const chunks = new Map();

function density(i,j){   /* v9: three octaves - hall/room zone
   shapes actually vary instead of one mid-gray smear */
 return 0.58*vnoise(i, j, (SEED^0x51ab)|0, 11) + 0.28*vnoise(i, j, (SEED^0x9E21)|0, 5) + 0.14*vnoise(i, j, (SEED^0x33CC)|0, 3);
}

/* v9 MACRO CORRIDORS - the missing structure. every 32m a
   corridor line runs N-S (columns i = 8k) or E-W (rows j = 8k),
   quasi-continuous (8-11 of every 13 cells active), the two
   through the origin guaranteed generous. every wall
   PERPENDICULAR to a corridor is suppressed -> LONG straight
   sightlines; the SIDE walls keep normal rules so each corridor
   still reads as a tunnel with rooms bleeding in through
   openings. this is the spine the wall-line maze hangs off, and
   it kills the "confetti walls" feel: walls form long coherent
   runs punctuated by real openings. */
const RC = 8;
function corrSpan(key, along){
 const s  = Math.floor(h2i(key, 1717, (SEED^0xC071)|0)*26)-13;
 const sp = 8 + Math.floor(h2i(key, 2727, (SEED^0xC072)|0)*4);   // 8..11 of 13
 const m  = ((along - s) % 13 + 13) % 13;
 return m < sp;
}
function inCorrX(i, j){                     // cell (i,j) inside a N-S corridor
 if((i&7)!==0) return false;
 if(i===0) return ((j%13)+13)%13 < 11;      // origin corridor: always generous
 return corrSpan(i, j);
}
function inCorrZ(i, j){                     // cell (i,j) inside an E-W corridor
 if((j&7)!==0) return false;
 if(j===0) return ((i%13)+13)%13 < 11;
 return corrSpan(1000003+j, i);
}

/* ================= v10 ROOMS ================= */
const roomAnchorCache = new Map();
const roomCellCache = new Map();
function roomAnchor(a, b){          // room rect anchored in block (6a..6a+5, 6b..6b+5)
 const key = a+','+b;
 const hit = roomAnchorCache.get(key);
 if(hit!==undefined) return hit;
 let r = null;
  if(h2i(a*13+5, b*17+9, (SEED^0x40A1)|0) < roomChance(a, b)){
  const w  = 2 + Math.floor(h2i(a*7+1,  b*11+3, (SEED^0x40A2)|0)*1.99);   // 2..3 (v12: smaller)
  const hh = 2 + Math.floor(h2i(a*19+2, b*23+7, (SEED^0x40A3)|0)*1.99);   // 2..3
  const ox = 1 + Math.floor(h2i(a*3+7,  b*5+1,  (SEED^0x40A4)|0)*3.0);    // 1..3
  const oz = 1 + Math.floor(h2i(a*11+5, b*13+2, (SEED^0x40A5)|0)*3.0);
  const x0 = a*6+ox, z0 = b*6+oz;   // [6a+1, 6a+7) - never crosses into the next block
  let ok = true;
  for(let ci=x0; ci<x0+w && ok; ci++)for(let cj=z0; cj<z0+hh && ok; cj++){
   if(inCorrX(ci,cj) || inCorrZ(ci,cj)) ok=false;
   if((ci*CELL+2-2)*(ci*CELL+2-2)+(cj*CELL+2-2)*(cj*CELL+2-2) < 169) ok=false;  // 13m spawn clearing
  }
  if(ok){
   const st2 = h2i(a*29+3, b*31+1, (SEED^0x40A7)|0);
   let st;                          // 0 open, 1 pillars, 2 twin, 3 grid, 4 crawl, 5 octagon
   if(st2 < 0.13) st = 4;
   else if(st2 < 0.29) st = 5;
   else st = Math.floor(h2i(a*37+9, b*41+5, (SEED^0x40A8)|0)*4);
   if(st===2 && (w&1)===1 && (hh&1)===1) st = 0;      // twin needs an even split dim
   if(st===3 && (w&1)===1 && (hh&1)===1) st = 0;      // grid needs even dims for the cross
   /* twin: split along the even dim; leave a 1-cell gap in the half
      wall so the halves stay connected */
   let splitAxis=0, gapC=0;
   if(st===2){
    splitAxis = (w&1)===0 ? 0 : 1;
    gapC = splitAxis===0 ? z0+(hh>>1) : x0+(w>>1);
   }
   if(st===3){
    splitAxis = (w&1)===0 ? 0 : 1;                     // split the even dim, door at middle
    gapC = splitAxis===0 ? z0+(hh>>1) : x0+(w>>1);
   }
   /* entry: middle-ish cell of one perimeter side */
   const eSide = Math.floor(h2i(a*43+7, b*47+3, (SEED^0x40A9)|0)*4);
   let ePos;
   if(eSide===0||eSide===2) ePos = x0 + (w>>1) + ((h2i(a*53+1,b*59+7,(SEED^0x40AA)|0)<0.5)?0:(w>2?1:0)-(w>2?0:0));
   else                     ePos = z0 + (hh>>1) + ((h2i(a*61+3,b*67+5,(SEED^0x40AB)|0)<0.5)?0:(hh>2?1:0)-(hh>2?0:0));
   if(eSide===0||eSide===2) ePos = Math.min(ePos, x0+w-1);
   else                     ePos = Math.min(ePos, z0+hh-1);
   const eArch = h2i(a*71+1, b*73+9, (SEED^0x40AC)|0) < 0.42;
  /* v12: every room carries a SECOND broad opening on a different
     side - rooms read as pockets of the maze, never sealed boxes */
  const e2side = (eSide + 1 + Math.floor(h2i(a*83+1, b*89+5, (SEED^0x40AD)|0)*3)) % 4;
  const e2pos = (e2side===0||e2side===2)
   ? x0 + Math.floor(h2i(a*97+3, b*101+7, (SEED^0x40AE)|0)*w)
   : z0 + Math.floor(h2i(a*97+3, b*101+7, (SEED^0x40AE)|0)*hh);
   /* the INSIDE cell at the entry - the crawl-room soffit skips it
      so you step in upright, then duck under the bulkhead */
   let eIn;
   if(eSide===1)      eIn=[x0+w-1, ePos];
   else if(eSide===3) eIn=[x0, ePos];
   else if(eSide===2) eIn=[ePos, z0+hh-1];
   else               eIn=[ePos, z0];
   r = {x0, z0, w, h:hh, st, splitAxis, gapC, eSide, ePos, eArch, eIn,
        e2side, e2pos, a, b};
  }
 }
 if(roomAnchorCache.size > 3000) roomAnchorCache.clear();
 roomAnchorCache.set(key, r);
 return r;
}
/* v12: rooms are RARER and district-free (the density banding
   that gated them into maze/suites is gone) - they punctuate the
   partition maze at a uniform 26% of the 24m lattice instead of
   boxing whole districts up */
function roomChance(a, b){
 return 0.26;
}
function roomAt(i, j){              // room containing cell (i,j), or null
 const key = i+','+j;
 const hit = roomCellCache.get(key);
 if(hit!==undefined) return hit;
 let r = null;
 const a = Math.floor(i/6), b = Math.floor(j/6);   // rect lies inside [6a+1, 6a+7)
 const rr = roomAnchor(a, b);
 if(rr && i>=rr.x0 && i<rr.x0+rr.w && j>=rr.z0 && j<rr.z0+rr.h) r = rr;
 if(roomCellCache.size > 30000) roomCellCache.clear();
 roomCellCache.set(key, r);
 return r;
}

/* crawl rooms (st 4) are the only crouch spaces - a dropped
   1.30m ceiling spanning the room wall-to-wall. */
const CRAWL_Y = 1.30;
function crawlAt(i, j){
 const r = roomAt(i, j);
 return r ? r.st===4 : false;
}

/* a "wall line" is an infinite grid line (x = L*CELL or z = L*CELL).
   v12 LIMINAL TUNING: active ~78%, runs of 4-5 cells every 5-7 -
   shorter than v11's 4-8/6-10 so walls never wall-off huge areas
   nor stretch into colonnade halls: partition-scale everywhere,
   every run punctuated by openings. */
function lineInfo(L, axis){
 const A = axis===0?911:1201, B = axis===0?913:1203, C = axis===0?917:1207, D = axis===0?919:1209;
 return {
  active: h2i(L, A, (SEED^0xA1)|0) < 0.78,
  start : Math.floor(h2i(L, C, (SEED^0xA3)|0)*28)-14,
  period: 5 + Math.floor(h2i(L, D, (SEED^0xA4)|0)*3),   // 5..7 cells
  span  : 4 + Math.floor(h2i(L, B, (SEED^0xA2)|0)*2)    // 4..5 cells
 };
}
function inSpan(li, along){
 const m = ((along - li.start) % li.period + li.period) % li.period;
 return m < li.span;
}
/* the contiguous solid RUN containing `along` on this line:
   [rs, rs+span) in along-cells. openings hash on the RUN, so every
   cell of the run agrees on where its opening is. */
function runStart(li, along){
 const m = ((along - li.start) % li.period + li.period) % li.period;
 return along - m;
}
/* v11 district: 0 = open HALLS, 1 = classic MAZE, 2 = SUITES */
function zoneOf(di){ return di < 0.34 ? 0 : di < 0.63 ? 1 : 2; }

/* edge(i,j,0): wall plane at x=(i+1)*CELL spanning z cell j.
   edge(i,j,1): wall plane at z=(j+1)*CELL spanning x cell i.
   v12 order: ROOMS first (perimeter forced with entry + a SECOND
   broad opening, interior open, twin/grid splits) -> corridor
   cross suppression -> UNIFORM LIMINAL RUNS: each wall line forms
   periodic RUNS; a run is either solid, a long half-wall
   partition (12%), or carries 1-2 OPENINGS (one uniform
   vocabulary: cased door / standard-tall-twin arch / wide).
   every cell of a run derives the SAME run hashes, so runs and
   their openings are chunk-independent and read as deliberate
   architecture. edge() (after this function) wraps edgeRaw with
   the SEAL GUARD - no cell can end up fully boxed in. */
function edgeRaw(i, j, axis){
 const RA = roomAt(i, j);
 const RB = roomAt(axis===0 ? i+1 : i, axis===0 ? j : j+1);
 if(RA || RB){
  if(RA && RA===RB){
   /* interior of a room. twin: a half-wall split with a 1-cell gap.
      grid: a full split wall with a door at the gap cell. */
   if(RA.st===2){
    if(RA.splitAxis===axis){
     const c = axis===0 ? j : i;
     if(c===RA.gapC) return null;
     return {axis, L: axis===0 ? i+1 : j+1, along: c, kind:'half'};
    }
    return null;
   }
   if(RA.st===3){
    if(RA.splitAxis===axis){
     const L = axis===0 ? i+1 : j+1;
     const c = axis===0 ? j : i;
     const mid = RA.splitAxis===0 ? RA.x0 + RA.w/2 : RA.z0 + RA.h/2;
     if(L===mid){
      if(c===RA.gapC) return {axis, L, along: c, kind:'door'};
      return {axis, L, along: c, kind:'solid', room:1};
     }
    }
    return null;
   }
   return null;                                  // open / pillars / crawl / octagon: open inside
  }
  /* boundary of a room? */
  let per=null, isEntry=false;
  if(axis===0){
   const Lc=i+1;
   if(RA && Lc===RA.x0+RA.w && j>=RA.z0 && j<RA.z0+RA.h){ per=RA; isEntry = RA.eSide===1 && j===RA.ePos; }
   else if(RB && Lc===RB.x0 && j>=RB.z0 && j<RB.z0+RB.h){ per=RB; isEntry = RB.eSide===3 && j===RB.ePos; }
  } else {
   const Lc=j+1;
   if(RA && Lc===RA.z0+RA.h && i>=RA.x0 && i<RA.x0+RA.w){ per=RA; isEntry = RA.eSide===2 && i===RA.ePos; }
   else if(RB && Lc===RB.z0 && i>=RB.x0 && i<RB.x0+RB.w){ per=RB; isEntry = RB.eSide===0 && i===RB.ePos; }
  }
  if(per){
   if(!isEntry){
    /* v12: the room's SECOND broad opening - rooms are pockets of
       the maze, never sealed boxes */
    const Lc2 = axis===0 ? i+1 : j+1;
    const side = axis===0 ? (Lc2===per.x0+per.w ? 1 : 3)
                          : (Lc2===per.z0+per.h ? 2 : 0);
    const c = axis===0 ? j : i;
    if(per.e2side===side && c===per.e2pos)
     return {axis, L: axis===0?i+1:j+1, along: c, kind:'wide', hw:1.25};
    return {axis, L: axis===0?i+1:j+1, along: axis===0?j:i, kind:'solid', room:1};
   }
   if(per.eArch) return {axis, L: axis===0?i+1:j+1, along: axis===0?j:i, kind:'arch', hw:0.82, spring:2.02};
   return {axis, L: axis===0?i+1:j+1, along: axis===0?j:i, kind:'door'};
  }
  if(RA && RB) return {axis, L: axis===0?i+1:j+1, along: axis===0?j:i, kind:'solid', room:1};  // two rooms touching
  /* RA xor RB but not a perimeter edge: outside the room's span in
     this direction - normal maze wall applies */
 }
 if(axis===1 && (inCorrX(i,j) || inCorrX(i,j+1))) return null;   // N-S corridor cross-wall
 if(axis===0 && (inCorrZ(i,j) || inCorrZ(i+1,j))) return null;   // E-W corridor cross-wall
 const L = axis===0 ? i+1 : j+1;
 const along = axis===0 ? j : i;
 const mx = axis===0 ? L*CELL : (i+0.5)*CELL;
 const mz = axis===0 ? (j+0.5)*CELL : L*CELL;
 if((mx-2)*(mx-2)+(mz-2)*(mz-2) < 56) return null;            // spawn clearing r~7.5m
 const di = axis===0 ? density(L-0.5, j+0.5) : density(i+0.5, L-0.5);
 const li = lineInfo(L, axis);
 if(!li.active || !inSpan(li, along)) return null;
 const rs = runStart(li, along);                              // run = [rs, rs+span)
 const span = li.span;
 /* 12% of runs become long freestanding half-wall partitions
    (merged by buildLine into one capped wall) - the office
    partition feel, in every part of the map */
 if(h2i(L*3+axis, rs*7+1, (SEED^0x5A1B)|0) < 0.12)
  return {axis, L, along, kind:'half'};
 /* OPENING SLOTS - the deliberate doors of this run. every run of
    span>=3 gets one; runs of span>=5 get a second at least 2 cells
    from the first. hashed per RUN. */
 let o1=-1, o2=-1;
 if(span >= 3){
  o1 = rs + 1 + Math.floor(h2i(L*5+axis, rs*3+1, (SEED^0x0FE1)|0)*(span-2));
  if(span >= 5){
   o2 = rs + span - 2 - Math.floor(h2i(L*7+axis, rs*5+3, (SEED^0x0FE2)|0)*(span-3));
   if(o2 - o1 < 2) o2 = Math.min(o1+2, rs+span-1);
   if(o2 <= o1) o2 = -1;
  }
 }
 if(along!==o1 && along!==o2) return {axis, L, along, kind:'solid'};
 /* this cell IS the run's opening: ONE uniform liminal vocabulary -
    the canon mix of cased doors, arches and broad passages, the
    same everywhere (no districts) */
 const r = h2i(L*2+axis, rs*11+along, (SEED^0xC0FFEE)|0);
 const av = h2i(L*5+axis, along*11+3, (SEED^0xA2C4)|0);
 let kind='solid', hw, spring, twin;
 if(r < 0.45){
  kind = 'door';
 } else if(r < 0.65){
  kind = 'arch';
  if(av < 0.62){ hw=0.82; spring=2.02; }        // standard arch
  else if(av < 0.86){ hw=0.66; spring=2.30; }   // tall slim arch
  else { hw=0.62; spring=2.02; twin=1.05; }     // twin arches sharing a pier
 } else {
  kind = 'wide';
  hw = 0.95 + 0.40*h2i(L*9+axis, rs*13+along, (SEED^0x5A99)|0);
 }
 return {axis, L, along, kind, hw, spring, twin};
}

/* v12 PERF + SEAL GUARD + edge cache. edge() = edgeRaw + the
   guarantee that no cell is ever sealed: if all four RAW edges of a
   cell are blocking walls (solid or half), one hashed edge of that
   cell becomes a cased door. cells therefore always keep at least
   one passable connection - the maze can get dense but never boxes
   you (or a room, or a corridor pocket) in. results are cached
   with NUMERIC keys (string keys were a measurable cost in the
   floor/ceiling AO loops); cleared on seed change. */
const edgeCache = new Map();
function edge(i, j, axis){
 if(Math.abs(i)>8000 || Math.abs(j)>8000) return edgeRaw(i, j, axis);
 const key = ((i+8192)*16384 + (j+8192))*2 + axis;
 const hit = edgeCache.get(key);
 if(hit!==undefined) return hit;
 let e = edgeRaw(i, j, axis);
 if(e && (e.kind==='solid' || e.kind==='half')){
  if(axis===0){
   if(sealOpener(i, j, 1, e) || sealOpener(i+1, j, 0, e))
    e = {axis, L:i+1, along:j, kind:'door'};
  } else {
   if(sealOpener(i, j, 3, e) || sealOpener(i, j+1, 2, e))
    e = {axis, L:j+1, along:i, kind:'door'};
  }
 }
 if(edgeCache.size > 60000) edgeCache.clear();
 edgeCache.set(key, e);
 return e;
}
/* role: which edge of cell (ci,cj) we are - 0 W, 1 E, 2 N, 3 S.
   true if this cell is sealed AND this edge is its hashed opener */
function sealOpener(ci, cj, role, self){
 const blk = w => w && (w.kind==='solid' || w.kind==='half');
 const W = role===0 ? self : edgeRaw(ci-1, cj, 0);   if(!blk(W)) return false;
 const E = role===1 ? self : edgeRaw(ci, cj, 0);     if(!blk(E)) return false;
 const N = role===2 ? self : edgeRaw(ci, cj-1, 1);   if(!blk(N)) return false;
 const S = role===3 ? self : edgeRaw(ci, cj, 1);     if(!blk(S)) return false;
 return Math.floor(h2i(ci*7+1, cj*13+3, (SEED^0x5EA1)|0)*4) === role;
}

/* v12: pillar forests are GONE (the regular 8m colonnade grids read
   as open cathedral halls). what remains: room-style-1 pillar
   rooms, and very sparse 3.5% scattered posts outside rooms -
   junction furniture, not architecture. */
function pillarAt(pi, pj){
 /* rooms decide their own pillars; no pillar on a room vertex */
 for(const [ci,cj] of [[pi-1,pj-1],[pi,pj-1],[pi-1,pj],[pi,pj]]){
  const R = roomAt(ci, cj);
  if(R){
   if(pi>R.x0 && pi<R.x0+R.w && pj>R.z0 && pj<R.z0+R.h)
    return R.st===1 && (pi&1)===0 && (pj&1)===0;      // style 1: regular pillar hall
   return false;
  }
 }
 const x=pi*CELL, z=pj*CELL;
 if((x-2)*(x-2)+(z-2)*(z-2) < 81) return false;       // spawn clearing
 if(edge(pi-1,pj-1,0)||edge(pi-1,pj,0)||edge(pi-1,pj-1,1)||edge(pi,pj-1,1)) return false;
 return h2i(pi, pj, (SEED^0x9E37)|0) < 0.035;         // sparse scattered posts
}
/* true if an L-corner post seals grid corner (vi,vj) - shared by
   the chunk builder and diagonal-wall placement */
function cornerPostAt(vi, vj){
 const S0=edge(vi-1,vj-1,0), N0=edge(vi-1,vj,0);
 const W1=edge(vi-1,vj-1,1), E1=edge(vi,vj-1,1);
 return ((S0?1:0)+(N0?1:0))===1 && ((W1?1:0)+(E1?1:0))===1;
}

/* ================================================================
   v7 DIAGONAL WALLS. 45deg walls running corner-to-corner through
   a single cell (fully inside one chunk - zero cross-chunk
   seams): a full-height rotated box + axis-aligned END POSTS that
   seal whatever junction each corner has, running baseboards, an
   oriented-box collider, floor contact AO, and they BLOCK light
   line-of-sight. placement is paranoid: mid-density rooms only,
   never sealing a cell completely, never at pillar / corner-post
   corners, never near spawn.
   ================================================================ */
const diagCache = new Map();
function diagAt(i, j){
 const key = i+','+j;
 const hit = diagCache.get(key);
 if(hit!==undefined) return hit;
 const r = diagRaw(i, j);
 if(diagCache.size > 6000) diagCache.clear();
 diagCache.set(key, r);
 return r;
}
function diagRaw(i, j){
 /* v10 OCTAGON rooms: the 4 corner cells get a FORCED chamfer wall
    (diagonal connecting perimeter to perimeter) - the sealed triangle
    behind it is dead space, like real chamfered halls */
 const R = roomAt(i, j);
 if(R){
  if(R.st!==5) return 0;
  const corners = [[R.x0,R.z0,2],[R.x0+R.w-1,R.z0,1],[R.x0+R.w-1,R.z0+R.h-1,2],[R.x0,R.z0+R.h-1,1]];
  for(const [ci,cj,d] of corners)
   if(ci===i && cj===j) return d;
  return 0;
 }
 if(crawlAt(i, j)) return 0;                     // v10: never pierce a dropped ceiling
 const di = density(i+0.5, j+0.5);
 if(di < 0.30 || di > 0.68) return 0;
 if(inCorrX(i,j) || inCorrZ(i,j)) return 0;      // v9: never block a corridor
 const r = h2i(i*31+7, j*37+3, (SEED^0xD1A6)|0);
 if(r > 0.055) return 0;   // v11: rarer - diagonals are garnish, not a district
 const x0=i*CELL, z0=j*CELL;                     // spawn clearing stays open
 if(Math.min((x0-2)*(x0-2)+(z0-2)*(z0-2), (x0+CELL-2)*(x0+CELL-2)+(z0-2)*(z0-2),
             (x0-2)*(x0-2)+(z0+CELL-2)*(z0+CELL-2),
             (x0+CELL-2)*(x0+CELL-2)+(z0+CELL-2)*(z0+CELL-2)) < 81) return 0;
 const eW=edge(i-1,j,0), eE=edge(i,j,0), eN=edge(i,j-1,1), eS=edge(i,j,1);
 const openable=(e)=> !e || e.kind==='door' || e.kind==='wide' || e.kind==='arch';
 if(!(openable(eW)||openable(eE)||openable(eN)||openable(eS))) return 0;  // no sealed tombs
 /* v8: arch footprints (flanks + jambs) can be 3m+ wide - never
    let a diagonal wall share a cell with one */
 if(eW && eW.kind==='arch') return 0;
 if(eE && eE.kind==='arch') return 0;
 if(eN && eN.kind==='arch') return 0;
 if(eS && eS.kind==='arch') return 0;
 const d = r < 0.0425 ? 1 : 2;   // 1 = '/' (i,j)->(i+1,j+1);  2 = '\\'
 const ends = d===1 ? [[i,j],[i+1,j+1]] : [[i+1,j],[i,j+1]];
 for(const [ci,cj] of ends){
  if(pillarAt(ci,cj)) return 0;
  if(cornerPostAt(ci,cj)) return 0;
 }
 return d;
}
/* v8: the 2D line-of-sight gate is gone - pool lights carry real
   cube shadow maps, which occlude per-surface instead of guessing
   occlusion from the player's viewpoint (that global dimming was
   the "weird lighting"). */

/* v9: THE CANON CEILING - a regular 8m lattice of flush troffers,
   all axis-aligned (the long axis follows a corridor when inside
   one). v12: ALL LIGHTS ON - no blackout districts, no flicker,
   no dying tubes, no off panels: the glowing grid stretches
   unbroken to the fog, exactly like the original image, and
   every fixture bakes its light into the chunk (buildBake). */
function cellFixture(i, j){
 if((i&1)!==(j&1)) return null;                   // brick lattice - one per ~5.7m diagonal
 if(crawlAt(i, j)) return null;                   // crawl spaces have no fixtures
 let x=(i+0.5)*CELL, z=(j+0.5)*CELL;
 const rot = (inCorrX(i,j) && !inCorrZ(i,j)) ? Math.PI/2 : 0;   // follow the corridor
 /* never hug a wall - nudge to >=1.02m clearance from any
    bounding wall plane, and off any diagonal wall line */
 {
  const CLR = 1.02;
  const eW=edge(i-1,j,0), eE=edge(i,j,0), eN=edge(i,j-1,1), eS=edge(i,j,1);
  const solidE=(e)=> e && e.kind!=='half';
  if(solidE(eW)) x = Math.max(x, i*CELL+CLR);
  if(solidE(eE)) x = Math.min(x, (i+1)*CELL-CLR);
  if(solidE(eN)) z = Math.max(z, j*CELL+CLR);
  if(solidE(eS)) z = Math.min(z, (j+1)*CELL-CLR);
  const d = diagAt(i,j);
  if(d){
   const ccx=(i+0.5)*CELL, ccz=(j+0.5)*CELL;
   const off = d===1 ? (x-ccx)-(z-ccz) : (x-ccx)+(z-ccz);
   const dd = Math.abs(off)*Math.SQRT1_2;
   if(dd < 1.05){
    const sgn = off>=0 ? 1 : -1, need = 1.05-dd;
    x += sgn*Math.SQRT1_2*need;
    z += (d===1 ? -sgn : sgn)*Math.SQRT1_2*need;
   }
  }
 }
 const warm = (h2i(i*47+9, j*53+2, (SEED^0x0F7E)|0)-0.5)*0.18;   // color temp: warm<->cool
 /* v12: every fixture is a steady ON light - only the 100hz mains
    wobble remains (see fixBright) */
 return {x, z, rot, warm, mode:'steady', phase:h2i(i*3+7, j*9+4, (SEED^0x0F6C)|0)*53.7};
}

/* ---------------- global instancers for scattered details ---------------- */
function makeInstancer(geo, mat, cap){
 const m = new THREE.InstancedMesh(geo, mat, cap);
 m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
 m.frustumCulled = false;
 m.count = 0;
 scene.add(m);
 return m;
}
const iOutletPlate = makeInstancer(geOutletPlate, matOutletPlate, 400);
const iOutletDev   = makeInstancer(geOutletDev,   matOutletDev,   400);
const iPeel   = makeInstancer(gePeel,   matPeel,   110);
const iPlenum = makeInstancer(gePlenum, matPlenum, 220);
const _IM = new THREE.Matrix4(), _IQ = new THREE.Quaternion(),
      _IV = new THREE.Vector3(), _IS = new THREE.Vector3(1,1,1);
function refreshInstancers(){
 let n=0;
 for(const ch of chunks.values()) for(const o of ch.outlets){
  if(n>=400) break;
  EU.set(0, o.rot, 0, 'YXZ'); _IQ.setFromEuler(EU);
  _IM.compose(_IV.set(o.x, o.y, o.z), _IQ, _IS);
  iOutletPlate.setMatrixAt(n, _IM);
  iOutletDev.setMatrixAt(n, _IM);
  n++;
 }
 iOutletPlate.count = n; iOutletPlate.instanceMatrix.needsUpdate = true;
 iOutletDev.count = n;   iOutletDev.instanceMatrix.needsUpdate = true;
 n=0;
 for(const ch of chunks.values()) for(const o of ch.peels){
  if(n>=110) break;
  EU.set(0, o.rot, 0, 'YXZ'); _IQ.setFromEuler(EU);
  _IM.compose(_IV.set(o.x, o.y, o.z), _IQ, _IS);
  iPeel.setMatrixAt(n++, _IM);
 }
 iPeel.count = n; iPeel.instanceMatrix.needsUpdate = true;
 n=0;
 for(const ch of chunks.values()) for(const o of ch.plenums){
  if(n>=220) break;
  _IQ.identity();
  _IM.compose(_IV.set(o.x, H-0.016, o.z), _IQ, _IS);
  iPlenum.setMatrixAt(n++, _IM);
 }
 iPlenum.count = n; iPlenum.instanceMatrix.needsUpdate = true;
}

/* ---------------- geometry helpers ---------------- */
/* bake UVs straight from WORLD coordinates so textures run
   continuously across every wall run, post, pillar and DIAGONAL
   face (45deg faces map u to world z, so the wallpaper stripes
   stay vertical and corner-continuous). wallpaper: u =
   world-meters / 2.56 (the tiling repeat), v = y/H so the full
   3.02m stain gradient maps wall height. carpet: 4m repeat. */
function bakeUV(g, mode){
 const p=g.attributes.position, n=g.attributes.normal, uv=g.attributes.uv;
 for(let k=0;k<p.count;k++){
  const nx=n.getX(k), ny=n.getY(k);
  const x=p.getX(k), y=p.getY(k), z=p.getZ(k);
  let u,v;
  if(mode==='wall'){
   if(Math.abs(ny)>0.5){ u=x/2.56; v=z/2.56; }
   else if(Math.abs(nx)>0.5){ u=z/2.56; v=y/H; }
   else { u=x/2.56; v=y/H; }
  } else if(mode==='trim'){
   if(Math.abs(ny)>0.5){ u=x/0.75; v=z/0.14; }
   else if(Math.abs(nx)>0.5){ u=z/0.75; v=y/0.14; }
   else { u=x/0.75; v=y/0.14; }
  } else if(mode==='ceil'){                       // v10 soffits: tile grid on every face
   if(Math.abs(ny)>0.5){ u=x/2.46; v=z/2.46; }
   else if(Math.abs(nx)>0.5){ u=z/2.46; v=0.5+y*0.2; }
   else { u=x/2.46; v=0.5+y*0.2; }
  } else { u=x/4; v=z/4; }
  uv.setXY(k,u,v);
 }
}

/* wall vertex AO: darker near floor (grime+contact) and slightly
   near the ceiling line, plus a subtle per-box tone jitter so the
   "inconsistency" of Level 0 reads. trims get a light toe shadow.
   v12: when a bake context is passed, the BAKED fixture light
   (with per-fixture warm/cool tint) is multiplied in per channel:
   floor field for vertical faces (graded by height, bright near
   the top like a real troffer wash), ceiling halo for up-faces. */
function vertColors(g, mode, jitter, bake){
 const p=g.attributes.position, n=g.attributes.normal;
 const col=new Float32Array(p.count*3);
 const SEED2 = (SEED^0x5159)|0;
 /* zone tint sampled ONCE per geometry (a macro effect - all verts
    of one wall piece sit within ~2m of each other) */
 let zone=1;
 if(mode==='wall'){
  const di = density(p.getX(0)/CELL, p.getZ(0)/CELL);
  zone = di<0.26 ? 1.04 : di>0.62 ? 0.96 : 1.0;
 }
 for(let k=0;k<p.count;k++){
  const x=p.getX(k), y=p.getY(k), z=p.getZ(k);
  let c=1;
  if(mode==='wall'){
   c = (0.875 + 0.125*Math.min(y/0.65, 1)) * jitter * zone;
   if(y > H-0.5) c *= 0.89 + 0.11*(H-y)/0.5;
   c *= 0.90 + 0.10*vnoise(x*0.14, (z+y*0.4)*0.14, SEED2, 6);
  } else {
   c = (0.93 + 0.07*Math.min(y/0.08, 1)) * jitter;
  }
  if(bake){
   const ny=n.getY(k);
   let L;
   if(ny > 0.5)         L = bake.ceil(x, z);
   else if(ny < -0.5){  const f = bake.floor(x, z); L=[f[0]*0.55, f[1]*0.55, f[2]*0.55]; }
   else                 L = bake.wall(x, y, z, n.getX(k), n.getZ(k));
   const A = mode==='ceil' ? 0.56 : 0.47;
   col[k*3]  = c*(A + L[0]);
   col[k*3+1]= c*(A + L[1]);
   col[k*3+2]= c*(A + L[2]);
  } else {
   col[k*3]=c; col[k*3+1]=c; col[k*3+2]=c;
  }
 }
 g.setAttribute('color', new THREE.BufferAttribute(col,3));
}
function pushBox(list, x0,y0,z0, x1,y1,z1, mode, bake){
 if(x1-x0<=0.002||y1-y0<=0.002||z1-z0<=0.002) return;
 /* v12: boxes are SEGMENTED along their long axis (walls 2.2m,
    trims 4m, soffits 2m) as ONE geometry - the baked light can
    vary along a run while the object count stays low. world-space
    UVs make the seams invisible. */
 const dx=x1-x0, dz=z1-z0, dy=y1-y0;
 const maxSeg = mode==='wall' ? 2.2 : mode==='trim' ? 4.0 : mode==='ceil' ? 2.0 : 4.0;
 const n = Math.max(1, Math.ceil(Math.max(dx,dz)/maxSeg));
 let g;
 if(n>1 && dx>=dz)      g = new THREE.BoxGeometry(dx, dy, dz, n, 1, 1);
 else if(n>1)           g = new THREE.BoxGeometry(dx, dy, dz, 1, 1, n);
 else                   g = new THREE.BoxGeometry(dx, dy, dz);
 g.translate((x0+x1)*0.5, (y0+y1)*0.5, (z0+z1)*0.5);
 bakeUV(g, mode);
 const jit = mode==='wall'
  ? 0.965 + 0.035*h2i(Math.round((x0+x1)*50), Math.round((z0+z1)*50), (SEED^0x717)|0)
  : 1;
 vertColors(g, mode, jit, bake);
 list.push(g);
}
function mergedMesh(geos, mat){
 if(!geos.length) return null;
 const g = mergeGeometries(geos, false);
 for(const x of geos) x.dispose();
 return new THREE.Mesh(g, mat);
}

/* min effective distance from (x,z) to any wall plane bounding the
   containing cell - powers the floor/ceiling contact-AO. openings
   occlude less (door/wide/arch push their distance out). */
function wallAO(x, z){
 const i=Math.floor(x/CELL), j=Math.floor(z/CELL);
 let md=9;
 const eW=edge(i-1,j,0), eE=edge(i,j,0), eN=edge(i,j-1,1), eS=edge(i,j,1);
 if(eW) md=Math.min(md, Math.abs(x-i*CELL)      + aoPen(eW));
 if(eE) md=Math.min(md, Math.abs((i+1)*CELL-x)  + aoPen(eE));
 if(eN) md=Math.min(md, Math.abs(z-j*CELL)      + aoPen(eN));
 if(eS) md=Math.min(md, Math.abs((j+1)*CELL-z)  + aoPen(eS));
 const d = diagAt(i,j);                     // v7: diagonals ground the floor too
 if(d){
  const dx=x-(i+0.5)*CELL, dz=z-(j+0.5)*CELL;
  md = Math.min(md, (d===1 ? Math.abs(dx-dz) : Math.abs(dx+dz))*Math.SQRT1_2);
 }
 return md;
}
function aoPen(e){
 if(e.kind==='door') return 1.6;
 if(e.kind==='wide'||e.kind==='arch') return 1.9;
 if(e.kind==='half') return 0.9;
 return 0;
}

/* is there a perpendicular wall on boundary line B crossing our
   line L? (used to bury run ends into crossing walls) */
function perpAt(axis, L, B){
 return !!( edge(axis===0 ? L-1 : B-1, axis===0 ? B-1 : L-1, 1-axis)
         || edge(axis===0 ? L   : B-1, axis===0 ? B-1 : L  , 1-axis) );
}

/* ================================================================
   v12 BAKED LIGHT. the dynamic spotlight pool is GONE - its
   shadow maps bled light under walls and only the nearest 8
   fixtures ever illuminated anything ("light doesn't come from
   the lights"). instead every chunk BAKES the light of ALL its
   fixtures (chunk + 8m window) into the vertex colors of every
   surface it builds, with true 2D line-of-sight through a wall
   bitmap: carpet pools stop AT walls and pour through doorways,
   walls sweep bright near fixtures (graded top-to-bright), and
   the ceiling carries a tight warm spill halo around each
   troffer. everything is a pure function of SEED, so chunk
   borders match exactly. zero runtime light cost. half walls
   don't block (light passes over them); openings don't block
   (light spills through them); crawl-room soffits DO block
   (the dropped ceiling shadows the pocket).
   ================================================================ */
const BK_PAD = 8, BK_RES = 0.5, FN = 45;   // bitmap: chunk+8m at 0.5m; fields: 45x45 over the chunk
function buildBake(ci, cj){
 const N = Math.round((CS + 2*BK_PAD)/BK_RES);
 const ox = ci*CS - BK_PAD, oz = cj*CS - BK_PAD;
 /* ---- the wall bitmap (solid full-height walls + diagonals +
    crawl soffits, conservatively rasterized) ---- */
 const solid = new Uint8Array(N*N);
 const i0 = Math.floor((ox+0.01)/CELL), j0 = Math.floor((oz+0.01)/CELL);
 const nC = Math.ceil((CS + 2*BK_PAD)/CELL) + 1;
 const mark = (x0, z0, x1, z1)=>{
  const a0=Math.max(0, Math.floor((x0-ox)/BK_RES)), a1=Math.min(N-1, Math.floor((x1-ox)/BK_RES));
  const b0=Math.max(0, Math.floor((z0-oz)/BK_RES)), b1=Math.min(N-1, Math.floor((z1-oz)/BK_RES));
  for(let a=a0;a<=a1;a++)for(let b=b0;b<=b1;b++) solid[a*N+b]=1;
 };
 for(let a=0;a<nC;a++)for(let b=0;b<nC;b++){
  const i=i0+a, j=j0+b;
  const s = e => e && e.kind==='solid';
  const eE=edgeRaw(i,j,0);   if(s(eE)) mark((i+1)*CELL-WT, j*CELL, (i+1)*CELL+WT, (j+1)*CELL);
  const eW=edgeRaw(i-1,j,0); if(s(eW)) mark(i*CELL-WT, j*CELL, i*CELL+WT, (j+1)*CELL);
  const eS=edgeRaw(i,j,1);   if(s(eS)) mark(i*CELL, (j+1)*CELL-WT, (i+1)*CELL, (j+1)*CELL+WT);
  const eN=edgeRaw(i,j-1,1); if(s(eN)) mark(i*CELL, j*CELL-WT, (i+1)*CELL, j*CELL+WT);
  const R = roomAt(i,j);
  if(R && R.st===4 && !(R.eIn && i===R.eIn[0] && j===R.eIn[1]))
   mark(i*CELL, j*CELL, (i+1)*CELL, (j+1)*CELL);      // crawl soffits block light
  const d = diagAt(i,j);
  if(d){
   const x0=i*CELL, z0=j*CELL;
   for(let t=0;t<=10;t++){
    const u=t/10;
    if(d===1) mark(x0+u*CELL-0.26, z0+u*CELL-0.26, x0+u*CELL+0.26, z0+u*CELL+0.26);
    else      mark(x0+CELL-u*CELL-0.26, z0+u*CELL-0.26, x0+CELL-u*CELL+0.26, z0+u*CELL+0.26);
   }
  }
 }
 /* ---- every fixture on the (all-on) lattice inside the window ---- */
 const fix=[];
 for(let a=0;a<nC;a++)for(let b=0;b<nC;b++){
  const f = cellFixture(i0+a, j0+b);
  if(f) fix.push(f);
 }
 /* ---- 2D line-of-sight through the bitmap (0.26m steps: a
    rasterized 0.5m wall band can never be tunneled) ---- */
 const los = (x0, z0, x1, z1)=>{
  const dx=x1-x0, dz=z1-z0;
  const dist = Math.sqrt(dx*dx + dz*dz);
  if(dist < 0.4) return true;
  const n = Math.ceil(dist/0.26);
  let x=x0, z=z0;
  for(let k=1;k<n;k++){
   x += dx/n; z += dz/n;
   const a=Math.floor((x-ox)/BK_RES), b=Math.floor((z-oz)/BK_RES);
   if(a<0||b<0||a>=N||b>=N) return false;
   if(solid[a*N+b]) return false;
  }
  return true;
 };
 /* ---- the two fields, on the exact 45x45 grid of the floor and
    ceiling planes: floor pools (E ~ 0.88 / (1+(r/3.3)^2)^1.6) and
    tight ceiling halos (E ~ 0.30 / (1+(r/1.26)^2)^1.5), each
    carried through LOS with the fixture's warm/cool tint ---- */
 const ff = new Float32Array(FN*FN*3);
 const cf = new Float32Array(FN*FN*3);
 const fx0=ci*CS, fz0=cj*CS;
 for(let a=0;a<FN;a++)for(let b=0;b<FN;b++){
  const x = fx0 + (a/(FN-1))*CS, z = fz0 + (b/(FN-1))*CS;
  let fr=0, fg=0, fb=0, cr=0, cg=0, cb=0;
  for(const f of fix){
   const dx=x-f.x, dz=z-f.z, r2=dx*dx+dz*dz;
   if(r2 > 52) continue;                              // 7.2m cutoff
   if(!los(x, z, f.x, f.z)) continue;                 // light stops AT walls
   const w1=1+f.warm*0.28, w2=0.955+f.warm*0.02, w3=0.90-f.warm*0.20;
   const e = 0.88/Math.pow(1 + r2/10.9, 1.6);         // pool falloff
   fr += e*w1; fg += e*w2; fb += e*w3;
   if(r2 < 7){                                        // ceiling halo cutoff ~2.65m
    const ec = 0.30/Math.pow(1 + r2/1.59, 1.5);
    cr += ec*w1; cg += ec*w2; cb += ec*w3;
   }
  }
  const k3=(a*FN+b)*3;
  ff[k3]=fr; ff[k3+1]=fg; ff[k3+2]=fb;
  cf[k3]=cr; cf[k3+1]=cg; cf[k3+2]=cb;
 }
 const _bo=[0,0,0];                    // scratch output (callers read it immediately)
 const bil = (arr, x, z)=>{
  let u=(x-fx0)/CS*(FN-1), v=(z-fz0)/CS*(FN-1);
  u=clamp(u, 0, FN-1.001); v=clamp(v, 0, FN-1.001);
  const a0=Math.floor(u), b0=Math.floor(v);
  const tu=u-a0, tv=v-b0;
  const a1=Math.min(a0+1, FN-1), b1=Math.min(b0+1, FN-1);
  const k00=(a0*FN+b0)*3, k10=(a0*FN+b1)*3, k01=(a1*FN+b0)*3, k11=(a1*FN+b1)*3;
  const w00=(1-tu)*(1-tv), w10=(1-tu)*tv, w01=tu*(1-tv), w11=tu*tv;
  _bo[0]=arr[k00]*w00 + arr[k10]*w10 + arr[k01]*w01 + arr[k11]*w11;
  _bo[1]=arr[k00+1]*w00 + arr[k10+1]*w10 + arr[k01+1]*w01 + arr[k11+1]*w11;
  _bo[2]=arr[k00+2]*w00 + arr[k10+2]*w10 + arr[k01+2]*w01 + arr[k11+2]*w11;
  return _bo;
 };
 return {
  floor:(x, z)=> bil(ff, x, z),                       // carpet pool field
  ceil :(x, z)=> bil(cf, x, z),                       // ceiling halo field
  wall :(x, y, z, nx, nz)=>{                          // vertical faces: floor field
   bil(ff, x+nx*0.13, z+nz*0.13);                     // sampled 13cm off the face
   const t = clamp(y, 0, 2.95)/2.95;
   const e = (0.20 + 0.80*t)*1.15;                    // graded bright toward the troffers (top ~5x the base)
   _bo[0]*=e; _bo[1]*=e; _bo[2]*=e;
   return _bo;
  }
 };
}

/* one wall line -> merged RUN boxes + trim + colliders.

   v6 END TREATMENT - every run end is classified:
     BURY  - perpendicular wall crosses here: wall and trim extend
             INTO the crossing wall (end faces buried, no seam).
     BUTT  - the same line continues (next cell has a wall, incl.
             across chunk borders): wall boxes butt exactly and the
             BASEBOARDS butt exactly too (v5 left a 4mm gap at every
             chunk border / half-to-full transition). trim presence
             is now per-LINE so both sides of a border agree. half-
             wall caps get a small RETURN that wraps onto the full
             wall's faces like real millwork.
     WRAP  - open end with NO connection of any kind: the baseboard
             and half-wall cap now wrap around the corner with end-
             cap boards (flush with the trim faces, 1mm proud of the
             wall end) so trim never shows a raw unfinished edge.
     CASED - fractional end abutting a door: the jamb casing covers
             it (no wrap needed).
     Arch/wide flanks are open below the springer -> WRAP (new).
   trim tops: axis-1 runs 1.5mm lower (perp trims interpenetrate). */
function buildLine(axis, L, cells, wallGeos, trimGeos, colliders, specials, bake){
 const spans = [];
 for(const {c, e} of cells){
  const ac=(c+0.5)*CELL;
  if(e.kind==='solid'){
   spans.push({s:c, e:c+1, h:0});
  } else if(e.kind==='door'){
   spans.push({s:c, e:(ac-0.63)/CELL, h:0});      // 0.575 opening + 0.055 jamb
   spans.push({s:(ac+0.63)/CELL, e:c+1, h:0});
   specials.push({axis, L, c, kind:'door'});
  } else if(e.kind==='wide'){
   const hw = e.hw || 1.15;
   spans.push({s:c, e:(ac-hw)/CELL, h:0});
   spans.push({s:(ac+hw)/CELL, e:c+1, h:0});
   specials.push({axis, L, c, kind:'wide', hw});
  } else if(e.kind==='arch'){
   /* flank runs stop one jamb-shoulder short of the opening; the
      arch band + cased legs below cover that zone completely */
   const hw = e.hw, spring = e.spring, cw = 0.052;
   if(e.twin){
    spans.push({s:c, e:(ac-e.twin-hw-cw)/CELL, h:0});
    spans.push({s:(ac-e.twin+hw)/CELL, e:(ac+e.twin-hw)/CELL, h:0});
    spans.push({s:(ac+e.twin+hw+cw)/CELL, e:c+1, h:0});
    specials.push({axis, L, c, kind:'arch', hw, spring, cx:ac-e.twin});
    specials.push({axis, L, c, kind:'arch', hw, spring, cx:ac+e.twin});
   } else {
    spans.push({s:c, e:(ac-hw-cw)/CELL, h:0});
    spans.push({s:(ac+hw+cw)/CELL, e:c+1, h:0});
    specials.push({axis, L, c, kind:'arch', hw, spring});
   }
  } else {                                        // half wall
   spans.push({s:c, e:c+1, h:1});
  }
 }
 const runs=[];
 for(const sp of spans){
  const last = runs[runs.length-1];
  if(last && last.h===sp.h && Math.abs(last.e-sp.s)<1e-6) last.e = sp.e;
  else runs.push({s:sp.s, e:sp.e, h:sp.h});
 }
 const P = L*CELL;
 const isA1 = axis===1;
 const trimTop = isA1 ? 0.1135 : 0.115;           // keep trim tops off-coplanar
 const capTop  = isA1 ? 1.1135 : 1.115;
 /* trim presence is PER LINE (both chunks flanking a border compute
   the same hash) so baseboards butt seamlessly across chunks */
 const trimOK = h2i(L*3+axis, 7, (SEED^0x7217)|0) > 0.17;
 /* edge() for along-cell c on THIS line - pure, chunk-independent */
 const lineCell = (c)=> edge(axis===0 ? L-1 : c, axis===0 ? c : L-1, axis);

 const addBoxCross = (list, c0, c1, y0, y1, s0, s1, mode)=>{
  if(isA1) pushBox(list, s0,y0,c0, s1,y1,c1, mode, bake);
  else     pushBox(list, c0,y0,s0, c1,y1,s1, mode, bake);
 };
 const addCol = (c0, c1, s0, s1)=>{
  if(s1-s0 < 0.02) return;
  if(isA1) colliders.push({x0:s0, z0:c0, x1:s1, z1:c1, y0:0});
  else     colliders.push({x0:c0, z0:s0, x1:c1, z1:s1, y0:0});
 };

 for(const r of runs){
  const a0=r.s*CELL, a1=r.e*CELL;
  const iS = Math.abs(r.s-Math.round(r.s))<1e-6;
  const iE = Math.abs(r.e-Math.round(r.e))<1e-6;
  /* --- classify each end: 0 WRAP / 1 BUTT / 2 BURY / 3 CASED --- */
  let kindS, kindE;
  if(iS){
   const p = perpAt(axis, L, Math.round(r.s));
   kindS = p ? 2 : (lineCell(Math.round(r.s)-1) ? 1 : 0);
  } else {   // fractional: abuts an opening in this cell
   const eS = lineCell(Math.floor(r.s+1e-6));
   kindS = eS && (eS.kind==='door'||eS.kind==='arch') ? 3 : 0;
  }
  if(iE){
   const p = perpAt(axis, L, Math.round(r.e));
   kindE = p ? 2 : (lineCell(Math.round(r.e)) ? 1 : 0);
  } else {
   const eE = lineCell(Math.floor(r.e-1e-6));
   kindE = eE && (eE.kind==='door'||eE.kind==='arch') ? 3 : 0;
  }
  /* wall: extend ends into crossing walls (2mm shy of far face) */
  const w0 = kindS===2 ? a0-(WT-0.002) : a0;
  const w1 = kindE===2 ? a1+(WT-0.002) : a1;
  /* trim: BURY into perps, BUTT exactly on continuing lines, 2mm
   shy at open/cased ends (the wrap boards cover the rest) */
  const t0 = kindS===2 ? a0-(WT-0.004) : kindS===1 ? a0 : a0+0.002;
  const t1 = kindE===2 ? a1+(WT-0.004) : kindE===1 ? a1 : a1-0.002;

  if(r.h===0){
   addBoxCross(wallGeos, P-WT, P+WT, -0.02, H+0.02, w0, w1, 'wall');  // poke: never coplanar with floor/ceiling planes
   if(trimOK){
    addBoxCross(trimGeos, P-WT2, P+WT2, 0, 0.085, t0, t1, 'trim');
    addBoxCross(trimGeos, P-(WT2-0.004), P+(WT2-0.004), 0.085, trimTop, t0, t1, 'trim');
   }
  } else {   // half wall + cap
   addBoxCross(wallGeos, P-WT, P+WT, -0.02, 1.06, w0, w1, 'wall');
   addBoxCross(trimGeos, P-(WT+0.028), P+(WT+0.028), 1.06, capTop, t0, t1, 'trim');
   if(trimOK){
    addBoxCross(trimGeos, P-WT2, P+WT2, 0, 0.085, t0, t1, 'trim');
    addBoxCross(trimGeos, P-(WT2-0.004), P+(WT2-0.004), 0.085, trimTop, t0, t1, 'trim');
   }
   /* cap RETURN onto a continuing full wall's faces (real millwork
    wrap); inner faces buried 1mm so nothing is coplanar */
   if(kindS===1) for(const sgn of [1,-1])
    addBoxCross(trimGeos, sgn>0?P+WT-0.001:P-WT-0.028, sgn>0?P+WT+0.028:P-WT+0.001, 1.06, capTop, a0-0.030, a0, 'trim');
   if(kindE===1) for(const sgn of [1,-1])
    addBoxCross(trimGeos, sgn>0?P+WT-0.001:P-WT-0.028, sgn>0?P+WT+0.028:P-WT+0.001, 1.06, capTop, a1, a1+0.030, 'trim');
  }
  /* WRAP boards at open ends: a real corner board as deep as the
   trim's own proudness (3.3cm past the wall end) - the baseboard /
   cap visibly TURNS the corner like finished millwork instead of
   showing a raw recessed end. side faces butt flush against the
   running trim (2mm shy) so nothing is coplanar.
   (addBoxCross arg order: CROSS extents first, RUN extents last) */
  const wrapEnd = (a, dir)=>{        // dir -1 = start end, +1 = end
   const lo = dir<0 ? a-0.033 : a-0.002;
   const hi = dir<0 ? a+0.002 : a+0.033;
   if(trimOK){
    addBoxCross(trimGeos, P-WT2, P+WT2, 0, 0.085, lo, hi, 'trim');
    addBoxCross(trimGeos, P-(WT2-0.004), P+(WT2-0.004), 0.085, trimTop, lo, hi, 'trim');
   }
   if(r.h===1)
    addBoxCross(trimGeos, P-(WT+0.028), P+(WT+0.028), 1.06, capTop, lo, hi, 'trim');
  };
  if(kindS===0) wrapEnd(a0, -1);
  if(kindE===0) wrapEnd(a1, +1);
  addCol(P-WT, P+WT, a0, a1);
 }
}

/* door casing + headers / wide lintels / ARCH walls.
   door header spans 2mm INTO the flanking runs and sits 1mm
   narrower so its side faces never z-fight.
   v8 arch: ONE simple closed contour (outer rect + inner arc) -
   NO hole touching the shape boundary. the v5-v7 shape (rect
   minus a half-disc whose diameter lay ON the bottom edge)
   pinched to zero width at both springline corners; degenerate
   sliver triangles there were the "black line near the arch".
   the band carries jamb shoulders that bury into the flanking
   runs, sits 1mm narrower than them (no coplanar faces), gets
   polar UVs along the arc (no projection branch-switch seams on
   the soffit), and is finished with a curved trim architrave +
   straight jamb legs like a real cased opening. */
/* v12 PERF: arch bands + architraves are expensive ExtrudeGeometry
   + mergeVertices products, but the world only ever uses a handful
   of (hw, spring) shapes - so each shape is extruded ONCE, cached
   (seed-independent), and CLONED per placement. world-space UVs and
   the baked light are applied per clone, so lighting/placement
   stays exactly as individual as before. */
const archTplCache = new Map();
function archTemplate(hw, spring){
 const key = hw.toFixed(2)+'_'+spring.toFixed(2);
 let t = archTplCache.get(key);
 if(t) return t;
 const cw = 0.052;
 /* the band: outer rect from (hw+cw) wide down to the springline,
    inner boundary = the arch arc. watertight. */
 const sh = new THREE.Shape();
 sh.moveTo(hw, spring);
 sh.lineTo(hw+cw, spring);
 sh.lineTo(hw+cw, H+0.02);
 sh.lineTo(-hw-cw, H+0.02);
 sh.lineTo(-hw-cw, spring);
 sh.lineTo(-hw, spring);
 sh.absarc(0, spring, hw, Math.PI, 0, true);      // over the top, back to (hw, spring)
 sh.closePath();
 const g = mergeVertices(new THREE.ExtrudeGeometry(sh, {depth:2*(WT-0.001), bevelEnabled:false, curveSegments:14}));
 /* the cased arch's curved trim architrave (annulus sector, proud
    like door casing) */
 const sh2 = new THREE.Shape();
 sh2.moveTo(hw-0.002, spring);
 sh2.absarc(0, spring, hw-0.002, 0, Math.PI, false);
 sh2.lineTo(-(hw+cw), spring);
 sh2.absarc(0, spring, hw+cw, Math.PI, 0, true);
 sh2.closePath();
 const g2 = mergeVertices(new THREE.ExtrudeGeometry(sh2, {depth:2*(WT+0.032), bevelEnabled:false, curveSegments:14}));
 t = {g, g2};
 archTplCache.set(key, t);
 return t;
}

function buildSpecial(sp, wallGeos, trimGeos, colliders, bake){
 const P = sp.L*CELL;
 const c0 = sp.c*CELL, ac=c0+CELL*0.5;
 const isA1 = sp.axis===1;
 const addBoxCross = (list, cA0, cA1, y0, y1, s0, s1, mode)=>{
  if(isA1) pushBox(list, s0,y0,cA0, s1,y1,cA1, mode, bake);
  else     pushBox(list, cA0,y0,s0, cA1,y1,s1, mode, bake);
 };
 const addCol = (cA0, cA1, s0, s1)=>{
  if(s1-s0<0.02) return;
  if(isA1) colliders.push({x0:s0, z0:cA0, x1:s1, z1:cA1, y0:0});
  else     colliders.push({x0:cA0, z0:s0, x1:cA1, z1:s1, y0:0});
 };

 if(sp.kind==='door'){
  const hw=0.575, j=0.055;
  const A0=ac-hw-j, A1=ac+hw+j;
  addBoxCross(wallGeos, P-(WT-0.001), P+(WT-0.001), 2.06, H+0.02, A0-0.002, A1+0.002, 'wall');
  const jp=P-(WT+0.032), jq=P+(WT+0.032);        // casing proudness matches baseboard
  addBoxCross(trimGeos, jp, jq, 0, 2.055, A0, ac-hw, 'trim');       // jamb legs
  addBoxCross(trimGeos, jp, jq, 0, 2.055, ac+hw, A1, 'trim');
  addBoxCross(trimGeos, jp, jq, 2.052, 2.26, A0, A1, 'trim');       // head casing
  addCol(jp, jq, A0, ac-hw);
  addCol(jp, jq, ac+hw, A1);
 } else if(sp.kind==='arch'){
  const hw = sp.hw, spring = sp.spring;
  const acx = sp.cx!==undefined ? sp.cx : ac;
  const cw = 0.052;                                // jamb shoulder + casing width
  /* v12: clone the cached (hw, spring) template instead of
     re-extruding - the band geometry, then world UVs, polar soffit
     UVs and baked light are applied per instance as before */
  const tpl = archTemplate(hw, spring);
  const g = tpl.g.clone();                         // 1mm narrower than the flanking runs
  if(isA1){ g.translate(acx, 0, P-(WT-0.001)); }
  else    { g.rotateY(Math.PI/2); g.translate(P-(WT-0.001), 0, acx); }
  bakeUV(g, 'wall');
  /* curved soffit UVs: u follows ARC LENGTH, v follows the
     tunnel depth - continuous all the way around, where the
     straight world mapping would flip projection at the 45deg
     points and tear the pattern. caps keep world UVs so the
     wallpaper flows straight off the flanking runs. */
  {
   const pos=g.attributes.position, nor=g.attributes.normal, uv=g.attributes.uv;
   for(let k=0;k<pos.count;k++){
    const y=pos.getY(k);
    if(y < spring-0.001) continue;
    const rx = isA1 ? (pos.getX(k)-acx) : (acx-pos.getZ(k));
    const ry = y - spring;
    const rr = Math.sqrt(rx*rx + ry*ry);
    if(rr > hw+0.004) continue;                    // not on the curve surface
    const nxv=nor.getX(k), nyv=nor.getY(k);
    const rad = (nxv*rx + nyv*ry)/Math.max(rr,1e-6);
    if(rad > -0.5) continue;                       // inward-facing soffit only
    const ang = Math.atan2(Math.max(ry,0), rx);    // 0..PI around the arc
    const depth = isA1 ? pos.getZ(k) : pos.getX(k);
    uv.setXY(k, ang*hw/2.56 + 0.13, depth/2.56 + 0.41);
   }
  }
  const jit = 0.975 + 0.025*h2i(Math.round(acx*20), P, (SEED^0x719)|0);
  vertColors(g, 'wall', jit, bake);
  wallGeos.push(g);
  /* cased arch: curved trim architrave (annulus sector, proud
     like door casing) + straight jamb legs below the springline.
     the legs are the arch's collision boundary at every size. */
  const g2 = tpl.g2.clone();
  if(isA1){ g2.translate(acx, 0, P-(WT+0.032)); }
  else    { g2.rotateY(Math.PI/2); g2.translate(P-(WT+0.032), 0, acx); }
  bakeUV(g2, 'trim');
  vertColors(g2, 'trim', 0.97, bake);
  trimGeos.push(g2);
  /* legs tuck 2mm BEHIND the casing's proudness and rise 2cm
     UNDER it - a real millwork lap joint: no shadow gap at the
     springline, and no coplanar faces (different depth planes) */
  addBoxCross(trimGeos, P-(WT+0.030), P+(WT+0.030), 0, spring+0.02, acx-hw-cw, acx-hw+0.002, 'trim');
  addBoxCross(trimGeos, P-(WT+0.030), P+(WT+0.030), 0, spring+0.02, acx+hw-0.002, acx+hw+cw, 'trim');
  addCol(P-(WT+0.032), P+(WT+0.032), acx-hw-cw, acx-hw+0.002);
  addCol(P-(WT+0.032), P+(WT+0.032), acx+hw-0.002, acx+hw+cw);
 } else {
  const hw = sp.hw || 1.15;
  addBoxCross(wallGeos, P-(WT-0.001), P+(WT-0.001), 2.55, H+0.02, ac-hw-0.002, ac+hw+0.002, 'wall');
 }
}

/* ---------------- chunk build / dispose / stream ---------------- */
const UP = new THREE.Vector3(0,1,0);
const EU = new THREE.Euler();

let BUILD_MS=0, BUILD_N=0;                   // debug: per-chunk build cost
function buildChunk(ci, cj, key){
 const _bcT0 = performance.now();
 const group = new THREE.Group();
 const wallGeos=[], trimGeos=[], colliders=[], fixtures=[], specials=[];
 const outlets=[], peels=[], plenums=[];
 const i0=ci*CH, j0=cj*CH;
 /* v12: the baked light context for this chunk - wall bitmap, LOS
    and the floor/ceiling light fields of every fixture in the
    chunk + 8m window (pure functions of SEED, so borders match) */
 const bake = buildBake(ci, cj);

 for(let axis=0; axis<2; axis++){
  const L0 = axis===0 ? i0+1 : j0+1;
  const c0 = axis===0 ? j0 : i0;
  for(let L=L0; L<L0+CH; L++){
   const cells=[];
   for(let c=c0; c<c0+CH; c++){
    const e = edge(axis===0 ? L-1 : c, axis===0 ? c : L-1, axis);
    if(e) cells.push({c, e});
   }
   if(cells.length) buildLine(axis, L, cells, wallGeos, trimGeos, colliders, specials, bake);
  }
 }
 for(const sp of specials) buildSpecial(sp, wallGeos, trimGeos, colliders, bake);

 /* corner posts seal every L-corner (recessed 1.5mm so nothing is
    coplanar with the wall faces). post trim wraps the baseboard. */
 for(let vi=i0; vi<i0+CH; vi++)for(let vj=j0; vj<j0+CH; vj++){
  if(!cornerPostAt(vi, vj)) continue;
  const S0=edge(vi-1,vj-1,0), N0=edge(vi-1,vj,0);
  const W1=edge(vi-1,vj-1,1), E1=edge(vi,vj-1,1);
  const wA = S0||N0, wB = W1||E1;
  const postH = (wA.kind==='half' && wB.kind==='half') ? 1.06 : H;
  const x=vi*CELL, z=vj*CELL, s=POST_W/2, st=POST_T/2;
  pushBox(wallGeos, x-s, -0.02, z-s, x+s, postH+0.02, z+s, 'wall', bake);
  pushBox(trimGeos, x-st, 0, z-st, x+st, 0.1145, z+st, 'trim', bake);
  if(postH < H) pushBox(trimGeos, x-(WT+0.026), 1.06, z-(WT+0.026), x+(WT+0.026), 1.1125, z+(WT+0.026), 'trim', bake);
  colliders.push({x0:x-s, z0:z-s, x1:x+s, z1:z+s, y0:0});
 }

 /* ---- v7: DIAGONAL WALLS in this chunk ----
    corner-to-corner 45deg box + sealed end posts + running
    baseboards + oriented-box collider. 45deg faces bake u from
    world z so the wallpaper stripes stay vertical and continuous
    through the corners. */
 for(let a=0;a<CH;a++)for(let b=0;b<CH;b++){
  const i=i0+a, j=j0+b;
  const d = diagAt(i,j); if(!d) continue;
  const x0=i*CELL, z0=j*CELL, ccx=x0+CELL*0.5, ccz=z0+CELL*0.5;
  const len = CELL*Math.SQRT2, th = d===1 ? -Math.PI/4 : Math.PI/4;
  const jit = 0.965 + 0.035*h2i(i*13+5, j*17+9, (SEED^0x727)|0);
  /* v12: one SEGMENTED box (4 length segments) so the baked light
     grades along the diagonal, with segmented trims to match */
  const wg = new THREE.BoxGeometry(len, H+0.04, 2*WT, 4, 1, 1);
  wg.rotateY(th); wg.translate(ccx, H*0.5, ccz);
  bakeUV(wg, 'wall');
  vertColors(wg, 'wall', jit, bake);
  wallGeos.push(wg);
  const mkTrim=(y0, y1, ext)=>{
   const t = new THREE.BoxGeometry(len, y1-y0, ext*2, 4, 1, 1);
   t.rotateY(th); t.translate(ccx, (y0+y1)*0.5, ccz);
   bakeUV(t, 'trim'); vertColors(t, 'trim', 1, bake); trimGeos.push(t);
  };
  mkTrim(0, 0.085, WT2);
  mkTrim(0.085, 0.115, WT2-0.004);
  const ends = d===1 ? [[x0,z0],[x0+CELL,z0+CELL]] : [[x0+CELL,z0],[x0,z0+CELL]];
  for(const [px2,pz2] of ends){          // end posts seal + wrap the corners
   const s=POST_W/2, st=POST_T/2;
   pushBox(wallGeos, px2-s, -0.02, pz2-s, px2+s, H+0.02, pz2+s, 'wall', bake);
   pushBox(trimGeos, px2-st, 0, pz2-st, px2+st, 0.1145, pz2+st, 'trim', bake);
   colliders.push({x0:px2-s, z0:pz2-s, x1:px2+s, z1:pz2+s, y0:0});
  }
  colliders.push({diag:d, cx:ccx, cz:ccz, hl:len*0.5, hw:WT, y0:0});
 }

 /* ---- v11 CRAWL-ROOM BULKHEAD: the dropped 1.30m ceiling now
    spans the FULL room footprint cell-by-cell, each slab exactly one
    cell so it lands ON the perimeter wall centerlines (edges buried
    inside the walls - no floating inset gap, no exposed raw edge
    except the one clean bulkhead face at the entry cell, which is
    skipped so you step in upright and then duck under). the collider
    is y-gated in collide() so crouched players pass. tile-textured
    on all faces, casts shadow so the pocket under it is dark. ---- */
 const ceilGeos = [];
 for(let a=0;a<CH;a++)for(let b=0;b<CH;b++){
  const i=i0+a, j=j0+b;
  const R = roomAt(i,j);
  if(!R || R.st!==4) continue;
  if(R.eIn && i===R.eIn[0] && j===R.eIn[1]) continue;    // entry cell stays full height
  pushBox(ceilGeos, i*CELL, CRAWL_Y-0.05, j*CELL, (i+1)*CELL, H+0.02, (j+1)*CELL, 'ceil', bake);
  colliders.push({x0:i*CELL, z0:j*CELL, x1:(i+1)*CELL, z1:(j+1)*CELL, y0:CRAWL_Y});
 }

 for(let pi=i0+1; pi<=i0+CH; pi++)for(let pj=j0+1; pj<=j0+CH; pj++){
  if(!pillarAt(pi,pj)) continue;
  const x=pi*CELL, z=pj*CELL, s=0.23;
  pushBox(wallGeos, x-s,-0.02,z-s, x+s,H+0.02,z+s, 'wall', bake);
  pushBox(trimGeos, x-(s+0.032), 0, z-(s+0.032), x+(s+0.032), 0.085, z+(s+0.032), 'trim', bake);
  pushBox(trimGeos, x-(s+0.028), 0.085, z-(s+0.028), x+(s+0.028), 0.115, z+(s+0.028), 'trim', bake);
  colliders.push({x0:x-s, z0:z-s, x1:x+s, z1:z+s, y0:0});
 }

 for(let a=0;a<CH;a++)for(let b=0;b<CH;b++){
  const f = cellFixture(i0+a, j0+b);
  if(f) fixtures.push(f);
 }
 if(ci===0 && cj===0 && !fixtures.some(f=>(f.x-2)*(f.x-2)+(f.z-2)*(f.z-2)<36)){
  fixtures.unshift({x:2, z:2, rot:0, warm:0, mode:'steady', phase:0});
 }

 /* scattered canon details: missing ceiling tiles (dark plenum),
    electrical outlets on walls, rare peeled-wallpaper omens */
 for(let a=0;a<CH;a++)for(let b=0;b<CH;b++){
  const i=i0+a, j=j0+b, cx=(i+0.5)*CELL, cz=(j+0.5)*CELL;
  if(!diagAt(i,j) && !crawlAt(i,j) && h2i(i*3+1, j*7+2, (SEED^0x6155)|0) < 0.050){
   const tx = Math.round((cx-0.3075)/GRID)*GRID+0.3075;
   const tz = Math.round((cz-0.3075)/GRID)*GRID+0.3075;
   if(!fixtures.some(f=>Math.abs(f.x-tx)<0.8 && Math.abs(f.z-tz)<0.8))
    plenums.push({x:tx, z:tz});
  }
  const os = h2i(i*11+3, j*13+7, (SEED^0x0757)|0);
  if(os < 0.26 && !crawlAt(i,j)){
   const pick = Math.floor(h2i(i*23+5, j*29+11, (SEED^0x0758)|0)*4);
   const e = pick===0 ? edge(i-1,j,0) : pick===1 ? edge(i,j,0)
           : pick===2 ? edge(i,j-1,1) : edge(i,j,1);
   if(e && (e.kind==='solid'||e.kind==='half'||e.kind==='arch')){
    const oh = h2i(i*31+7, j*37+3, (SEED^0x0759)|0);
    const off = (0.85 + oh*0.9) * (oh<0.5?-1:1);
    const y = 0.28 + oh*0.10;
    if(pick===0)      outlets.push({x:i*CELL+WT+0.0025,      z:cz+off, y, rot: Math.PI/2});
    else if(pick===1) outlets.push({x:(i+1)*CELL-WT-0.0025,  z:cz+off, y, rot:-Math.PI/2});
    else if(pick===2) outlets.push({x:cx+off, z:j*CELL+WT+0.0025,     y, rot: 0});
    else              outlets.push({x:cx+off, z:(j+1)*CELL-WT-0.0025, y, rot: Math.PI});
   }
  }
  if(h2i(i*17+9, j*19+5, (SEED^0x9C31)|0) < 0.014 && !crawlAt(i,j)){
   const pick = Math.floor(h2i(i*41+3, j*43+9, (SEED^0x9C32)|0)*4);
   const e = pick===0 ? edge(i-1,j,0) : pick===1 ? edge(i,j,0)
           : pick===2 ? edge(i,j-1,1) : edge(i,j,1);
   if(e && (e.kind==='solid'||e.kind==='half')){
    const oh = h2i(i*47+1, j*53+7, (SEED^0x9C33)|0);
    const off = (0.7 + oh*0.9) * (oh<0.5?-1:1);
    const y = 0.95 + oh*0.5;
    if(pick===0)      peels.push({x:i*CELL+WT+0.005,     z:cz+off, y, rot: Math.PI/2});
    else if(pick===1) peels.push({x:(i+1)*CELL-WT-0.005, z:cz+off, y, rot:-Math.PI/2});
    else if(pick===2) peels.push({x:cx+off, z:j*CELL+WT+0.005,     y, rot: 0});
    else              peels.push({x:cx+off, z:(j+1)*CELL-WT-0.005, y, rot: Math.PI});
   }
  }
 }

 const cx=(ci+0.5)*CS, cz=(cj+0.5)*CS;

 const wm = mergedMesh(wallGeos, matWall);
 if(wm) group.add(wm);
 const tm = mergedMesh(trimGeos, matTrim);
 if(tm) group.add(tm);

 /* floor + ceiling: v12 44-segment planes (0.727m grid = EXACTLY
    the bake field lattice) carrying the baked fixture pools +
    contact AO (walls darken the surface around them) + large-scale
    mottle so the "single continuous carpet" still breathes. */
 const fg = new THREE.PlaneGeometry(CS, CS, 44, 44);
 fg.rotateX(-Math.PI/2); fg.translate(cx, 0, cz); bakeUV(fg,'flat');
 {
  const fp=fg.attributes.position, fc=new Float32Array(fp.count*3);
  for(let k=0;k<fp.count;k++){
   const x=fp.getX(k), z=fp.getZ(k);
   let t=clamp(wallAO(x,z)/0.72, 0, 1); t=t*t*(3-2*t);
   const mot=0.88+0.12*vnoise(x*0.25, z*0.25, (SEED^0x33A1)|0, 9);
   const di = density(x/CELL, z/CELL);              // subtle zone tint
   const zone = di<0.26 ? 1.035 : di>0.62 ? 0.965 : 1.0;
   const R10 = roomAt(Math.floor(x/CELL), Math.floor(z/CELL));
   const rT = R10 ? (R10.st===4 ? 0.80 : 0.955) : 1;        // rooms read as their own floor
   const c=(0.70+0.30*t)*mot*zone*rT*(crawlAt(Math.floor(x/CELL), Math.floor(z/CELL)) ? 0.62 : 1);
   const L=bake.floor(x, z);                               // v12 baked pools (LOS-occluded)
   fc[k*3]  =c*(0.50+L[0])*(0.99+0.02*vnoise(x*0.09, z*0.11, (SEED^0x33C1)|0, 7));
   fc[k*3+1]=c*(0.50+L[1])*(0.995+0.015*vnoise(x*0.08, z*0.10, (SEED^0x33C2)|0, 7));
   fc[k*3+2]=c*(0.50+L[2])*(0.975+0.045*vnoise(x*0.10, z*0.12, (SEED^0x33C3)|0, 7));
  }
  fg.setAttribute('color', new THREE.BufferAttribute(fc,3));
 }
 const fm = new THREE.Mesh(fg, matCarpet);
 group.add(fm);

 const cg = new THREE.PlaneGeometry(CS, CS, 44, 44);
 cg.rotateX(Math.PI/2); cg.translate(cx, H, cz);
 {
  const uv=cg.attributes.uv, cp=cg.attributes.position;
  for(let k=0;k<cp.count;k++) uv.setXY(k, cp.getX(k)/2.46, cp.getZ(k)/2.46);
  const cc=new Float32Array(cp.count*3);
  for(let k=0;k<cp.count;k++){
   const x=cp.getX(k), z=cp.getZ(k);
   let t=clamp(wallAO(x,z)/0.5, 0, 1); t=t*t*(3-2*t);
   const mot=0.93+0.07*vnoise(x*0.25, z*0.25, (SEED^0x33B7)|0, 9);
   const di = density(x/CELL, z/CELL);
   const zone = di<0.26 ? 1.03 : di>0.62 ? 0.97 : 1.0;
   const R10 = roomAt(Math.floor(x/CELL), Math.floor(z/CELL));
   const rT = R10 ? (R10.st===4 ? 0.82 : 0.96) : 1;
   const c=(0.82+0.18*t)*mot*zone*rT;
   const L=bake.ceil(x, z);                               // v12 baked spill halos
   cc[k*3]  =c*(0.56+L[0])*(0.995+0.02*vnoise(x*0.10, z*0.09, (SEED^0x33D1)|0, 7));
   cc[k*3+1]=c*(0.56+L[1])*(0.995+0.015*vnoise(x*0.11, z*0.08, (SEED^0x33D2)|0, 7));
   cc[k*3+2]=c*(0.56+L[2])*(0.985+0.03*vnoise(x*0.09, z*0.10, (SEED^0x33D3)|0, 7));
  }
  cg.setAttribute('color', new THREE.BufferAttribute(cc,3));
 }
 const cm = new THREE.Mesh(cg, matCeil);
 group.add(cm);

 const sM = mergedMesh(ceilGeos, matCeil);
 if(sM) group.add(sM);

 
 let iPanel = null;
 if(fixtures.length){
  const iFrame = new THREE.InstancedMesh(geFrame, matFrame, fixtures.length);
  iPanel = new THREE.InstancedMesh(gePanel, matPanel, fixtures.length);
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(),
        V = new THREE.Vector3(), S1 = new THREE.Vector3(1,1,1), C = new THREE.Color();
  fixtures.forEach((f, idx)=>{
   EU.set(0, f.rot, 0, 'YXZ');
   Q.setFromEuler(EU);
   M.compose(V.set(f.x, H-0.001, f.z), Q, S1);      // frame+panel offsets are baked into geometry
   iFrame.setMatrixAt(idx, M);
   iPanel.setMatrixAt(idx, M);
   /* v12: ALL ON - every diffuser burns at full output with its
      warm/cool tint (blown through ACES + the VHS white knee) */
   C.setRGB(0.05+2.1*(1+f.warm*0.5), 0.05+1.98, 0.04+1.68*(1-f.warm*0.6));
   iPanel.setColorAt(idx, C);
  });
  iPanel.instanceColor.needsUpdate = true;
  iFrame.frustumCulled = false;
  iPanel.frustumCulled = false;
  group.add(iFrame, iPanel);
 }

 scene.add(group);
 chunks.set(key, {group, colliders, fixtures, outlets, peels, plenums, iPanel});
 refreshInstancers();
 BUILD_MS += performance.now()-_bcT0; BUILD_N++;
}

function disposeChunk(key){
 const ch = chunks.get(key); if(!ch) return;
 scene.remove(ch.group);
 ch.group.traverse(o=>{
  if(o.isInstancedMesh){ o.dispose(); return; }   // shares global geoms - don't dispose them
  if(o.isMesh) o.geometry.dispose();
 });
 chunks.delete(key);
 refreshInstancers();
}

let curCi=1e9, curCj=1e9;
const pending = [];
function ensureChunks(force){
 const ci = Math.floor(player.pos.x/CS), cj = Math.floor(player.pos.z/CS);
 if(ci!==curCi || cj!==curCj || force){
  curCi=ci; curCj=cj; pending.length=0;
  for(let a=-LOAD_R;a<=LOAD_R;a++)for(let b=-LOAD_R;b<=LOAD_R;b++){
   const key=(ci+a)+','+(cj+b);
   if(!chunks.has(key)) pending.push({ci:ci+a, cj:cj+b, key, d:a*a+b*b});
  }
  pending.sort((A,B)=>B.d-A.d);   // pop() takes nearest first
  for(const key of Array.from(chunks.keys())){
   const parts = key.split(',');
   if(Math.max(Math.abs(+parts[0]-ci), Math.abs(+parts[1]-cj)) > UNLOAD_R) disposeChunk(key);
  }
 }
 let n = force ? 9 : 1;   // sync-build a 3x3 around the player on force, else 1/frame
 while(n>0 && pending.length){
  const job = pending.pop();
  if(!chunks.has(job.key)){ buildChunk(job.ci, job.cj, job.key); n--; }
 }
}

/* ================================================================
   LIGHTING v12 - ALL BAKED, ALL ON. the 8-spotlight pool is gone
   (shadow-map bleed put light under walls, and only the nearest 8
   fixtures ever illuminated anything - "light doesn't come from
   the lights"). every fixture now contributes to the per-chunk
   baked vertex lightmap (see buildBake): carpet pools that stop
   at walls and pour through doorways, walls graded bright near
   fixtures, ceiling spill halos, warm/cool per-fixture tint. the
   only dynamic light left is a soft warm hemisphere that keeps
   shadowed pockets readable - the glowing troffer grid does the
   rest, unbroken into the fog.
   ================================================================ */
scene.add(new THREE.HemisphereLight(0xd8caa4, 0x8a7448, 0.95));   // the sole light carrier: vertex colors modulate it (bake = pools, A = ambient)

let T = 0, audioBuzzTarget = 0, audioHumTarget = 0.04, nearestLightD = 99;

/* candidate cache: nearest fixtures (ALL on now) - drives the dust
   mote brightness and the hum. rebuilt on chunk changes, cell
   crossings and every 0.4s. */
const lightCands = [];
let candTimer = 0, gateCi = 1e9, gateCj = 1e9;
function rebuildCands(){
 lightCands.length = 0;
 const px = player.pos.x, pz = player.pos.z;
 for(const ch of chunks.values()){
  for(const f of ch.fixtures){
   const d2 = (f.x-px)*(f.x-px) + (f.z-pz)*(f.z-pz);
   if(d2 < 256) lightCands.push({f, d2});            // 16m collection radius
  }
 }
 lightCands.sort((a,b)=>a.d2-b.d2);
 if(lightCands.length > 40) lightCands.length = 40;
}

function fixBright(f, t){
 /* all lights on: only the 100hz mains wobble remains */
 return 0.94 + 0.05*Math.sin(t*97 + f.phase);
}

function updateLights(dt){
 candTimer -= dt;
 const pci = Math.floor(player.pos.x/CELL), pcj = Math.floor(player.pos.z/CELL);
 if(candTimer<=0 || pci!==gateCi || pcj!==gateCj){
  candTimer = 0.4; gateCi = pci; gateCj = pcj;
  rebuildCands();
 }
 nearestLightD = lightCands.length ? Math.sqrt(lightCands[0].d2) : 99;
 /* canon: the hum-buzz permeates everything, louder near lights */
 audioHumTarget = nearestLightD < 21 ? 0.075*(1-nearestLightD/26)+0.012 : 0.002;
 audioBuzzTarget = nearestLightD < 9 ? 0.045*(1-nearestLightD/9) : 0;
}

 const tmpColor = new THREE.Color();
function updateFixturesNear(){
 for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
  const ch = chunks.get((curCi+a)+','+(curCj+b));
  if(!ch || !ch.iPanel) continue;
  for(let idx=0; idx<ch.fixtures.length; idx++){
   const f = ch.fixtures[idx];
   const bb = fixBright(f, T);
   tmpColor.setRGB(
    0.05+2.1*bb*(1+f.warm*0.5),
    0.05+1.98*bb,
    0.04+1.68*bb*(1-f.warm*0.6));
   ch.iPanel.setColorAt(idx, tmpColor);
  }
  ch.iPanel.instanceColor.needsUpdate = true;
 }
}

function updateWave(){
 /* v12: the darkness wave is deleted - ALL lights stay on */
}

/* ================================================================
   PLAYER - exponential-smoothed velocity (no snap), low-amplitude
   double-frequency bob with extra low-pass (no bounce), lean as a
   true circular head arc (roll + lateral offset about a pivot),
   sprint FOV kick, crouch, circle-vs-AABB collision.
   ================================================================ */
const player = {
 pos:new THREE.Vector3(2,0,2), vel:new THREE.Vector3(),
 yaw:0, pitch:0, prevYaw:0, yawRateS:0, roll:0, leanPitch:0,
 vFs:0, vSs:0, aFs:0, pVF:0, spdS:0,
 eye:1.62, crouchA:0, sprintA:0,
 bobPhase:0, bobEnv:0, bobY:0, bobLat:0, bobRoll:0, bobYaw:0, lastStep:-1
};
const STAND_TOP = 1.77, CROUCH_TOP = 1.19;   // head-top heights for y-aware collision
function headTop(){ return STAND_TOP - 0.58*player.crouchA; }
const keys = {};
let locked = false, elapsed = 0;

function collide(pos, r, vel){
 const top = headTop();
 const pci = Math.floor(pos.x/CS), pcj = Math.floor(pos.z/CS);
 for(let it=0; it<2; it++){
  for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
   const ch = chunks.get((pci+a)+','+(pcj+b));
   if(!ch) continue;
   for(const bx of ch.colliders){
    if(bx.y0 > top) continue;                     // v10: crouch-under zones
    if(bx.diag){                                   // v7 oriented-box diagonal wall
     const dx=pos.x-bx.cx, dz=pos.z-bx.cz;
     let u, v;
     if(bx.diag===1){ u=(dx+dz)*Math.SQRT1_2; v=(dx-dz)*Math.SQRT1_2; }
     else            { u=(dx-dz)*Math.SQRT1_2; v=(dx+dz)*Math.SQRT1_2; }
     const cu=clamp(u,-bx.hl,bx.hl), cv=clamp(v,-bx.hw,bx.hw);
     let du=u-cu, dv=v-cv;
     const d2=du*du+dv*dv;
     if(d2 < r*r){
      let d=Math.sqrt(d2);
      if(d>1e-6){ du/=d; dv/=d; } else { du=0; dv=v>=0?1:-1; d=0; }
      let wx, wz;                                  // world-space push direction
      if(bx.diag===1){ wx=(du+dv)*Math.SQRT1_2; wz=(du-dv)*Math.SQRT1_2; }
      else            { wx=(du+dv)*Math.SQRT1_2; wz=(dv-du)*Math.SQRT1_2; }
      const push=r-d;
      pos.x += wx*push; pos.z += wz*push;
      const vd = vel.x*wx + vel.z*wz;
      if(vd < 0){ vel.x -= wx*vd; vel.z -= wz*vd; }
     }
     continue;
    }
    const nx = clamp(pos.x, bx.x0, bx.x1);
    const nz = clamp(pos.z, bx.z0, bx.z1);
    const dx = pos.x-nx, dz = pos.z-nz;
    const d2 = dx*dx+dz*dz;
    if(d2 >= r*r) continue;
    if(d2 > 1e-8){
     const d = Math.sqrt(d2), ux=dx/d, uz=dz/d, push=r-d;
     pos.x += ux*push; pos.z += uz*push;
     const vd = vel.x*ux + vel.z*uz;
     if(vd < 0){ vel.x -= ux*vd; vel.z -= uz*vd; }
    } else {
     const L=pos.x-bx.x0, R=bx.x1-pos.x, Tt=pos.z-bx.z0, B=bx.z1-pos.z;
     const m = Math.min(L,R,Tt,B);
     if(m===L){ pos.x=bx.x0-r; vel.x=Math.min(vel.x,0); }
     else if(m===R){ pos.x=bx.x1+r; vel.x=Math.max(vel.x,0); }
     else if(m===Tt){ pos.z=bx.z0-r; vel.z=Math.min(vel.z,0); }
     else { pos.z=bx.z1+r; vel.z=Math.max(vel.z,0); }
    }
   }
  }
 }
}

function headroomClear(){
 const pos = player.pos, pci = Math.floor(pos.x/CS), pcj = Math.floor(pos.z/CS);
 for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
  const ch = chunks.get((pci+a)+','+(pcj+b));
  if(!ch) continue;
  for(const bx of ch.colliders){
   if(!bx.y0 || bx.y0 <= 0.05) continue;          // full-height: irrelevant here
   if(bx.y0 >= STAND_TOP) continue;
   const nx = clamp(pos.x, bx.x0, bx.x1), nz = clamp(pos.z, bx.z0, bx.z1);
   const dx = pos.x-nx, dz = pos.z-nz;
   if(dx*dx + dz*dz < 0.35*0.35) return false;
  }
 }
 return true;
}

function updatePlayer(dt){
 const F=(keys['KeyW']?1:0)-(keys['KeyS']?1:0);
 const S=(keys['KeyD']?1:0)-(keys['KeyA']?1:0);
 const crouchIn = !!(keys['Space']||keys['ControlLeft']||keys['ControlRight']);
 /* v10 REAL CROUCH: if there's no headroom (under a crawl-room
    bulkhead) you physically cannot stand back up */
 const crouch = crouchIn || (player.crouchA>0.5 && !headroomClear());
 const sprint = !!(keys['ShiftLeft']||keys['ShiftRight']) && !crouch;
 /* v10 REALISTIC GAIT: human walk ~1.4m/s, brisk game-walk 2.05,
    jog 3.6, cramped crouch-shuffle 1.05 (was 2.75/4.9/1.4 - way too
    fast; the rooms felt like a speedrun) */
 const sp = crouch ? 1.05 : (sprint && F>0 ? 3.6 : 2.05);
 let wx=0, wz=0;
 if(F||S){
  const sy=Math.sin(player.yaw), cy=Math.cos(player.yaw);
  wx = -sy*F + cy*S;
  wz = -cy*F - sy*S;
  const l = Math.hypot(wx,wz)||1;
  wx = wx/l*sp; wz = wz/l*sp;
 }
 player.vel.x = damp(player.vel.x, wx, 6.0, dt);   // heavier inertia
 player.vel.z = damp(player.vel.z, wz, 6.0, dt);
 player.pos.x += player.vel.x*dt;
 player.pos.z += player.vel.z*dt;
 collide(player.pos, 0.33, player.vel);
 const spd = Math.hypot(player.vel.x, player.vel.z);

 const yawRate = (player.yaw - player.prevYaw)/Math.max(dt,1e-4);
 player.prevYaw = player.yaw;
 player.yawRateS = damp(player.yawRateS, clamp(yawRate,-4,4), 10, dt);

 /* lean driven by SMOOTHED local-frame velocity + acceleration, so
    it eases in and out in every direction (front, back, strafe) and
    never snaps: vFs/vSs are damped, the pitch kick is low-passed. */
 const sy0=Math.sin(player.yaw), cy0=Math.cos(player.yaw);
 const vF = -sy0*player.vel.x - cy0*player.vel.z;   // local forward speed
 const vS =  cy0*player.vel.x - sy0*player.vel.z;   // local strafe speed
 player.vFs = damp(player.vFs, vF, 6, dt);
 player.vSs = damp(player.vSs, vS, 6, dt);
 const aF = dt>0 ? (vF - player.pVF)/dt : 0;
 player.pVF = vF;
 player.aFs = damp(player.aFs, clamp(aF, -12, 12), 3.5, dt);

 const rollT  = clamp(-(player.vSs*0.024 + player.yawRateS*0.028), -0.14, 0.14);
 /* v7: fwd/back lean much stronger (user: "forward and back lean
    needs to be more") - ~4.7deg at walk, 7.2deg at sprint; the
    head arc + dip scale with it via composeCamera */
 const pitchT = clamp(-(player.vFs*0.030 + player.aFs*0.0085), -0.125, 0.125);
 player.roll      = damp(player.roll,      rollT,  7,   dt);
 player.leanPitch = damp(player.leanPitch, pitchT, 7,   dt);

 /* v10: a real duck takes ~0.35s (rate 5.5, was 9), the eye drops
    58cm, and the head tips slightly forward like a person folding
    down */
 player.crouchA = damp(player.crouchA, crouch?1:0, 5.5, dt);
 player.eye = 1.62 - 0.58*player.crouchA;
 player.sprintA = damp(player.sprintA, (sprint&&F>0&&spd>2.6)?1:0, 4.5, dt);
 camera.fov = damp(camera.fov, 74 + 6*player.sprintA - 5*player.crouchA, 6, dt);

 const envT = spd>0.35 ? (crouch?0.55:1) : 0;
 player.bobEnv = damp(player.bobEnv, envT, 4, dt);
 /* v11 THE BOUNCE FIX. v9/v10 advanced bobPhase a full 2pi per STEP,
    so sin(2*phase) bounced the camera TWICE per footfall (4Hz at
    walk, 5.6Hz at jog) and the footstep counter double-timed at
    4/s - a trampoline. phase now advances pi per step: one vertical
    dip per footfall (~2Hz at walk), lateral sway alternating left/
    right per stride, footsteps exactly on cadence. the cadence is
    driven by a SMOOTHED speed so the rhythm never wobbles, and the
    amplitude is ~25% lower - a walk, not a bounce. */
 player.spdS = damp(player.spdS, spd, 3, dt);
 const stepRate = 1.00 + 0.47*player.spdS;
 player.bobPhase += stepRate*Math.PI*dt;
 const amp = (0.011 + 0.011*Math.min(1, player.spdS/3.6)) * (crouch?0.72:1);
 const ty = amp*Math.sin(2*player.bobPhase)*player.bobEnv;
 const tl = amp*0.55*Math.sin(player.bobPhase)*player.bobEnv;
 /* crouch-walk: low amplitude + a wider waddle roll (a person folded
    up really does sway) */
 const tr = (crouch?0.0095:0.006)*Math.sin(player.bobPhase)*player.bobEnv;
 const tyaw = 0.0022*Math.sin(player.bobPhase)*player.bobEnv;
 player.bobY    = damp(player.bobY,    ty, 16, dt);
 player.bobLat  = damp(player.bobLat,  tl, 16, dt);
 player.bobRoll = damp(player.bobRoll, tr, 16, dt);
 player.bobYaw  = damp(player.bobYaw,  tyaw, 14, dt);

 const stepIdx = Math.floor(player.bobPhase/Math.PI);
 if(stepIdx !== player.lastStep){
  player.lastStep = stepIdx;
  if(player.bobEnv>0.45 && player.spdS>0.6) sfxStep(Math.min(1, player.spdS/3.6), crouch);
 }

 composeCamera();
}

/* camera = eye + circular lean arcs in BOTH axes (roll for strafe,
   pitch for forward/back) about a 0.55m pivot - the head sweeps a
   real arc, dipping as it leans, in any direction of travel. */
function composeCamera(){
 const sy=Math.sin(player.yaw), cy=Math.cos(player.yaw);
 const rx=cy, rz=-sy;                   // right axis
 const fx=-sy, fz=-cy;                  // forward axis
 const PIV=0.55;
 const offR = -Math.sin(player.roll)*PIV;       // lateral lean arc
 const offF = -Math.sin(player.leanPitch)*PIV;   // fwd/back lean arc
 const arcY = (Math.cos(player.roll)-1)*PIV + (Math.cos(player.leanPitch)-1)*PIV;
 const breathe = 0.006*Math.sin(T*1.7);
 camera.position.set(
  player.pos.x + rx*(offR + player.bobLat) + fx*offF,
  player.eye + player.bobY + arcY + breathe,
  player.pos.z + rz*(offR + player.bobLat) + fz*offF
 );
 camera.rotation.set(
  player.pitch + player.leanPitch + 0.045*player.crouchA,   // v10: head tips down as you fold
  player.yaw + player.bobYaw,
  player.roll + player.bobRoll);
}
