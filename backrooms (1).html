/* ================================================================
   POST FX - VHS + CRT barrel distortion in one fullscreen pass.
   v8: the barrel curve now FILLS THE SCREEN - screen corners map
   exactly onto source corners (corner-normalized), so there is
   no black bezel and no out-of-frame sampling, ever. and every
   positional artifact is gone: no drift, no mistracking band, no
   head-switch tear, no dropout streaks, no glitch displacement -
   the image never moves or shakes. the tape character is purely
   static: luma bandwidth blur, color-under chroma smear + trail,
   scanlines, grain, slow chroma mottle, warm grade, vignette.
   v6 perf: HalfFloat (linear, zero banding in the blackout
   zones - 8-bit linear banded badly in dark falloff) but only
   2x MSAA = HALF of v5's RT bandwidth (which used 4x).
   ================================================================ */
const dbSize = new THREE.Vector2();
renderer.getDrawingBufferSize(dbSize);
const rt = new THREE.WebGLRenderTarget(dbSize.x, dbSize.y, {samples:4, type:THREE.HalfFloatType});  // v8: the 28-light array is gone - fragment budget for 4x again

const postMat = new THREE.ShaderMaterial({
 uniforms:{
  tDiffuse:{value:rt.texture},
  uTime:{value:0},
  uVHS:{value:1},
  uCurve:{value:1},
  uRes:{value:dbSize.clone()}
 },
 vertexShader:`
  varying vec2 vUv;
  void main(){
   vUv = uv;
   gl_Position = vec4(position.xy, 0.0, 1.0);
  }`,
 fragmentShader:`

  varying vec2 vUv;
  uniform sampler2D tDiffuse;
  uniform float uTime;
  uniform float uVHS;
  uniform float uCurve;
  uniform vec2 uRes;
  float vhsHash(vec2 p){
   p = fract(p*vec2(127.31, 311.7));
   p += dot(p, p+34.23);
   return fract(p.x*p.y*741.3);
  }
  void main(){
   /* CRT barrel that FILLS THE SCREEN (corner-normalized) */
   vec2 p = vUv - 0.5;
   float r2 = dot(p, p);
   float k = 0.20*uCurve;
   vec2 uv = p*(1.0 + k*r2)/(1.0 + k*0.5) + 0.5;
   /* ---- VHS v10 ----
      purely STATIC picture (nothing ever moves or tears), but the
      analog character is much deeper: luma bandwidth blur, one-line
      vertical soften, color-under chroma smear with a rotating
      dot-crawl phase, scanlines + comb, shadow-weighted grain,
      per-line luma noise, slow chroma mottle + drifting color bands,
      a STATIC head-switch bar at the very bottom, warm tape grade,
      and a soft white knee (highlights bloom, never hard-clip). */
   vec3 c0 = texture2D(tDiffuse, uv).rgb;
   vec3 cB = texture2D(tDiffuse, uv+vec2(0.0022,0.0)).rgb
           + texture2D(tDiffuse, uv-vec2(0.0022,0.0)).rgb
           + texture2D(tDiffuse, uv+vec2(0.0046,0.0)).rgb
           + texture2D(tDiffuse, uv-vec2(0.0046,0.0)).rgb;
   cB *= 0.25;
   c0 = pow(max(c0, 0.0), vec3(0.4545));
   cB = pow(max(cB, 0.0), vec3(0.4545));
   float ln = floor(uv.y*uRes.y*0.5);
   /* color-under: chroma sampled WIDE, on a phase that alternates per
      line and slowly rotates with time - the classic dot crawl. it
      is a COLOR artifact only: no pixel ever changes position. */
   float crawl = mod(ln + floor(uTime*11.0), 2.0)*2.0 - 1.0;
   vec2 cuv = uv + vec2(crawl*0.0011, 0.0);
   vec3 cS = texture2D(tDiffuse, cuv+vec2(0.0033,0.0)).rgb
           + texture2D(tDiffuse, cuv-vec2(0.0033,0.0)).rgb
           + texture2D(tDiffuse, cuv+vec2(0.0068,0.0)).rgb
           + texture2D(tDiffuse, cuv-vec2(0.0068,0.0)).rgb;
   cS *= 0.25;
   cS = pow(max(cS, 0.0), vec3(0.4545));
   float Y  = dot(c0, vec3(0.299,0.587,0.114));
   float Yb = dot(cS, vec3(0.299,0.587,0.114));
   vec3 chroma = (cS - vec3(Yb))*1.05;
   /* vertical soften: one scanline tap (VHS vertical bandwidth) */
   float Yv = pow(max(dot(texture2D(tDiffuse, uv+vec2(0.0,1.4/uRes.y)).rgb, vec3(0.299,0.587,0.114)), 0.0), 0.4545);
   Y = mix(Y, (Y+Yv)*0.5, 0.30*uVHS);
   /* gentle luma trail (bright smears slightly right) */
   float Y2 = pow(max(dot(texture2D(tDiffuse, uv+vec2(0.0052,0.0)).rgb, vec3(0.299,0.587,0.114)), 0.0), 0.4545);
   Y = mix(Y, max(Y, Y2), 0.14*(0.25+0.75*uVHS));
   vec3 col = vec3(Y) + chroma*(1.25*(0.35+0.65*uVHS));
   /* soft scanlines + interlace comb */
   float sc = 0.90 + 0.10*sin(uv.y*uRes.y*2.094);
   col *= mix(1.0, sc, 0.20+0.22*uVHS);
   col *= 1.0 - 0.03*uVHS*mod(ln, 2.0);
   /* per-line luma noise */
   col.r += 0.012*uVHS*(vhsHash(vec2(ln, floor(uTime*24.0)))-0.5);
   /* fine grain, stronger in shadows */
   float n = vhsHash(uv*uRes*0.5 + vec2(fract(uTime*11.3)*73.0, fract(uTime*7.1)*57.0));
   col += (n-0.5)*(0.028+0.024*(1.0-Y)*uVHS);
   /* slow low-frequency chroma mottle (color-under noise) */
   float cm1 = vhsHash(floor(uv*vec2(46.0,34.0)) + vec2(floor(uTime*1.3)*17.0, floor(uTime*0.9)*7.0));
   col.r += (cm1-0.5)*0.013*uVHS;
   col.g -= (cm1-0.5)*0.010*uVHS;
   col.b += (cm1-0.5)*0.011*uVHS;
   /* drifting color-under bands (chroma-only, very faint) */
   float band = vhsHash(vec2(floor(uv.y*9.0), floor(uTime*0.5)+floor(uv.x*3.0)));
   col.rgb += (band-0.5)*vec3(0.010,-0.006,0.008)*uVHS;
   /* head-switch bar: the very bottom of every VHS frame is darkened
      and noisy - a STATIC feature of the format, never a tear */
   float hs = smoothstep(0.030, 0.004, uv.y);
   col = mix(col, col*0.55 + vec3(0.020,0.016,0.014), hs*0.75*uVHS);
   col += hs*(n-0.5)*0.05*uVHS;
   /* tape grade: lifted blacks, mild desat, warm cast */
   col = col*0.93 + vec3(0.016);
   float lum = dot(col, vec3(0.299,0.587,0.114));
   col = mix(vec3(lum), col, 0.87);
   col *= vec3(1.045, 1.0, 0.935);
   /* soft white knee: blown diffusers bloom, VHS never clips hard */
   float hot = smoothstep(0.72, 1.05, max(col.r, max(col.g, col.b)));
   col += vec3(0.06)*hot*uVHS;
   col = min(col, vec3(1.06));
   float vg = smoothstep(1.25, 0.42, length(uv-0.5)*1.55);
   col *= mix(1.0, vg, 0.35);
   gl_FragColor = vec4(col, 1.0);
  }
`,
 depthTest:false, depthWrite:false
});
const postScene = new THREE.Scene();
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), postMat));
const postCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

let vhsMode = 2;
function cycleVHS(){
 vhsMode = (vhsMode+2)%3;   // 2 -> 1 -> 0 -> 2
 postMat.uniforms.uVHS.value   = vhsMode===2 ? 1 : vhsMode===1 ? 0.45 : 0;
 postMat.uniforms.uCurve.value = vhsMode===0 ? 0 : 1;
 updateHUD();
}

/* ================================================================
   AUDIO - procedural WebAudio: mains hum that follows the nearest
   working light (canon: the buzz permeates everything, fluctuates
   severely, and blackout zones fall SILENT), fixture buzz, carpet
   footsteps synced to the bob cycle, tape glitches, distant
   structural thuds, rare scratching from behind the walls (canon
   anomalous sound).
   ================================================================ */
let AC=null, aMaster=null, aBuzzG=null, aHumG=null, aNoiseBuf=null, thudNext=30;
let humFluct=1, humFluctTarget=1, humFluctNext=4, surgeNext=75, surgeT0=-99, scratchNext=50;
function initAudio(){
 if(AC) return;
 try{
  AC = new (window.AudioContext||window.webkitAudioContext)();
  aMaster = AC.createGain(); aMaster.gain.value=0.8; aMaster.connect(AC.destination);
  aNoiseBuf = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
  const nd = aNoiseBuf.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  aHumG = AC.createGain(); aHumG.gain.value=0.05; aHumG.connect(aMaster);
  const o1=AC.createOscillator(); o1.type='sine';     o1.frequency.value=54;
  const g1=AC.createGain(); g1.gain.value=0.8; o1.connect(g1); g1.connect(aHumG); o1.start();
  const o2=AC.createOscillator(); o2.type='triangle'; o2.frequency.value=108;
  const g2=AC.createGain(); g2.gain.value=0.22; o2.connect(g2); g2.connect(aHumG); o2.start();
  const o3=AC.createOscillator(); o3.type='sawtooth'; o3.frequency.value=162;
  const f3=AC.createBiquadFilter(); f3.type='lowpass'; f3.frequency.value=240;
  const g3=AC.createGain(); g3.gain.value=0.05; o3.connect(f3); f3.connect(g3); g3.connect(aHumG); o3.start();
  const hn=AC.createBufferSource(); hn.buffer=aNoiseBuf; hn.loop=true;
  const hf=AC.createBiquadFilter(); hf.type='lowpass'; hf.frequency.value=170;
  const hg=AC.createGain(); hg.gain.value=0.4; hn.connect(hf); hf.connect(hg); hg.connect(aHumG); hn.start();
  aBuzzG=AC.createGain(); aBuzzG.gain.value=0; aBuzzG.connect(aMaster);
  const bo=AC.createOscillator(); bo.type='square'; bo.frequency.value=118;
  const bf=AC.createBiquadFilter(); bf.type='bandpass'; bf.frequency.value=1900; bf.Q.value=1.5;
  const bg=AC.createGain(); bg.gain.value=0.5; bo.connect(bf); bf.connect(bg); bg.connect(aBuzzG); bo.start();
  const bn=AC.createBufferSource(); bn.buffer=aNoiseBuf; bn.loop=true; bn.playbackRate.value=1.8;
  const bnf=AC.createBiquadFilter(); bnf.type='highpass'; bnf.frequency.value=3200;
  const bng=AC.createGain(); bng.gain.value=0.22; bn.connect(bnf); bnf.connect(bng); bng.connect(aBuzzG); bn.start();
 }catch(e){ AC=null; }
}
function sfxStep(v, quiet){
 if(!AC || AC.state!=='running') return;
 try{
  const t=AC.currentTime;
  const q = quiet ? 0.35 : 1;
  /* the pad: a soft low thud (heel) */
  const src=AC.createBufferSource(); src.buffer=aNoiseBuf;
  src.playbackRate.value=0.85+Math.random()*0.2;
  const f=AC.createBiquadFilter(); f.type='lowpass';
  f.frequency.value=240+Math.random()*120;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.20*v*q, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.10);
  src.connect(f); f.connect(g); g.connect(aMaster);
  src.start(t, Math.random()*1.5, 0.12);
  /* the fibers: a short dry swish (carpet pile springing back) */
  const src2=AC.createBufferSource(); src2.buffer=aNoiseBuf;
  src2.playbackRate.value=1.4+Math.random()*0.4;
  const f2=AC.createBiquadFilter(); f2.type='bandpass';
  f2.frequency.value=1700+Math.random()*700; f2.Q.value=0.8;
  const g2=AC.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.045*v*q, t+0.012);
  g2.gain.exponentialRampToValueAtTime(0.0001, t+0.14);
  src2.connect(f2); f2.connect(g2); g2.connect(aMaster);
  src2.start(t, Math.random()*1.5, 0.16);
 }catch(e){}
}
function sfxThud(){
 if(!AC || AC.state!=='running') return;
 try{
  const t=AC.currentTime;
  const o=AC.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(64, t);
  o.frequency.exponentialRampToValueAtTime(36, t+0.5);
  const g=AC.createGain();
  g.gain.setValueAtTime(0.07, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.7);
  o.connect(g); g.connect(aMaster);
  o.start(t); o.stop(t+0.75);
 }catch(e){}
}
function sfxScratch(){
 /* something sharpening its nails behind the walls - a few dry
    scrapes, very quiet, subliminal */
 if(!AC || AC.state!=='running') return;
 try{
  const t=AC.currentTime;
  const n=3+((Math.random()*4)|0);
  for(let k=0;k<n;k++){
   const t0=t+k*(0.16+Math.random()*0.2);
   const src=AC.createBufferSource(); src.buffer=aNoiseBuf;
   src.playbackRate.value=0.5+Math.random()*0.5;
   const f=AC.createBiquadFilter(); f.type='bandpass';
   f.frequency.value=800+Math.random()*900; f.Q.value=6+Math.random()*5;
   const g=AC.createGain();
   g.gain.setValueAtTime(0.0001, t0);
   g.gain.exponentialRampToValueAtTime(0.03+Math.random()*0.015, t0+0.02);
   g.gain.exponentialRampToValueAtTime(0.0001, t0+0.11+Math.random()*0.07);
   src.connect(f); f.connect(g); g.connect(aMaster);
   src.start(t0, Math.random()*1.5, 0.2);
  }
 }catch(e){}
}
function updateAudio(dt){
 if(!AC) return;
 /* canon: the light noise "fluctuates severely and randomly" */
 if(T > humFluctNext){
  humFluctNext = T + 3 + Math.random()*7;
  humFluctTarget = 0.5 + Math.random()*1.1;
 }
 humFluct = damp(humFluct, humFluctTarget, 1.5, dt);
 /* surge: rare, the hum swells to an obtrusive roar */
 if(T > surgeNext){ surgeNext = T + 80 + Math.random()*140; surgeT0 = T; }
 const sg = Math.exp(-Math.max(0, T-surgeT0)*0.45);
 aHumG.gain.value = damp(aHumG.gain.value,
  Math.min(0.3, audioHumTarget*humFluct + 0.055*sg), 6, dt);
 aBuzzG.gain.value = damp(aBuzzG.gain.value, audioBuzzTarget + 0.06*sg, 8, dt);
 if(T > scratchNext){ scratchNext = T + 50 + Math.random()*100; sfxScratch(); }
 if(T > thudNext){ thudNext = T + 35 + Math.random()*55; sfxThud(); }
}

/* ================================================================
   DUST v10 - floating motes drifting in a 20m box around the player,
   settling slowly, wrapping when they fall out of range. each mote's
   brightness = proximity to the nearest working fixtures, so dust
   READS in the light pools and vanishes in the dark zones. one
   additive Points draw call, updated on the CPU (~620 motes).
   ================================================================ */
const DUST_N = 620;
const dustPos = new Float32Array(DUST_N*3);
const dustCol = new Float32Array(DUST_N*3);
const dustVel = new Float32Array(DUST_N*3);
const dustPh  = new Float32Array(DUST_N);
function dustReset(k){
 dustPos[k*3]   = player.pos.x + (Math.random()*20-10);
 dustPos[k*3+1] = 0.15 + Math.random()*(H-0.55);
 dustPos[k*3+2] = player.pos.z + (Math.random()*20-10);
 dustVel[k*3]   = (Math.random()-0.5)*0.035;
 dustVel[k*3+1] = -0.006 - Math.random()*0.018;
 dustVel[k*3+2] = (Math.random()-0.5)*0.035;
 dustPh[k]      = Math.random()*20;
}
for(let k=0;k<DUST_N;k++) dustReset(k);
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('color',    new THREE.BufferAttribute(dustCol, 3));
const dustTex = (()=>{
 const cv=document.createElement('canvas'); cv.width=cv.height=32;
 const g=cv.getContext('2d');
 const gr=g.createRadialGradient(16,16,1,16,16,15);
 gr.addColorStop(0,'rgba(255,250,235,1)');
 gr.addColorStop(0.45,'rgba(255,250,235,0.40)');
 gr.addColorStop(1,'rgba(255,250,235,0)');
 g.fillStyle=gr; g.fillRect(0,0,32,32);
 return new THREE.CanvasTexture(cv);
})();
const dustMat = new THREE.PointsMaterial({size:0.026, map:dustTex, vertexColors:true,
 transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true});
const dustPts = new THREE.Points(dustGeo, dustMat);
dustPts.frustumCulled = false;
scene.add(dustPts);
function updateDust(dt){
 const px=player.pos.x, pz=player.pos.z;
 const NL = Math.min(3, lightCands.length);
 for(let k=0;k<DUST_N;k++){
  let x=dustPos[k*3], y=dustPos[k*3+1], z=dustPos[k*3+2];
  x += (dustVel[k*3]   + 0.016*Math.sin(T*0.4+dustPh[k]))*dt*3.0;
  z += (dustVel[k*3+2] + 0.016*Math.cos(T*0.33+dustPh[k]*1.3))*dt*3.0;
  y += dustVel[k*3+1]*dt*3.0;
  if(y<0.06 || y>H-0.10 || Math.abs(x-px)>10.5 || Math.abs(z-pz)>10.5){
   dustReset(k); x=dustPos[k*3]; y=dustPos[k*3+1]; z=dustPos[k*3+2];
  }
  dustPos[k*3]=x; dustPos[k*3+1]=y; dustPos[k*3+2]=z;
  let b=0.045;
  for(let q=0;q<NL;q++){
   const f=lightCands[q].f;
   const d=Math.hypot(f.x-x, f.z-z);
   b += Math.max(0, 1-d/6.5)*0.60;
  }
  b *= 0.72+0.28*Math.sin(T*2.1+dustPh[k]*3.7);   // twinkle
  dustCol[k*3]=b; dustCol[k*3+1]=b*0.97; dustCol[k*3+2]=b*0.86;
 }
 dustGeo.attributes.position.needsUpdate = true;
 dustGeo.attributes.color.needsUpdate = true;
}

/* ================================================================
   HUD / MAIN LOOP / SEEDS
   ================================================================ */
const elClock=document.getElementById('hudclock'),
      elDate=document.getElementById('huddate'), elTape=document.getElementById('hudtape'),
      elSeed=document.getElementById('hudseed'), elFps=document.getElementById('hudfps'),
      elMode=document.getElementById('hudmode'), elStart=document.getElementById('start'),
      elGo=document.getElementById('golabel'), elHud=document.getElementById('hud');
const MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
let fpsVal=0;

function updateHUD(){
 const d=new Date();
 let hh=d.getHours(); const am=hh<12?'AM':'PM'; hh=hh%12||12;
 elClock.textContent = String(hh).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')+' '+am;
 elDate.textContent = MONTHS[d.getMonth()]+'.'+String(d.getDate()).padStart(2,'0')+' '+(1983+((SEED>>>3)%14));
 const mm=Math.floor(elapsed/60), ss=Math.floor(elapsed%60);
 elTape.textContent = 'TAPE '+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
 elSeed.textContent = 'TAPE #'+((SEED>>>0).toString(16).toUpperCase()).padStart(8,'0').slice(0,6);
 elMode.textContent = vhsMode===2?'AUX':vhsMode===1?'SP':'OFF';
 elFps.textContent  = fpsVal ? fpsVal+' FPS' : '';
}


function setSeed(s, silent){
 SEED = s|0;
 diagCache.clear();
 roomAnchorCache.clear();
 roomCellCache.clear();
 edgeCache.clear();                                  // v12: seal-guard edge cache is seed-dependent
 for(const k of Array.from(chunks.keys())) disposeChunk(k);
 curCi=1e9; curCj=1e9; pending.length=0;
 player.pos.set(2,0,2); player.vel.set(0,0,0);
 player.yaw=0; player.pitch=0; player.roll=0; player.prevYaw=0; player.yawRateS=0;
player.leanPitch=0; player.vFs=0; player.vSs=0; player.aFs=0; player.pVF=0; player.spdS=0;
 player.bobPhase=0; player.bobEnv=0; player.bobY=0; player.bobLat=0; player.bobRoll=0;
 player.bobYaw=0; player.crouchA=0; player.sprintA=0; player.eye=1.62;
 player.lastStep=-1;
 elapsed=0;
 ensureChunks(true);
 if(!silent){ sfxThud(); }
 try{ history.replaceState(null, '', location.pathname+'?seed='+SEED); }catch(e){}
 updateHUD();
}

function onResize(){
 applyRenderSize();
}
addEventListener('resize', onResize);

/* ================================================================
   DYNAMIC RESOLUTION - if the machine can't hold ~45fps the render
   scale steps down (floor 0.55x) and claws back up when there is
   headroom. the VHS look survives a lower internal res gracefully
   (tape was never sharp), so this is the main defense against
   "very performance heavy" on weak GPUs.
   ================================================================ */
let perfScale = 1, perfCooldown = 2.5;
function applyRenderSize(){
 renderer.setPixelRatio(BASE_PR*perfScale);
 renderer.setSize(innerWidth, innerHeight);
 renderer.getDrawingBufferSize(dbSize);
 rt.setSize(dbSize.x, dbSize.y);
 postMat.uniforms.uRes.value.copy(dbSize);
 camera.aspect = innerWidth/innerHeight;
 camera.updateProjectionMatrix();
}
function updatePerf(dt){
 perfCooldown -= dt;
 if(perfCooldown>0 || !fpsVal) return;
 if(fpsVal < 42 && perfScale > 0.55){
  perfScale = Math.max(0.55, perfScale-0.15);
  applyRenderSize();
  perfCooldown = 2.5;
 } else if(fpsVal > 57 && perfScale < 1){
  perfScale = Math.min(1, perfScale+0.1);
  applyRenderSize();
  perfCooldown = 4;
 }
}

elStart.addEventListener('click', ()=>{
 initAudio();
 try{ renderer.domElement.requestPointerLock(); }catch(e){}
});
document.addEventListener('pointerlockchange', ()=>{
 locked = !!document.pointerLockElement;
 if(locked){
  elStart.style.display='none';
  elHud.classList.add('on');
  if(AC && AC.state==='suspended') AC.resume();
  player.prevYaw = player.yaw;
 } else {
  elStart.style.display='flex';
  elGo.innerHTML='&#9616;&#9616; PAUSED &mdash; CLICK TO RESUME';
  elHud.classList.remove('on');
  for(const k in keys) keys[k]=false;
  if(AC && AC.state==='running') AC.suspend();
 }
});

 let last = performance.now()/1000, fpsFrames=0, fpsT=0, hudT=0;
function frame(){
 requestAnimationFrame(frame);
 const now = performance.now()/1000;
 let dt = now - last; last = now;
 if(dt > 0.3) dt = 0.016;      // tab-back protection
 dt = Math.min(dt, 0.05);
 T += dt;
 if(locked){ elapsed += dt; updatePlayer(dt); } else composeCamera();
 ensureChunks(false);
 updateFixturesNear();
 updateLights(dt);
 updateAudio(dt);
 updateDust(dt);
 postMat.uniforms.uTime.value = T;
 if(vhsMode===0){
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
 } else {
  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);
 } fpsFrames++; fpsT += dt;
 if(fpsT >= 0.5){ fpsVal = Math.round(fpsFrames/fpsT); fpsFrames=0; fpsT=0; }
 updatePerf(dt);
 hudT += dt;
 if(hudT >= 0.25){ hudT=0; updateHUD(); }
}

/* ---------------- boot ---------------- */
setSeed((()=>{
 const m = location.search.match(/seed=(-?\d+)/);
 return m ? (+m[1]) : ((Math.random()*0x7fffffff)|0);
})(), true);
updateHUD();
requestAnimationFrame(frame);
/* test/debug hook (harmless in production) */
try{ window.__br = {
 setSeed, roomAt, edge, crawlAt, diagAt, pillarAt, cellFixture, inCorrX, inCorrZ, zoneOf, density,
 player, chunks, H, CELL, CRAWL_Y, buildStats:()=>({ms:BUILD_MS, n:BUILD_N, avg:+(BUILD_MS/Math.max(1,BUILD_N)).toFixed(1)}),
 tp:(x,z)=>{ player.pos.set(x,0,z); player.vel.set(0,0,0); ensureChunks(true); }
}; }catch(e){}
</script>
