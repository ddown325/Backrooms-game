<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================================================================
   LEVEL 0 - THE BACKROOMS  (v12)
   single file / seeded infinite generation / world-space UV
   textures / fully baked vertex lighting / VHS+barrel post fx.
   v12: THE LIGHT + LIMINALITY PASS. every troffer is ON and the
   light now truly COMES FROM THE FIXTURES: the 8-spotlight pool
   (whose shadow maps bled light under walls, and which left
   everything beyond the nearest 8 fixtures flat) is deleted.
   instead every chunk BAKES the light of all its fixtures into
   vertex colors with true 2D line-of-sight against a wall
   bitmap: carpet pools that stop AT walls and pour through
   doorways, walls graded bright near fixtures, tight warm
   spill halos on the ceiling grid. zero runtime light cost,
   zero under-wall leaks, the glowing grid runs to the fog.
   WORLD GEN is re-uniformed for the liminal feel: the v11
   district ladder (empty colonnade halls vs closed room mazes -
   "too open and closed") is gone. ONE porous vocabulary
   everywhere: shorter wall runs, 1-2 deliberate openings each,
   a few long half-wall partitions, rarer smaller rooms that
   carry a SECOND broad opening, sparse posts instead of pillar
   forests, and a SEAL GUARD that guarantees no cell is ever
   fully boxed in. the endless same-yellow partitioned floor of
   the original image.
   ================================================================ */

/* ---------------- utils ---------------- */
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const damp  = (c,t,r,dt)=> c + (t-c)*(1-Math.exp(-r*dt));
function h2i(x, y, s){
 let h = (Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263) + Math.imul(s|0, 144066263))|0;
 h = Math.imul(h ^ (h>>>13), 1274126177);
 h ^= h>>>16;
 return (h>>>0)/4294967296;
}
function vnoise(x, y, s, wl){
 const gx=Math.floor(x/wl), gy=Math.floor(y/wl);
 const fx=x/wl-gx, fy=y/wl-gy;
 const u=fx*fx*(3-2*fx), v=fy*fy*(3-2*fy);
 const a=h2i(gx,gy,s), b=h2i(gx+1,gy,s), c=h2i(gx,gy+1,s), d=h2i(gx+1,gy+1,s);
 return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
}

/* ---------------- renderer / scene / camera ---------------- */
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
const BASE_PR = Math.min(devicePixelRatio||1, 1.25);
renderer.setPixelRatio(BASE_PR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.55;
/* v12: NO shadow maps, NO dynamic lights - the fixture light is
   fully baked per-vertex (see buildBake) with real 2D wall
   occlusion, so light can never bleed under or through a wall,
   and every fixture on the lattice contributes, not just the
   nearest 8. the only dynamic light left is the soft warm
   hemisphere that keeps shadowed zones readable. */
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a1f0e);
scene.fog = new THREE.FogExp2(0x2a1f0e, 0.027);

const camera = new THREE.PerspectiveCamera(74, innerWidth/innerHeight, 0.06, 120);
camera.rotation.order = 'YXZ';

/* ---------------- procedural textures (world-space UV) ---------------- */
function canvasTex(w, h, draw){
 const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
 draw(cv.getContext('2d'), w, h);
 const t = new THREE.CanvasTexture(cv);
 t.wrapS = t.wrapT = THREE.RepeatWrapping;
 t.colorSpace = THREE.SRGBColorSpace;
 t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
 return t;
}

/* canon sickly-yellow wallpaper. v9: THE stripe finally READS -
   two-tone 16cm bands with a crisp dark pinstripe + light reed
   at every boundary (the iconic pattern was nearly invisible in
   v8), plus paper punctures, heavier bottom grime, drips, damp.
   every period still divides 2048 exactly, so the pattern tiles
   with ZERO wrap seams. v = full 3.02m wall height so damp
   stains and floor grime never stack vertically. */
const texWall = canvasTex(2048, 2048, (g,w,h)=>{
 g.fillStyle = '#c9b76b'; g.fillRect(0,0,w,h);
 for(let x=0;x<w;x+=128){                       // 16cm two-tone stripes, 8 per repeat
  g.fillStyle = ((x/128)%2) ? 'rgba(46,34,12,0.10)' : 'rgba(255,248,214,0.07)';
  g.fillRect(x,0,128,h);
  g.fillStyle='rgba(255,249,222,0.13)'; g.fillRect(x,0,2,h);      // light reed
  g.fillStyle='rgba(40,28,9,0.24)';    g.fillRect(x+126,0,2,h);   // dark boundary pinstripe
  g.fillStyle='rgba(40,28,9,0.08)';    g.fillRect(x+62,0,1,h);    // faint mid line
 }
 for(let x=0;x<w;x+=256){                       // 32cm soft luminance banding
  g.fillStyle='rgba(255,249,222,0.022)'; g.fillRect(x+128,0,128,h);
 }
 for(let x=0;x<=w;x+=512){                      // 64cm wallpaper panel seams
  g.fillStyle='rgba(24,17,6,0.16)';    g.fillRect(x-1,0,2,h);
  g.fillStyle='rgba(255,246,208,0.06)'; g.fillRect(x+1,0,2,h);
 }
 for(let i=0;i<14000;i++){                      // long vertical fiber streaks
  const x=Math.random()*w, y=Math.random()*h, l=20+Math.random()*150;
  g.fillStyle = Math.random()<0.5 ? 'rgba(30,22,8,0.032)' : 'rgba(255,250,224,0.025)';
  g.fillRect(x,y,1,l);
 }
 for(let i=0;i<30000;i++){
  g.fillStyle = Math.random()<0.5 ? 'rgba(30,22,8,0.055)' : 'rgba(255,250,224,0.045)';
  g.fillRect(Math.random()*w, Math.random()*h, 1, 1);
 }
 for(let i=0;i<70;i++){                         // paper punctures / old pinholes
  g.fillStyle='rgba(26,18,6,'+(0.10+Math.random()*0.12).toFixed(3)+')';
  g.fillRect(Math.random()*w, Math.random()*h*0.9, 1+Math.random()*2, 1+Math.random()*2);
 }
 for(let i=0;i<20;i++){                         // broad damp stains (some high on the wall)
  const r=60+Math.random()*190, x=Math.min(Math.max(r,Math.random()*w),w-r),
        y=h*(Math.random()<0.3?0.18:0.45)+Math.random()*h*0.5;
  const gr=g.createRadialGradient(x,y,4,x,y,r);
  gr.addColorStop(0,'rgba(70,52,16,0.13)'); gr.addColorStop(1,'rgba(70,52,16,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
 }
 for(let i=0;i<56;i++){                         // drips under seams / stains
  const x=(Math.random()<0.6 ? Math.floor(Math.random()*3)*512 : Math.random()*w);
  const y=Math.random()*h*0.6, l=60+Math.random()*220;
  g.fillStyle='rgba(58,44,15,0.06)'; g.fillRect(x,y,1+Math.random()*2,l);
 }
 let lg=g.createLinearGradient(0,h,0,h-240);    // floor grime band
 lg.addColorStop(0,'rgba(36,27,10,0.27)'); lg.addColorStop(1,'rgba(36,27,10,0)');
 g.fillStyle=lg; g.fillRect(0,h-240,w,240);
 for(let i=0;i<34;i++){                         // splotchy grime spots near floor
  g.fillStyle='rgba(30,22,8,'+(0.05+Math.random()*0.08).toFixed(3)+')';
  g.fillRect(Math.random()*w, h-40-Math.random()*180, 3+Math.random()*8, 2+Math.random()*5);
 }
 lg=g.createLinearGradient(0,0,0,80);           // ceiling-line AO
 lg.addColorStop(0,'rgba(28,22,9,0.15)'); lg.addColorStop(1,'rgba(28,22,9,0)');
 g.fillStyle=lg; g.fillRect(0,0,w,80);
 /* large-scale variation: the second 1.28m roll is sun-faded
    and grimier than the first - long walls CHANGE */
 g.fillStyle='rgba(255,246,214,0.055)'; g.fillRect(1024,0,1024,h);
 g.fillStyle='rgba(52,40,15,0.035)';    g.fillRect(1472,0,384,h);
 g.fillStyle='rgba(255,248,222,0.035)'; g.fillRect(288,0,192,h);
 for(let i=0;i<60;i++){                         // floor-line scuffs
  const x=Math.random()*w, y=h-24-Math.random()*130;
  g.strokeStyle='rgba(26,18,6,'+(0.06+Math.random()*0.11).toFixed(3)+')';
  g.lineWidth=1+Math.random()*2.5;
  g.beginPath(); g.moveTo(x,y);
  g.lineTo(x+(Math.random()-0.5)*46, y+(Math.random()-0.5)*10); g.stroke();
 }
 for(let i=0;i<16;i++){                         // chalky impact marks at body height
  const x=Math.random()*w, y=h*0.42+Math.random()*h*0.22, r=8+Math.random()*26;
  const gr=g.createRadialGradient(x,y,1,x,y,r);
  gr.addColorStop(0,'rgba(255,250,226,0.10)'); gr.addColorStop(1,'rgba(255,250,226,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
 }
 for(let i=0;i<5;i++){                          // huge wall-wide damp zones
  const r=260+Math.random()*240, x=Math.min(Math.max(r,Math.random()*w),w-r),
        y=h*0.3+Math.random()*h*0.5;
  const gr=g.createRadialGradient(x,y,30,x,y,r);
  gr.addColorStop(0,'rgba(64,47,15,0.09)'); gr.addColorStop(1,'rgba(64,47,15,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
 }
});

/* damp short-pile carpet (canon: brownish-beige - it only LOOKS
   yellow under the harsh fluorescents). v9: the gamey diamond
   lattice is deleted; real loop-pile speckle + directional nap
   rows + organic damp blotches + dark spill cores + traffic
   sheen. 2048px = 4m. */
const texCarpet = canvasTex(2048, 2048, (g,w,h)=>{
 g.fillStyle='#7e6f46'; g.fillRect(0,0,w,h);
 /* v7: per-meter tile tint jitter (4x4 tiles of 512px = 1m each) */
 for(let ty=0;ty<4;ty++)for(let tx=0;tx<4;tx++){
  const tv=(Math.random()-0.5)*0.085;
  g.fillStyle = tv<0 ? 'rgba(0,0,0,'+(-tv).toFixed(3)+')'
                     : 'rgba(222,208,150,'+tv.toFixed(3)+')';
  g.fillRect(tx*512, ty*512, 512, 512);
 }
 for(let y=0;y<h;y+=3){                                 // v9: directional nap rows
  g.fillStyle='rgba(0,0,0,'+(0.012+0.014*Math.random()).toFixed(3)+')';
  g.fillRect(0,y,w,1);
 }
 for(let i=0;i<240000;i++){                     // tight-knit loop speckle
  const b = Math.random();
  g.fillStyle = b<0.5 ? 'rgba(24,19,8,'+(0.06+Math.random()*0.09).toFixed(3)+')'
                      : 'rgba(204,186,126,'+(0.045+Math.random()*0.06).toFixed(3)+')';
  g.fillRect(Math.random()*w, Math.random()*h, 2, 2);
 }
 for(let y=2;y<h;y+=4)for(let x=2;x<w;x+=4){    // pinholes at loop corners
  if(Math.random()<0.55){ g.fillStyle='rgba(18,14,5,0.14)'; g.fillRect(x,y,1,1); }
 }
 for(let i=0;i<70;i++){                         // organic damp blotches
  const r=50+Math.random()*180, x=Math.min(Math.max(r,Math.random()*w),w-r), y=Math.random()*h;
  const gr=g.createRadialGradient(x,y,5,x,y,r);
  gr.addColorStop(0,'rgba(22,17,6,'+(0.07+Math.random()*0.08).toFixed(3)+')');
  gr.addColorStop(1,'rgba(22,17,6,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
 }
 for(let i=0;i<9;i++){                          // v9: dark spill cores
  const r=30+Math.random()*70, x=Math.min(Math.max(r,Math.random()*w),w-r), y=Math.random()*h;
  const gr=g.createRadialGradient(x,y,2,x,y,r);
  gr.addColorStop(0,'rgba(16,12,4,0.16)'); gr.addColorStop(1,'rgba(16,12,4,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
 }
 for(let i=0;i<6;i++){                          // room-scale damp zones
  const r=280+Math.random()*300, x=Math.min(Math.max(r,Math.random()*w),w-r), y=Math.random()*h;
  const gr=g.createRadialGradient(x,y,40,x,y,r);
  gr.addColorStop(0,'rgba(20,15,5,'+(0.08+Math.random()*0.06).toFixed(3)+')');
  gr.addColorStop(1,'rgba(20,15,5,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
 }
 for(let i=0;i<4;i++){                          // flattened-nap traffic sheen
  const y=Math.random()*h, a=0.03+Math.random()*0.02;
  const lg=g.createLinearGradient(0,y,0,y+260);
  lg.addColorStop(0,'rgba(0,0,0,0)');
  lg.addColorStop(0.5,'rgba(214,200,142,'+a.toFixed(3)+')');
  lg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=lg; g.fillRect(0,y,w,260);
 }
});

/* 2ft drop-ceiling grid (0.615m tiles), aged mineral fiber. v9:
   real fissured tile texture (pinholes + short random fissure
   strokes), stronger per-tile aging, 5 stained tiles with rings,
   aged T-bars with deep shadow lines. 2048px = 2.46m = 4x4 tiles
   - a real dropped ceiling never reads as one photocopied tile. */
const texCeil = canvasTex(2048, 2048, (g,w,h)=>{
 g.fillStyle='#d9d3c2'; g.fillRect(0,0,w,h);
 for(let tx=0;tx<4;tx++)for(let ty=0;ty<4;ty++){      // per-tile aging (strong)
  const tv=(Math.random()-0.5);
  g.fillStyle = tv<0 ? 'rgba(70,62,45,'+(-tv*0.14).toFixed(3)+')'
                     : 'rgba(255,252,240,'+(tv*0.07).toFixed(3)+')';
  g.fillRect(tx*512, ty*512, 512, 512);
 }
 for(let i=0;i<38000;i++){                      // mineral fiber speckle
  const x=Math.random()*w, y=Math.random()*h;
  if(x%512<14||x%512>498||y%512<14||y%512>498) continue;
  g.fillStyle='rgba(70,62,48,'+(0.05+Math.random()*0.10).toFixed(3)+')';
  g.fillRect(x,y,1+Math.random()*1.6, 1+Math.random()*1.6);
 }
 for(let i=0;i<14000;i++){                       // porous dark pinholes
  const x=Math.random()*w, y=Math.random()*h;
  if(x%512<14||x%512>498||y%512<14||y%512>498) continue;
  g.fillStyle='rgba(38,33,24,'+(0.09+Math.random()*0.11).toFixed(3)+')';
  g.fillRect(x,y,1,1);
 }
 for(let i=0;i<2600;i++){                        // v9: fissure strokes
  const x=Math.random()*w, y=Math.random()*h;
  if(x%512<16||x%512>496||y%512<16||y%512>496) continue;
  const a=Math.random()*Math.PI, l=3+Math.random()*6;
  g.strokeStyle='rgba(60,53,40,'+(0.05+Math.random()*0.06).toFixed(3)+')';
  g.lineWidth=1;
  g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*l, y+Math.sin(a)*l); g.stroke();
 }
 const stain=(x0,y0,rr,al)=>{                   // v9: water stain with rings
  let gr=g.createRadialGradient(x0,y0,10,x0,y0,rr);
  gr.addColorStop(0,'rgba(146,106,48,'+al+')'); gr.addColorStop(0.75,'rgba(146,106,48,'+(al*0.4).toFixed(3)+')');
  gr.addColorStop(1,'rgba(146,106,48,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(x0,y0,rr,0,7); g.fill();
  g.strokeStyle='rgba(112,80,32,'+(al*0.6).toFixed(3)+')'; g.lineWidth=4;
  g.beginPath(); g.arc(x0,y0,rr*0.62,0,7); g.stroke();
  g.beginPath(); g.arc(x0,y0,rr*0.38,0,7); g.stroke();
 };
 stain(512+40, 40, 190, 0.20);                   // tile (1,0)
 stain(120, 512+150, 120, 0.11);                 // faint second
 stain(1536+260, 1024+300, 150, 0.16);           // third stained tile
 stain(1024+200, 1536+120, 170, 0.13);           // v9: fourth
 stain(260, 1024+90, 100, 0.09);                 // v9: fifth
 for(let k=0;k<12;k++){                         // brown edge-staining on random tiles
  const tx2=(Math.random()*4)|0, ty2=(Math.random()*4)|0, side=(Math.random()*4)|0;
  g.fillStyle='rgba(120,92,44,'+(0.05+Math.random()*0.06).toFixed(3)+')';
  if(side===0)      g.fillRect(tx2*512+8, ty2*512+8, 496, 14+Math.random()*30);
  else if(side===1) g.fillRect(tx2*512+8, ty2*512+494-Math.random()*30, 496, 14+Math.random()*30);
  else if(side===2) g.fillRect(tx2*512+8, ty2*512+8, 14+Math.random()*30, 496);
  else              g.fillRect(tx2*512+494-Math.random()*30, ty2*512+8, 14+Math.random()*30, 496);
 }
 for(const k of [0,512,1024,1536,2048]){        // T-bar grid: body+shadow+highlight
  for(const kk of [0,512,1024,1536,2048]){
   g.fillStyle='rgba(0,0,0,0.28)'; g.fillRect(kk-7,k-7,14,14);
  }
  g.fillStyle='#938c7d'; g.fillRect(k-5,0,10,h); g.fillRect(0,k-5,w,10);
  g.fillStyle='rgba(0,0,0,0.30)'; g.fillRect(k-8,0,3,h); g.fillRect(0,k-8,w,3);
  g.fillStyle='rgba(0,0,0,0.30)'; g.fillRect(k+5,0,3,h); g.fillRect(0,k+5,w,3);
  g.fillStyle='#d8d2c4'; g.fillRect(k-1,0,2,h); g.fillRect(0,k-1,w,2);
 }
});

/* painted trim (baseboards / door casing), 0.75m x 0.14m */
const texTrim = canvasTex(256, 64, (g,w,h)=>{
 g.fillStyle='#d8cfbc'; g.fillRect(0,0,w,h);
 for(let i=0;i<420;i++){
  g.fillStyle = Math.random()<0.5 ? 'rgba(90,80,60,0.03)' : 'rgba(255,252,240,0.03)';
  g.fillRect(Math.random()*w, Math.random()*h, 3+Math.random()*10, 1);
 }
 const lg=g.createLinearGradient(0,h,0,h-12);
 lg.addColorStop(0,'rgba(45,38,26,0.28)'); lg.addColorStop(1,'rgba(45,38,26,0)');
 g.fillStyle=lg; g.fillRect(0,h-12,w,12);
